id: TC_LIST_04
title: Open invoice from All Invoices
feature: invoice
priority: High
description: Tapping the first row on All Invoices opens the invoice detail.
preconditions: Logged in with the DEFAULT E2E account (role with customer search and
  invoice access), app on the Home screen (online). The first customer in “Customers”
  has at least 5 invoices (so “Show All” appears under “Invoice”) and at least one
  service location.
detox_reference: '[TC_04][DOC+] User taps invoice row and views detail'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Invoice]
  action: tap_selector
  text: Invoice
  delay: 1.0
- desc: Chạm vào mục [All Invoices]
  action: tap_selector
  text: All Invoices
  delay: 1.0
expected:
- assert_text: Invoice
  desc: Hiển thị 'Invoice' trên màn hình
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Invoice" section
  and tap its "Show All". (3) On "All Invoices", tap the first invoice row. After
  step 3, the invoice detail screen (header "Invoice" with the invoice number and
  status) should be displayed.
