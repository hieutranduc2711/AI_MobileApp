id: TC_LIST_02
title: Add invoice from All Invoices
feature: invoice
priority: High
description: The plus button on All Invoices starts a new invoice at location selection.
preconditions: Logged in with the DEFAULT E2E account (role with customer search and
  invoice access), app on the Home screen (online). The first customer in “Customers”
  has at least 5 invoices (so “Show All” appears under “Invoice”) and at least one
  service location.
detox_reference: '[TC_02][DOC+] User taps add button and navigates to location selection'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Invoice]
  action: tap_selector
  text: Invoice
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Invoice" section
  and tap its "Show All". (3) On "All Invoices", tap the plus icon at the top-right.
