id: SENDSMS-sendSmsElements-13
title: All Documents SMS over 600
feature: sendsms
priority: High
description: Sending more than 600 characters from a document opened via Show All
  is refused.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on, Admin-like role),
  app on the Home screen (online). The first customer in “Customers” has a phone number,
  at least one invoice and estimate (5 or more of each for the Show All cases), a
  document in “Documents” and a job in “Jobs”. No SMS is sent (only validation errors
  are triggered).
detox_reference: 'DOCUMENT_SHOW_ALL: shows error when SMS content exceeds 600 chars'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Chạm vào mục [Send]
  action: tap_selector
  text: Send
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Send by SMS
  desc: Hiển thị 'Send by SMS' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to "Documents", tap "Show
  All" if shown, tap the first document and choose "Send by SMS". After step 2, the
  "Send by SMS" screen should be displayed. (3) Replace the message with 601 letters
  a and tap "Send"; if the "Messages exceed 600 characters" dialog appears, tap "OK".
  (4) Tap the back arrow at the top-left. If there is no "Documents" section or document,
  stop and report the test as skipped: no document.'
