id: SENDSMS-sendSmsElements-06
title: Estimate SMS blank content
feature: sendsms
priority: High
description: Sending an empty SMS from an estimate is refused.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on, Admin-like role),
  app on the Home screen (online). The first customer in “Customers” has a phone number,
  at least one invoice and estimate (5 or more of each for the Show All cases), a
  document in “Documents” and a job in “Jobs”. No SMS is sent (only validation errors
  are triggered).
detox_reference: 'ESTIMATE: shows error when SMS content is blank'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Estimate]
  action: tap_selector
  text: Estimate
  delay: 1.0
- desc: Chạm vào mục [Enter text here]
  action: tap_selector
  text: Enter text here
  delay: 1.0
expected:
- assert_text: Send by SMS
  desc: Hiển thị 'Send by SMS' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to "Estimate", tap its first
  estimate, then the three-dots icon and "Send by SMS". After step 2, the "Send by
  SMS" screen should be displayed. (3) Clear the message field ("Enter text here")
  and tap "Send"; if the "SMS content can not be blank." dialog appears, tap "OK".
  If the customer has no estimate, stop and report the test as skipped: no estimate.'
