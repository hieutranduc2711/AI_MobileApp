id: SENDSMS-sendSmsElements-09
title: Estimate SMS over 600 (show-all group)
feature: sendsms
priority: High
description: Sending more than 600 characters from an estimate is refused.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on, Admin-like role),
  app on the Home screen (online). The first customer in “Customers” has a phone number,
  at least one invoice and estimate (5 or more of each for the Show All cases), a
  document in “Documents” and a job in “Jobs”. No SMS is sent (only validation errors
  are triggered).
detox_reference: 'ESTIMATE_SHOW_ALL: shows error when SMS content exceeds 600 chars'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Estimate]
  action: tap_selector
  text: Estimate
  delay: 1.0
- desc: Chạm vào mục [Send]
  action: tap_selector
  text: Send
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Send by SMS
  desc: Hiển thị 'Send by SMS' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to "Estimate", tap its first
  estimate, then the three-dots icon and "Send by SMS". After step 2, the "Send by
  SMS" screen should be displayed. (3) Replace the message with 601 letters a and
  tap "Send"; if the "Messages exceed 600 characters" dialog appears, tap "OK". (4)
  Tap the back arrow at the top-left. If the customer has no estimate, stop and report
  the test as skipped: no estimate.'
