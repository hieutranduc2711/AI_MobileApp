id: MAP_E2E_013
title: Optional map actions may be absent
feature: map
priority: High
description: The map opens whether or not the gated add and estimation-tools buttons
  are present.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online);
  location permission granted (Detox launches with location always). Detox relaunches
  the app after each case.
detox_reference: '[MAP_E2E_013][DOC+][Map] User opens map with missing optional actions
  and test exits safely without false failure'
steps:
- desc: Report whether the plus button and the estimation tools button are present
    in th
  action: tap_selector
  text: Report whether the plus button
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen and show the map (if the
  calendar is shown, tap the map button at the bottom left, next to "Today"). (1)
  Report whether the plus button and the estimation tools button are present in the
  bottom-right button column; their absence is not a failure. If the map cannot be
  shown, stop and report the test as skipped: map view not available.'
