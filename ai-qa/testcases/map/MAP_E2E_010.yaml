id: MAP_E2E_010
title: Home map view loads
feature: map
priority: High
description: The logged-in user can switch Home to the map and the map loads.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online);
  location permission granted (Detox launches with location always).
detox_reference: '[MAP_E2E_010][DOC+][Map] User lands on authenticated home and sees
  map loaded'
steps:
- desc: Mở màn hình Calendar Home
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen and show the map (if the
  calendar is shown, tap the map button at the bottom left, next to "Today"). At the
  end, the map should be displayed with the filter button at the top of its bottom-left
  button column. If the map cannot be shown, stop and report the test as skipped:
  map view not available.'
