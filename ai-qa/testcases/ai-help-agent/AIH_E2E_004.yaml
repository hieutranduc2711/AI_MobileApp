id: AIH_E2E_004
title: Ask anything opens conversation history
feature: ai-help-agent
priority: High
description: The Ask anything card opens the conversation history with at least one
  conversation.
preconditions: Logged in with the DEFAULT E2E account on the Home screen, online (the
  drawer Help rows are disabled offline). AIH_E2E_004, 005, 008, 009, 010 and 012
  need at least one past AI Help Agent conversation (they report skipped otherwise;
  a run of AIH_E2E_007 or 011 creates one). AIH_E2E_007, 010, 011 and 012 send real
  messages to the AI agent.
detox_reference: '[AIH_E2E_004][DOC+][Home] User taps Home History and sees Conversation
  history list'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [AI Help Agent] trong Drawer Menu
  action: tap_selector
  content_desc: AI Help Agent
  delay: 1.2
- desc: Chạm vào mục [Ask anything]
  action: tap_selector
  text: Ask anything
  delay: 1.0
expected:
- assert_text: the conversation history list
  desc: the conversation history list
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "AI Help Agent" under "Help" (scroll the menu if needed). (2) Tap the
  "Ask anything" card. After step 2, the conversation history list should be displayed.
  If the AI Help Agent does not open, has no "Ask anything" card, or the history has
  no conversations, stop and report the test as skipped: history not available.'
