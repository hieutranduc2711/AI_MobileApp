id: AIH_E2E_007
title: Send from home shows user message
feature: ai-help-agent
priority: High
description: Sending from the home input opens the chat and shows the sent user message.
preconditions: Logged in with the DEFAULT E2E account on the Home screen, online (the
  drawer Help rows are disabled offline). AIH_E2E_004, 005, 008, 009, 010 and 012
  need at least one past AI Help Agent conversation (they report skipped otherwise;
  a run of AIH_E2E_007 or 011 creates one). AIH_E2E_007, 010, 011 and 012 send real
  messages to the AI agent.
detox_reference: '[AIH_E2E_007][DOC+][Home] User taps Home send and sees a user message
  in Chat'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [AI Help Agent] trong Drawer Menu
  action: tap_selector
  content_desc: AI Help Agent
  delay: 1.2
- desc: 'Chạm vào mục [E2E: send from Home (<current time>)]'
  action: tap_selector
  text: 'E2E: send from Home (<current time>)'
  delay: 1.0
expected:
- assert_text: Message
  desc: Hiển thị 'Message' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "AI Help Agent" under "Help" (scroll the menu if needed). (2) Type "E2E:
  send from Home (<current time>)" in the "Message" field at the bottom and tap the
  send button. After step 2, the chat with the "Message" input should show that text
  as your message. If the AI Help Agent does not open or has no "Message" field, stop
  and report the test as skipped: home message input not available.'
