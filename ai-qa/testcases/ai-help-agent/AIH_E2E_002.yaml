id: AIH_E2E_002
title: Popular question opens topic
feature: ai-help-agent
priority: High
description: Tapping a popular question opens its topic view with a title.
preconditions: Logged in with the DEFAULT E2E account on the Home screen, online (the
  drawer Help rows are disabled offline). AIH_E2E_004, 005, 008, 009, 010 and 012
  need at least one past AI Help Agent conversation (they report skipped otherwise;
  a run of AIH_E2E_007 or 011 creates one). AIH_E2E_007, 010, 011 and 012 send real
  messages to the AI agent.
detox_reference: '[AIH_E2E_002][DOC+][Home] User taps a popular question and sees
  Topic view'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [AI Help Agent] trong Drawer Menu
  action: tap_selector
  content_desc: AI Help Agent
  delay: 1.2
- desc: Chạm vào mục [Most popular questions]
  action: tap_selector
  text: Most popular questions
  delay: 1.0
expected:
- assert_text: the topic view with the question title
  desc: the topic view with the question title
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "AI Help Agent" under "Help" (scroll the menu if needed). (2) Tap the
  first question under "Most popular questions". After step 2, the topic view with
  the question title should be displayed. If the AI Help Agent does not open or lists
  no popular questions, stop and report the test as skipped: AI Help Agent or popular
  questions not available.'
