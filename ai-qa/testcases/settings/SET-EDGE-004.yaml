id: SET-EDGE-004
title: All Settings manage buttons present
feature: settings
priority: High
description: Settings shows the map button and the Manage buttons of all System Settings
  rows.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-EDGE-004 needs the “System Settings” section on Settings (company setting editSetting
  on; typically a super admin per docs/features/settings.md) — Detox has no skip for
  it; SET-EDGE-003/005 report skipped without it. SET-EDGE-002 needs a device with
  biometrics (the “Log In with …” row), otherwise it reports skipped.
detox_reference: '[SET-EDGE-004] [Settings][Main][P1] all core Settings manage anchors
  stay visible'
steps:
- desc: Mở màn hình Calendar Home
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). At the end, the button next to "Map using" should be displayed,
  and "Manage" buttons for "Company", "Taxes", "Line Items", "Paperwork" and "Sources"
  should be present (scroll if needed).
