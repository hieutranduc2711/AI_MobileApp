id: SET-EDGE-003
title: Taxes open and close twice
feature: settings
priority: High
description: Opening and leaving Taxes twice in a row always returns to Settings.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-EDGE-004 needs the “System Settings” section on Settings (company setting editSetting
  on; typically a super admin per docs/features/settings.md) — Detox has no skip for
  it; SET-EDGE-003/005 report skipped without it. SET-EDGE-002 needs a device with
  biometrics (the “Log In with …” row), otherwise it reports skipped.
detox_reference: '[SET-EDGE-003] [Settings][Main][P1] rapid open-close on taxes screen
  should recover to Settings'
steps:
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap "Manage" next to "Taxes", then press the Android back
  button. (2) Repeat step 1 once. Each time, the header title (id: header-title) should
  read "Taxes" after tapping "Manage" and "Settings" after going back. If there is
  no "Taxes" row, stop and report the test as skipped: taxes not available in this
  account/plan.'
