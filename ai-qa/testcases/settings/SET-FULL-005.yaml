id: SET-FULL-005
title: Paperwork screen opens and returns
feature: settings
priority: High
description: Paperwork Manage opens the Paperwork screen and Android back returns
  to Settings.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-FULL-002…007 need the “System Settings” section on Settings (company setting
  editSetting on; typically a super admin per docs/features/settings.md); without
  it they report skipped (SET-FULL-007 just skips its rows).
detox_reference: '[SET-FULL-005] [Settings][Main][P0] open Paperwork screen and recover
  to Settings'
steps:
- desc: Chạm vào mục [Manage]
  action: tap_selector
  text: Manage
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Paperwork
  desc: Hiển thị 'Paperwork' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap "Manage" next to "Paperwork". After step 1, the header
  title (id: header-title) should read "Paperwork". (2) Press the Android back button.
  At the end, the header title should read "Settings". If there is no "Paperwork"
  row, stop and report the test as skipped: not available in this account/plan.'
