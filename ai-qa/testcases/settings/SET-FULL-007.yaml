id: SET-FULL-007
title: Settings anchors after repeated navigation
feature: settings
priority: High
description: After opening and leaving Taxes and Sources, the Settings map button
  is still displayed.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-FULL-002…007 need the “System Settings” section on Settings (company setting
  editSetting on; typically a super admin per docs/features/settings.md); without
  it they report skipped (SET-FULL-007 just skips its rows).
detox_reference: '[SET-FULL-007] [Settings][Main][P1] maintain settings anchors after
  repeated navigations'
steps:
- desc: Chạm vào mục [Manage]
  action: tap_selector
  text: Manage
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Chạm vào mục [Manage]
  action: tap_selector
  text: Manage
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap "Manage" next to "Taxes". (2) Press the Android back button.
  (3) Tap "Manage" next to "Sources". (4) Press the Android back button. After steps
  1 and 3, the header title (id: header-title) should read "Taxes" and "Sources" respectively.
  After steps 2 and 4, the button next to "Map using" should be displayed. Skip the
  steps of a row that is not shown.'
