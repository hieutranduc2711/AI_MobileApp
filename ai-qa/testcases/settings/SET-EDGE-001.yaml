id: SET-EDGE-001
title: Back to Home, reopen Settings
feature: settings
priority: High
description: Android back from Settings returns to Home and Settings reopens from
  the drawer.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-EDGE-004 needs the “System Settings” section on Settings (company setting editSetting
  on; typically a super admin per docs/features/settings.md) — Detox has no skip for
  it; SET-EDGE-003/005 report skipped without it. SET-EDGE-002 needs a device with
  biometrics (the “Log In with …” row), otherwise it reports skipped.
detox_reference: '[SET-EDGE-001] [Settings][Main][P1] hardware back from Settings
  returns Home and re-open works'
steps:
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Settings] trong Drawer Menu
  action: tap_selector
  content_desc: Settings
  delay: 1.2
expected:
- assert_text: 'the Home screen (id: home-bar)'
  desc: 'the Home screen (id: home-bar)'
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Press the Android back button. After step 1, the Home screen
  (id: home-bar) should be displayed. (2) Tap the top-left menu icon, then "Settings".
  At the end, the header title (id: header-title) should read "Settings".'
