id: SET-FULL-001
title: Map selector opens and returns
feature: settings
priority: High
description: The map selector opens from Settings and Android back returns to Settings.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-FULL-002…007 need the “System Settings” section on Settings (company setting
  editSetting on; typically a super admin per docs/features/settings.md); without
  it they report skipped (SET-FULL-007 just skips its rows).
detox_reference: '[SET-FULL-001] [Settings][Main][P0] open Map selector and recover
  to Settings'
steps:
- desc: Chạm vào mục [Map using]
  action: tap_selector
  text: Map using
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: System Settings
  desc: Hiển thị 'System Settings' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap the button to the right of "Map using". After step 1,
  the header title (id: header-title) should read "System Settings". (2) Press the
  Android back button. At the end, the header title should read "Settings". If there
  is no button next to "Map using", stop and report the test as skipped: not available
  in this account/plan.'
