id: SET-UX-004
title: Company, Taxes, Line Items open and return
feature: settings
priority: High
description: Company, Taxes and Line Items each open from Settings and Android back
  returns to Settings.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-UX-001 needs the “System Settings” section on Settings (company setting editSetting
  on; typically a super admin per docs/features/settings.md) — Detox has no skip for
  it; SET-UX-004 skips rows that are missing. SET-UX-005 needs a device with biometrics
  (the “Log In with …” row), otherwise it reports skipped.
detox_reference: '[SET-UX-004] [Settings][Main][P1] company/taxes/line-items buttons
  can be pressed without dead taps'
steps:
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Chạm vào mục [Taxes]
  action: tap_selector
  text: Taxes
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap "Manage" next to "Company", then press the Android back
  button. (2) Do the same for "Taxes". (3) Do the same for "Line Items". In each step,
  the header title (id: header-title) should read the row name after tapping "Manage"
  and "Settings" after going back. Skip any row that is not shown.'
