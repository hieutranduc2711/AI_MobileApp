id: SET-EDGE-005
title: Sources opens and returns to Settings
feature: settings
priority: High
description: Sources opens from Settings and going back returns to the Settings root.
preconditions: Logged in with the DEFAULT E2E account on the Home screen (online).
  SET-EDGE-004 needs the “System Settings” section on Settings (company setting editSetting
  on; typically a super admin per docs/features/settings.md) — Detox has no skip for
  it; SET-EDGE-003/005 report skipped without it. SET-EDGE-002 needs a device with
  biometrics (the “Log In with …” row), otherwise it reports skipped.
detox_reference: '[SET-EDGE-005] [Settings][Main][P1] recovery helper returns to Settings
  root from nested screens'
steps:
- desc: Chạm vào mục [Manage]
  action: tap_selector
  text: Manage
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Sources
  desc: Hiển thị 'Sources' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Settings screen (top-left menu on Home,
  then "Settings"). (1) Tap "Manage" next to "Sources". After step 1, the header title
  (id: header-title) should read "Sources". (2) Press the Android back button. At
  the end, the header title should read "Settings". If there is no "Sources" row,
  stop and report the test as skipped: sources not available in this account/plan.'
