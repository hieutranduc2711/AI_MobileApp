id: TC_07
title: Pull to refresh Read list
feature: notification
priority: High
description: Pull-to-refresh on the Read list keeps the list displayed.
preconditions: Logged in with the DEFAULT E2E account, app on the Home screen (online).
  TC_05 toggles every notification setting and then restores it; the settings list
  is empty unless the account's editSetting flag is on.
detox_reference: '[TC_07][DOC+][Refresh] User pulls to refresh on read list and sees
  list refreshed'
steps:
- desc: Tap the bell icon in the top bar.
  action: tap_selector
  text: Tap the bell icon in the top b
  delay: 0.8
- desc: Chạm vào mục [Read]
  action: tap_selector
  text: Read
  delay: 1.0
- desc: Pull down on the read list to refresh it.
  action: tap_selector
  text: 'Pull down on the read list to '
  delay: 0.8
expected:
- assert_text: Notifications
  desc: Hiển thị 'Notifications' trên màn hình
- assert_text: the read list (may be empty)
  desc: the read list (may be empty)
- assert_text: the read list
  desc: the read list
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the bell icon in
  the top bar. After step 1, the "Notifications" screen should be displayed. (2) Tap
  the "Read" tab. After step 2, the read list (may be empty) should be displayed.
  (3) Pull down on the read list to refresh it. After step 3, the read list should
  still be displayed.
