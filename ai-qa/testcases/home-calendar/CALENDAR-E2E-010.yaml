  action: tap_selector
  text: Tap the schedule chip in the t
  delay: 0.8
- desc: 'If the schedule list opens, close it by tapping the handle at its top (id:
    indic'
  action: tap_selector
  text: If the schedule list opens, cl
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the schedule chip
  in the top bar (id: button-schedule). (2) If the schedule list opens, close it by
  tapping the handle at its top (id: indicator); after that it should be closed. At
