id: TC_13
title: Collapse Quest Log section
feature: onboarding
priority: High
description: A collapse control hides the whole Quest Log content (skips when no such
  control exists).
preconditions: Logged in with the DEFAULT E2E account, app on the Home screen (online).
  TC_03, TC_06, TC_12 and TC_13 need a non-trial plan (Detox guard E2E_TRIAL_PLAN;
  trial plans hide the tabs). The server Getting Started checklist must contain the
  add-logo, add-customer, add-job, add-invoice and plans-and-pricing items with a
  Start/Done button.
detox_reference: '[TC_13][DOC+][CollapseQuestlogs] User taps to collapse Quest Logs
  section'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Fast Start] trong Drawer Menu
  action: tap_selector
  content_desc: Fast Start
  delay: 1.2
- desc: Chạm vào mục [Quest Log]
  action: tap_selector
  text: Quest Log
  delay: 1.0
- desc: Tap the button that collapses the whole Quest Log content.
  action: tap_selector
  text: 'Tap the button that collapses '
  delay: 0.8
expected:
- assert_text: Alerts
  desc: Hiển thị 'Alerts' trên màn hình
- assert_text: the Quest Log content
  desc: the Quest Log content
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Fast Start" under "Help" (scroll the menu if needed). (2) Tap the "Quest
  Log" tab. After step 2, the Quest Log content with "Alerts" should be displayed.
  (3) Tap the button that collapses the whole Quest Log content. After step 3, the
  Quest Log content should no longer be displayed. If there is no such button (level
  chevrons do not count), stop and report the test as skipped: collapse button not
  found in Quest Logs. If the tabs are not shown, stop and report the test as skipped:
  tabs hidden (trial plan).'
