id: CUSTOMER-customerUx-11
title: Customer header and contact shown
feature: customer
priority: High
description: Customer detail shows its header and contact sections.
preconditions: Logged in with the DEFAULT E2E account (role that can view and add
  customers, e.g. Admin) on the Home screen (online). “Customers” has at least one
  customer. No case saves data (the Detox app relaunch after each case discards the
  forms).
detox_reference: 'customer detail: header + contact sections visible'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Customers] trong Drawer Menu
  action: tap_selector
  content_desc: Customers
  delay: 1.2
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
expected:
- assert_text: Service Locations
  desc: Hiển thị 'Service Locations' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Customers". (2) Tap the first customer. After step 2, the customer header
  with the customer name and the contact section with "Service Locations" should be
  displayed. If the list has no customers, stop and report the test as skipped: no
  customer data.'
