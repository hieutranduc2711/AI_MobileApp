  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Customers] trong Drawer Menu
  action: tap_selector
  content_desc: Customers
  delay: 1.2
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Customers".
