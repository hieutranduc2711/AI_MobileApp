id: TC_HOME_022
title: Time tracking quick action
feature: home
priority: High
description: The time-tracking quick action opens and the user returns Home.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_022] open Time tracking quick action
  then return Home when visible'
steps:
- desc: Tap the time-tracking quick-action button on Home.
  action: tap_selector
  text: Tap the time-tracking quick-ac
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the time-tracking
  quick-action button on Home. (2) If a screen with a back arrow opens, tap the back
  arrow. At the end, the Home screen with its top bar (id: home-bar) should be displayed.
  If there is no time-tracking button, stop and report the test as skipped: time tracking
  not available.'
