id: TC_HOME_021
title: Drive Time button
feature: home
priority: High
description: Tapping Drive Time keeps Home.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_021] tap Drive Time button when visible'
steps:
- desc: Tap the Drive Time button in the calendar footer.
  action: tap_selector
  text: Tap the Drive Time button in t
  delay: 0.8
expected:
- assert_text: 'the top bar (id: home-bar)'
  desc: 'the top bar (id: home-bar)'
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the Drive Time
  button in the calendar footer. After step 1, the top bar (id: home-bar) should be
