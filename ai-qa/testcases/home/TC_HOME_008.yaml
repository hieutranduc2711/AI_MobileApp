id: TC_HOME_008
title: Month mode and swipe
feature: home
priority: High
description: Switching to Month mode shows the calendar, which can be swiped.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_008] switch to Month mode and swipe
  left/right'
steps:
- desc: Chạm vào mục [Calendar View]
  action: tap_selector
  text: Calendar View
  delay: 1.0
- desc: Chạm vào mục [Month]
  action: tap_selector
  text: Month
  delay: 1.0
expected:
- assert_text: the date bar and the calendar
  desc: the date bar and the calendar
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the calendar view
  button at the left of the date bar and, in "Calendar View", tap "Month". After step
  1, the date bar and the calendar should be displayed. (2) Swipe the calendar left,
  then right. If "Month" is not offered, stop and report the test as skipped: mode
  not available.'
