id: TC_HOME_056
title: Agenda first event then Day
feature: home
priority: High
description: In Agenda mode the first event can be opened; the user returns to Day
  mode.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_056] Agenda mode: tap first event row
  when list has events'
steps:
- desc: Chạm vào mục [Calendar View]
  action: tap_selector
  text: Calendar View
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the calendar view
  button at the left of the date bar and, in "Calendar View", tap "Agenda". (2) If
  the agenda list has events, scroll it slightly, tap the first event and go back
  to Home. (3) Switch back to "Day" the same way. At the end, the Home screen with
  its top bar (id: home-bar) should be displayed. If "Agenda" is not offered, stop
  and report the test as skipped: mode not available.'
