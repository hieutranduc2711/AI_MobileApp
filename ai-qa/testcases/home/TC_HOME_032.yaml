id: TC_HOME_032
title: Recurring move dialog options
feature: home
priority: High
description: Dragging a recurring job shows the recurring move dialog with its options.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_032] webview move/resize contract: recurring
  modal actions are selectable'
steps:
- desc: Chạm vào mục [Calendar View]
  action: tap_selector
  text: Calendar View
  delay: 1.0
- desc: Long-press on a job in the calendar, then swipe slowly left and right.
  action: tap_selector
  text: Long-press on a job in the cal
  delay: 0.8
- desc: Chạm vào mục [Update recurring …]
  action: tap_selector
  text: Update recurring …
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) If the date bar is
  not shown, tap the calendar view button at the left of the date bar and, in "Calendar
  View", tap "Day". (2) Long-press on a job in the calendar, then swipe slowly left
  and right. (3) If an "Update recurring …" dialog opens: "Auto-apply this option
  for the rest of my session" and a "Move this … only" button should be displayed;
  tap "Cancel", after which the dialog should be closed. If no recurring dialog appears,
  stop and report the test as skipped: no recurring job moved.'
