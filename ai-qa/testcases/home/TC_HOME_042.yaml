id: TC_HOME_042
title: Dark Mode row and back
feature: home
priority: High
description: The drawer Dark Mode row opens its screen and back returns Home.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_042] drawer: Dark mode row opens Appearance
  then back to Home'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon and scroll the menu down to "Dark Mode". (2) Tap "Dark Mode", then tap the
  back arrow at the top-left. At the end, the Home screen with its top bar (id: home-bar)
  should be displayed. If there is no "Dark Mode" row, stop and report the test as
  skipped: row not shown.'
