id: TC_HOME_054
title: Messaging Send Confirmations and back
feature: home
priority: High
description: Send Confirmations from the Messaging sheet opens its screen; back returns
  Home.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_054] Messaging → Send Confirmations
  → screen → back → Home'
steps:
- desc: Chạm vào mục [Send Confirmations]
  action: tap_selector
  text: Send Confirmations
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the megaphone
  button in the calendar footer, then tap "Send Confirmations". (2) If its screen
  opens, tap the back arrow at the top-left. At the end, the Home screen with its
  top bar (id: home-bar) should be displayed. If there is no megaphone button, stop
  and report the test as skipped: messaging not available.'
