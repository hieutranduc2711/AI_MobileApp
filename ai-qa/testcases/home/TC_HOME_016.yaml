id: TC_HOME_016
title: Next time chevron opens sheet
feature: home
priority: High
description: The inner right double chevron opens the time selection sheet.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_016] open Select time modal via next-time
  chevron and dismiss'
steps:
- desc: Chạm vào mục [Calendar View]
  action: tap_selector
  text: Calendar View
  delay: 1.0
- desc: Tap the double chevron just right of the date.
  action: tap_selector
  text: Tap the double chevron just ri
  delay: 0.8
- desc: 'Close it by tapping the handle at its top (id: indicator).'
  action: tap_selector
  text: Close it by tapping the handle
  delay: 0.8
expected:
- assert_text: a time selection sheet
  desc: a time selection sheet
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) If the date bar is
  not shown, tap the calendar view button at the left of the date bar and, in "Calendar
  View", tap "Day". (2) Tap the double chevron just right of the date. After step
  2, a time selection sheet should be displayed. (3) Close it by tapping the handle
  at its top (id: indicator).'
