id: TC_HOME_007
title: Toggle Show Weekends
feature: home
priority: High
description: The Show Weekends option in Calendar View can be toggled.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_007] week mode: toggle weekend switch
  in Agenda mode modal (unhappy guard)'
steps:
- desc: Tap the calendar view button at the left of the date bar.
  action: tap_selector
  text: Tap the calendar view button a
  delay: 0.8
- desc: Chạm vào mục [Show Weekends]
  action: tap_selector
  text: Show Weekends
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the calendar view
  button at the left of the date bar. (2) If a "Show Weekends" row is shown, tap it;
  after that the sheet should close and the calendar should be displayed. Otherwise
  close it by tapping the handle at its top (id: indicator).'
