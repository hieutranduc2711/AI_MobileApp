  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: 'Close it by tapping the handle at its top (id: indicator). If there is no
    plus b'
  action: tap_selector
  text: Close it by tapping the handle
  delay: 0.8
expected:
- assert_text: Add
  desc: Hiển thị 'Add' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the plus button
