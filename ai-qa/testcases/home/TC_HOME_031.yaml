id: TC_HOME_031
title: Long press and drag calendar
feature: home
priority: High
description: Long-pressing and dragging on the calendar keeps Home usable.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role, schedule with
  jobs today, messaging and add permissions), app on the Home screen (online), calendar
  in Day mode unless a case says otherwise. TC_HOME_047 may move a recurring job and
  all its recurrences; TC_HOME_043 needs <TEST_EMAIL>/<TEST_PASSWORD>.
detox_reference: '[Home][Home][High] [TC_HOME_031] long press and drag on calendar
  webview does not break Home flow'
steps:
- desc: Chạm vào mục [Calendar View]
  action: tap_selector
  text: Calendar View
  delay: 1.0
- desc: Long-press on the calendar, then swipe slowly left and right.
  action: tap_selector
  text: Long-press on the calendar, th
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) If the date bar is
  not shown, tap the calendar view button at the left of the date bar and, in "Calendar
  View", tap "Day". (2) Long-press on the calendar, then swipe slowly left and right.
  (3) If an incomplete-job dialog appears, tap "Close"; if another popup or screen
  opens, go back to Home. At the end, the Home screen with its top bar (id: home-bar)
  should be displayed.'
