  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: Open the GorillaDesk app on the Home screen. At the end, the top-left
  menu icon on Home should be displayed.
