id: TC_10
title: Check Area opens device list
feature: device
priority: High
description: Tapping an area and Check Area opens its device list.
preconditions: Logged in with the DEFAULT E2E account (device addon on, Admin-like
  role), app on the Home screen (online, camera permission granted). The first customer
  in “Customers” has an active job first in its “Jobs” section with the “Device” section
  (at least one area with devices, device types, and devices with coordinates for
  the map). TC_02 needs the Detox env flag E2E_TEST_MODE=true (tester precondition
  only).
detox_reference: '[TC_10][XLSX][DeviceCheck] User can check device if exists'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Check Area]
  action: tap_selector
  text: Check Area
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: 'the device list (id: device-list)'
  desc: 'the device list (id: device-list)'
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, its first job under "Jobs", and scroll to
  "Device" (id: devices-container). (2) Tap the first area row in the section and
  choose "Check Area". After step 2, the device list (id: device-list) should be displayed.
  (3) Tap the back arrow at the top-left. If the section has no area row, stop and
  report the test as skipped: no areas. If "Device" is missing, stop and report the
  test as skipped: device addon off.'
