id: TC_05
title: Pull to refresh types
feature: device
priority: High
description: Pull-to-refresh keeps the device type list.
preconditions: Logged in with the DEFAULT E2E account (device addon on, Admin-like
  role), app on the Home screen (online, camera permission granted). The first customer
  in “Customers” has an active job first in its “Jobs” section with the “Device” section
  (at least one area with devices, device types, and devices with coordinates for
  the map).
detox_reference: '[TC_05][XLSX][DeviceTypeRefresh] User pulls to refresh and device
  type list reloads'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Pull the list down to refresh.
  action: tap_selector
  text: Pull the list down to refresh.
  delay: 0.8
expected:
- assert_text: Device
  desc: Hiển thị 'Device' trên màn hình
- assert_text: Device
  desc: Hiển thị 'Device' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, its first job under "Jobs", and scroll to
  "Device" (id: devices-container). (2) Tap the plus on "Device" and choose "Add Device".
  After step 2, the device type list (title "Device") should be displayed. (3) Pull
  the list down to refresh. After step 3, the device type list should still be displayed.
  If "Device" is missing, stop and report the test as skipped: device addon off.'
