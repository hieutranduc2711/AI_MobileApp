id: TC_EMB_ADD
title: Todo plus opens Add a Todo
feature: todo
priority: High
description: The plus on the job Todo List opens the Add a Todo screen with its input.
preconditions: Logged in with the DEFAULT E2E account (non-crew role with todo and
  template permissions), app on the Home screen (online). The first customer in “Customers”
  has an active job first in its “Jobs” section whose “Todo List” has at least 5 todos
  (so “Show All” appears); at least one todo-list template exists. TC_EMB_SAVE adds
  a todo; TC_EMB_CHK toggles the first todo four times (ends unchanged).
detox_reference: '[DOC+][TC_EMB_ADD][Embedded] User taps Add on the job todo section
  and sees the Add Todo screen with input'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Add a Todo
  desc: Hiển thị 'Add a Todo' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, its first job under "Jobs", then scroll to
  "Todo List". (2) Tap the plus button on "Todo List" (id: add-button). After step
  2, the "Add a Todo" screen with its text input should be displayed. (3) Tap the
  back arrow at the top-left. If there is no "Todo List" section, stop and report
  the test as skipped: todo hidden for this role.'
