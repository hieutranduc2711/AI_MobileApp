id: TC_EMB_EDIT_LINE
title: Edit a todo line and save
feature: todo
priority: High
description: Edit List lets the user edit the first todo text and save.
preconditions: Logged in with the DEFAULT E2E account (non-crew role with todo and
  template permissions), app on the Home screen (online). The first customer in “Customers”
  has an active job first in its “Jobs” section whose “Todo List” has at least 5 todos
  (so “Show All” appears); at least one todo-list template exists. TC_EMB_EDIT_LINE
  edits the first todo; TC_TEMPLATE_APPLY applies the first template to the job; TC_TEMPLATE_RENAME
  renames the first template.
detox_reference: '[Todo][TC_EMB_EDIT_LINE][Embedded] User opens Edit list, taps a
  line, edits text, and saves'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Todo List]
  action: tap_selector
  text: Todo List
  delay: 1.0
- desc: Chạm vào mục [Edit List]
  action: tap_selector
  text: Edit List
  delay: 1.0
- desc: Tap the first todo row; its text input should be displayed.
  action: tap_selector
  text: Tap the first todo row; its te
  delay: 0.8
- desc: Bấm nút Save để lưu dữ liệu
  action: tap_selector
  content_desc: Save
  delay: 2.5
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Edit Todo List
  desc: Hiển thị 'Edit Todo List' trên màn hình
- assert_text: Edit Todo List
  desc: Hiển thị 'Edit Todo List' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, its first job under "Jobs", then scroll to
  "Todo List". (2) Tap the three-dots button on "Todo List" (id: options-button).
  (3) Tap "Edit List". After step 3, the "Edit Todo List" screen should be displayed.
  (4) Tap the first todo row; its text input should be displayed. (5) Replace the
  text with "e2e edit <current time>" and tap "Save Todo". After step 5, "Edit Todo
  List" should be displayed again. (6) Tap the back arrow. If there is no todo or
  "Edit List", stop and report the test as skipped: nothing to edit.'
