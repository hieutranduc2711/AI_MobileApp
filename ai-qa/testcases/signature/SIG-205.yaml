id: SIG-205
title: Next available across modes
feature: signature
priority: High
description: Next stays available with a drawn or typed signature and across tab switches.
preconditions: 'Logged in with the DEFAULT E2E account (role that sees the job work-order
  options: “Take a Work Order Signature” in the job three-dots menu), app on the Home
  screen (online) with at least one job on today''s calendar. No case saves a signature.'
detox_reference: '[SIG-205][XLSX] Save button is disabled when empty and enabled when
  signature present'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Take a Work Order Signature]
  action: tap_selector
  text: Take a Work Order Signature
  delay: 1.0
- desc: Draw a stroke.
  action: tap_selector
  text: Draw a stroke.
  delay: 0.8
- desc: Chạm vào mục [Clear]
  action: tap_selector
  text: Clear
  delay: 1.0
- desc: Chạm vào mục [Clear]
  action: tap_selector
  text: Clear
  delay: 1.0
- desc: Chạm vào mục [Type]
  action: tap_selector
  text: Type
  delay: 1.0
- desc: Chạm vào mục [Draw]
  action: tap_selector
  text: Draw
  delay: 1.0
expected:
- assert_text: Technician's Signature
  desc: Hiển thị 'Technician's Signature' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (tap "Open Incomplete Job" if offered). (2) In the job''s three-dots
  menu choose "Take a Work Order Signature". After step 2, "Technician''s Signature"
  should be displayed. (3) Draw a stroke. (4) Tap "Clear", tap the "Type" tab and
  type "John Doe". (5) Tap "Clear", tap the "Draw" tab and draw a stroke. (6) Tap
  the "Type" tab. (7) Tap the "Draw" tab. After each of steps 3–7, "Next" should be
  displayed; after steps 3 and 4, "Clear" should also be displayed. If that option
  is missing, stop and report the test as skipped: no work order options.'
