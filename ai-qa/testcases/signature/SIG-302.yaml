id: SIG-302
title: Reopen signature, Draw and Clear
feature: signature
priority: High
description: Draw tab shows, the screen reopens and Clear appears after drawing.
preconditions: 'Logged in with the DEFAULT E2E account (role that sees the job work-order
  options: “Take a Work Order Signature” in the job three-dots menu), app on the Home
  screen (online) with at least one job on today''s calendar. Cases that tap “Next”/“Save”
  store a technician (and client) signature on that job.'
detox_reference: '[SIG-302][XLSX] WebView bridge error is caught and displayed without
  crashing'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Take a Work Order Signature]
  action: tap_selector
  text: Take a Work Order Signature
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Chạm vào mục [Take a Work Order Signature]
  action: tap_selector
  text: Take a Work Order Signature
  delay: 1.0
expected:
- assert_text: Technician's Signature
  desc: Hiển thị 'Technician's Signature' trên màn hình
- assert_text: the job detail screen
  desc: the job detail screen
- assert_text: Clear
  desc: Hiển thị 'Clear' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (tap "Open Incomplete Job" if offered). (2) In the job''s three-dots
  menu choose "Take a Work Order Signature". After step 2, "Technician''s Signature"
  should be displayed. The "Draw" tab should be displayed. (3) Tap the back arrow
  at the top-left. After step 3, the job detail screen should be displayed. (4) Reopen
  "Take a Work Order Signature" from the three-dots menu and draw a signature stroke.
  After step 4, "Clear" should be displayed. If that option is missing, stop and report
  the test as skipped: no work order options.'
