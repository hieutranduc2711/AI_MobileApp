id: SIG-202
title: Drawing shows Clear and Next
feature: signature
priority: High
description: Drawing shows Clear and Next; after Clear, drawing again shows Clear.
preconditions: 'Logged in with the DEFAULT E2E account (role that sees the job work-order
  options: “Take a Work Order Signature” in the job three-dots menu), app on the Home
  screen (online) with at least one job on today''s calendar. No case saves a signature.'
detox_reference: '[SIG-202][XLSX] Canvas accepts touch gestures and enables Clear/Save
  buttons'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Take a Work Order Signature]
  action: tap_selector
  text: Take a Work Order Signature
  delay: 1.0
- desc: Draw a signature stroke.
  action: tap_selector
  text: Draw a signature stroke.
  delay: 0.8
- desc: Chạm vào mục [Clear]
  action: tap_selector
  text: Clear
  delay: 1.0
expected:
- assert_text: Technician's Signature
  desc: Hiển thị 'Technician's Signature' trên màn hình
- assert_text: Clear
  desc: Hiển thị 'Clear' trên màn hình
- assert_text: Next
  desc: Hiển thị 'Next' trên màn hình
- assert_text: Clear
  desc: Hiển thị 'Clear' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (tap "Open Incomplete Job" if offered). (2) In the job''s three-dots
  menu choose "Take a Work Order Signature". After step 2, "Technician''s Signature"
  should be displayed. (3) Draw a signature stroke. After step 3, "Clear" and "Next"
  should be displayed. (4) Tap "Clear", then draw a stroke again. After step 4, "Clear"
  should be displayed. If that option is missing, stop and report the test as skipped:
  no work order options.'
