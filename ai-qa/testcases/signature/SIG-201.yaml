id: SIG-201
title: Draw and Type tabs toggle
feature: signature
priority: High
description: Switching Draw/Type shows the drawing area or the text field accordingly.
preconditions: 'Logged in with the DEFAULT E2E account (role that sees the job work-order
  options: “Take a Work Order Signature” in the job three-dots menu), app on the Home
  screen (online) with at least one job on today''s calendar. No case saves a signature.'
detox_reference: '[SIG-201][XLSX] Tab switching toggles between DRAW and TYPE modes
  correctly'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Take a Work Order Signature]
  action: tap_selector
  text: Take a Work Order Signature
  delay: 1.0
- desc: Chạm vào mục [Type]
  action: tap_selector
  text: Type
  delay: 1.0
- desc: Chạm vào mục [Draw]
  action: tap_selector
  text: Draw
  delay: 1.0
expected:
- assert_text: Technician's Signature
  desc: Hiển thị 'Technician's Signature' trên màn hình
- assert_text: Type
  desc: Hiển thị 'Type' trên màn hình
- assert_text: Text to signture
  desc: Hiển thị 'Text to signture' trên màn hình
- assert_text: Draw
  desc: Hiển thị 'Draw' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (tap "Open Incomplete Job" if offered). (2) In the job''s three-dots
  menu choose "Take a Work Order Signature". After step 2, "Technician''s Signature"
  should be displayed. The "Draw" tab should be active with the drawing area shown
  and no "Text to signture" field. (3) Tap the "Type" tab. After step 3, "Type" should
  be active and the "Text to signture" field displayed. (4) Tap the "Draw" tab. After
  step 4, "Draw" should be active, the drawing area shown and the text field hidden.
  If that option is missing, stop and report the test as skipped: no work order options.'
