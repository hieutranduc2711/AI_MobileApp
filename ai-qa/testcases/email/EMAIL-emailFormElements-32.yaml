id: EMAIL-emailFormElements-32
title: All Documents email blank subject validation
feature: email
priority: High
description: On the email form opened from all documents, the user can blank subject
  validation.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role; job work-order
  options visible), app on the Home screen (online). The first customer in “Customers”
  has contacts with email addresses, a job in “Jobs”, at least one invoice and estimate
  (5 or more of each for the Show All cases) and a document in “Documents”. No email
  is sent.
detox_reference: 'DOCUMENT_SHOW_ALL: shows subject validation when subject is blank'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Chạm vào mục [Subject]
  action: tap_selector
  text: Subject
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Send by email
  desc: Hiển thị 'Send by email' trên màn hình
- assert_text: Oops
  desc: Hiển thị 'Oops' trên màn hình
- assert_text: Subject cannot be blank
  desc: Hiển thị 'Subject cannot be blank' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to "Documents", tap "Show
  All" if shown, tap the first document and choose "Send by Email". After step 2,
  the "Send by email" screen should be displayed. (3) Clear "Subject" and tap "Send".
  After step 3, an "Oops" dialog with "Subject cannot be blank" should be displayed.
  (4) Tap "OK", then go back. If there is no "Documents" section or document, stop
  and report the test as skipped: no document.'
