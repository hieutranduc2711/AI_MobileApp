id: EMAIL-emailFormElements-02
title: Job email blank subject validation
feature: email
priority: High
description: On the email form opened from job, the user can blank subject validation.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role; job work-order
  options visible), app on the Home screen (online). The first customer in “Customers”
  has contacts with email addresses, a job in “Jobs”, at least one invoice and estimate
  (5 or more of each for the Show All cases) and a document in “Documents”. No email
  is sent.
detox_reference: 'JOB: shows subject validation when subject is blank'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Subject]
  action: tap_selector
  text: Subject
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to "Jobs", tap its first job,
  then the three-dots icon and "Send by Email". (3) Clear "Subject" and tap "Send";
  if an "Oops" dialog appears, tap "OK". (4) Tap the back arrow at the top-left. If
  there is no job or no "Send by Email" option, stop and report the test as skipped:
  email entry not available.'
