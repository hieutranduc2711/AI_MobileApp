id: EDGE-GAP-035
title: 'Offline Create Then Delete Cancellation: Tạo Job/Task mới khi Offline (`local:j99`),
  sau đó bấm Xóa luôn khi vẫn Offline → Outbox tự triệt ti'
sheet: 16_Production_Edge_Gaps
module: Job / Task
action: Offline Create Then Delete Cancellation
priority: P1
flow_phase: Create→Delete Before Sync
direction: ONLINE → OFFLINE
app_path: GD Mobile > Task List
preconditions: Thiết bị offline hoàn toàn.
test_data: New local task `local:task_99` created then deleted within same offline
  session.
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Job trong Action Sheet
  action: tap_selector
  content_desc: New Job
  text: New Job
  value: 0.5,0.72
- desc: Chọn khách hàng trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  value: 0.5,0.28
- desc: Chọn địa điểm dịch vụ (Location)
  action: tap_selector
  resource_id: location-item
  index: 0
  value: 0.5,0.28
- desc: Chọn dịch vụ phụ trách
  action: tap_selector
  content_desc: '# Thinh Outbox 2'
  text: '# Thinh Outbox 2'
  value: 0.5,0.32
- desc: Bấm Save để lưu Job vào bộ nhớ offline
  action: tap_selector
  content_desc: Save
  text: Save
  value: 0.92,0.14
expected:
- desc: Form New Job được lưu thành công, chuyển hướng vào màn hình Job Details
  assert_text: Job Details
- desc: 'Job được lưu an toàn trong SQLite/Realm offline với mã định danh tạm thời
    ###'
  assert_text: '###'
- desc: Trạng thái Job hiển thị sẵn sàng cho kỹ thuật viên thao tác offline
  assert_text: Unconfirmed
source_tickets: RN-5477 / Outbox-Optimization
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Unnecessary Traffic / Server 404
notes: Tiết kiệm tài nguyên và loại bỏ hoàn toàn nguy cơ server báo lỗi 'Entity not
  found to delete'.
