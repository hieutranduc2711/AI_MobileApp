sheet: 16_Production_Edge_Gaps
module: Sync Engine / Resilience
action: Extreme High Packet Loss (2G/Edge) Throttling
priority: P1
flow_phase: Network Interface Handover
direction: OFFLINE → ONLINE
app_path: GD Mobile > Sync Engine Retry Loop
preconditions: Thiết bị kết nối mạng giả lập 2G (tỷ lệ rớt gói 60%, độ trễ 4000ms).
test_data: 'Network profile: Bandwidth 64kbps, Packet Loss 60%, Latency 4000ms.'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Mô phỏng mạng chập chờn / rớt gói liên tục (Network Flapping)
  action: weak_network
  value: '3'
- desc: Thực hiện thao tác Extreme High Packet Loss (2G/Edge) Throttling trên giao
    diện GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Extreme High Packet Loss (2G/Edge) Throttling duy trì trạng thái
    ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Network-Throttling
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
