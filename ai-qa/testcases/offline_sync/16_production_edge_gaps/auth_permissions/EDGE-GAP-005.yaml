id: EDGE-GAP-005
title: 'Role/Permission Revoked While Offline: Quyền sửa Invoice bị thu hồi trên Web
  khi đang Offline → Đồng bộ lại → Server trả về 403 Forbidden →'
sheet: 16_Production_Edge_Gaps
module: Auth / Permissions
action: Role/Permission Revoked While Offline
priority: P1
flow_phase: Auth Expiry & Session Lifecycle
direction: OFFLINE → ONLINE
app_path: GD Mobile > Invoices / Sync Manager
preconditions: Technician sửa Invoice offline. Trên web Admin hạ quyền của technician
  xuống 'View Only' đối với Invoice.
test_data: 'Revoked permission: ''invoices.update''; 1 pending invoice mutation, 2
  pending job notes.'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện thao tác Role/Permission Revoked While Offline trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Role/Permission Revoked While Offline duy trì trạng thái ổn định
    trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Permissions
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Queue Blocking / Silent Drop
notes: Đảm bảo lỗi 403 của 1 item không làm tắc nghẽn (head-of-line blocking) các
  item hợp lệ khác.
