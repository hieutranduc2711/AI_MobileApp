id: EDGE-GAP-036
title: 'Large Video Multipart Chunked Resumable Upload: Tải lên video hiện trường
  50MB khi Reconnect → Sử dụng Chunked Upload hỗ trợ resume tại byte bị đứt,'
sheet: 16_Production_Edge_Gaps
module: Media / Video
action: Large Video Multipart Chunked Resumable Upload
priority: P1
flow_phase: Large File
direction: OFFLINE → ONLINE
app_path: GD Mobile > Job > Attachments
preconditions: Technician quay 1 video hiện trường 50MB khi offline. Bật mạng online
  để upload.
test_data: 'Video file: 50MB MP4; Upload chunk size: 5MB (10 chunks total).'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện thao tác Large Video Multipart Chunked Resumable Upload trên giao
    diện GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Large Video Multipart Chunked Resumable Upload duy trì trạng thái
    ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Media-Chunking
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Data Waste / Timeout Failure
notes: Đặc biệt quan trọng đối với các video khảo sát mối công trình lớn.
