id: EDGE-GAP-036
title: 'Large Video Multipart Chunked Resumable Upload: Tải lên video hiện trường
  50MB khi Reconnect → Sử dụng Chunked Upload hỗ trợ resume tại byte bị đứt,'
sheet: 16_Production_Edge_Gaps
module: Media / Video
action: Large Video Multipart Chunked Resumable Upload
priority: P1
flow_phase: Large File
direction: OFFLINE → ONLINE
app_path: GD Mobile > Job > Attachments
preconditions: Technician quay 1 video hiện trường 50MB khi offline. Bật mạng online
  để upload.
test_data: 'Video file: 50MB MP4; Upload chunk size: 5MB (10 chunks total).'
steps:
- desc: Quay video 50MB đính kèm vào Job offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Bật mạng online để bắt đầu upload.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Khi upload được 25MB (5 chunks), ngắt kết nối mạng 5 giây rồi bật lại.
  action: tap_selector
  text: Khi upload được 25MB (5 chunks
  delay: 1.0
- desc: Theo dõi HTTP headers và range byte gửi lên.
  action: tap_selector
  text: Theo dõi HTTP headers và range
  delay: 1.0
expected:
- desc: Tiến trình upload resume tiếp tục từ chunk thứ 6 (byte thứ 25,000,001).
  assert_text: Media / Video
- desc: Không tải lại từ byte số 0.
  assert_text: Media / Video
- desc: Toàn bộ video được ghép nối hoàn chỉnh trên server (S3 / Cloud Storage).
  assert_text: Media / Video
- desc: Người dùng thấy thanh tiến trình (progress bar) tiếp tục chạy mượt mà.
  assert_text: Media / Video
source_tickets: RN-5477 / Media-Chunking
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Data Waste / Timeout Failure
notes: Đặc biệt quan trọng đối với các video khảo sát mối công trình lớn.
