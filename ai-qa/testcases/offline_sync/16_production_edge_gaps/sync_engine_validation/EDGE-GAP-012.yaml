id: EDGE-GAP-012
title: 'Future Device Clock Validation: Đồng hồ thiết bị chỉnh nhanh về tương lai
  (+7 ngày) → Khi sync, server chuẩn hóa thời gian dựa trên '
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Validation
action: Future Device Clock Validation
priority: P1
flow_phase: Clock Drift & Timestamp Tampering
direction: OFFLINE → ONLINE
app_path: GD Mobile > Invoices / Timestamps
preconditions: Thiết bị chạy nhanh hơn 7 ngày; tạo Invoice offline.
test_data: 'Client time: 2026-10-15; Real server time: 2026-10-08.'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện chấm công Clock In trên giao diện
  action: tap_selector
  content_desc: Clock In
  text: Clock In
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Bản ghi chấm công có timestamp offline chuẩn xác
  assert_text: Clock Out
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Validation
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Financial Report Distortion
notes: Bảo đảm tính toàn vẹn của sổ sách kế toán và hóa đơn thuế.
