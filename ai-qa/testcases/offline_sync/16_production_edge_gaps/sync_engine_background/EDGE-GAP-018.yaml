id: EDGE-GAP-018
title: 'Background Doze Mode & Resume Lifecycle: App chuyển sang Background khi đang
  sync (Android Doze / iOS 30s limit) → Tạm dừng an toàn và tự res'
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Background
action: Background Doze Mode & Resume Lifecycle
priority: P1
flow_phase: OS Process Kill & Crash Recovery
direction: CROSS-CUTTING
app_path: GD Mobile > Background Sync Manager
preconditions: Đang xả 20 outbox items. Người dùng bấm phím Home hoặc chuyển sang
  app khác (Google Maps).
test_data: 20 pending outbox mutations.
steps:
- desc: Bắt đầu sync khi online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Bấm Home để đưa app vào background trong 2 phút (kích hoạt OS background suspension).
  action: back
  delay: 1.0
- desc: Mở lại GD Mobile lên foreground.
  action: tap_selector
  text: Mở lại GD Mobile lên foregroun
  delay: 1.0
- desc: Kiểm tra tiến trình sync.
  action: tap_selector
  text: Kiểm tra tiến trình sync.
  delay: 1.0
expected:
- desc: Request đang chạy dở hoàn tất hoặc timeout trong giới hạn background cho phép.
  assert_text: Sync Engine / Background
- desc: Khi trở lại foreground, listener AppState (active) kích hoạt kiểm tra lại
    hàng đợi.
  assert_text: Sync Engine / Background
- desc: Tiến trình sync tiếp tục xả các item còn lại mượt mà.
  assert_text: Sync Engine / Background
- desc: Không xảy ra deadlock giữa background worker và foreground UI thread.
  assert_text: Sync Engine / Background
source_tickets: RN-5477 / RN-5564 / Background
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Sync Stalling / Frozen Queue
notes: Kiểm tra đúng quy chế background execution trên Android 14+ và iOS 17+.
