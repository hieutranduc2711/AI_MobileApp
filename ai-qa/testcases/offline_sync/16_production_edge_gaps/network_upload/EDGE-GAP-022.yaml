id: EDGE-GAP-022
title: 'Cellular to Wi-Fi Interface Handover During Upload: Đang tải lên 10MB ảnh
  qua 4G thì thiết bị bắt vào sóng Wi-Fi (Socket reset) → App tự retry file ảnh '
sheet: 16_Production_Edge_Gaps
module: Network / Upload
action: Cellular to Wi-Fi Interface Handover During Upload
priority: P1
flow_phase: Network Interface Handover
direction: OFFLINE → ONLINE
app_path: GD Mobile > Media Sync Worker
preconditions: Thiết bị có 5 ảnh đang upload; đang dùng kết nối Cellular (4G); đi
  vào vùng phủ sóng Wi-Fi quen thuộc.
test_data: 5 media files (~5MB each); Interface change from `rmnet_data0` to `wlan0`.
steps:
- desc: Bắt đầu upload 5 ảnh trên 4G.
  action: tap_selector
  text: Bắt đầu upload 5 ảnh trên 4G.
  delay: 1.0
- desc: Giữa lúc ảnh thứ 2 đang upload được 50%, bật Wi-Fi để thiết bị tự động chuyển
    interface mạng.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Socket cũ bị reset (`ECONNRESET` / `SocketException`).
  action: tap_selector
  text: Socket cũ bị reset (`ECONNRESE
  delay: 1.0
- desc: Theo dõi phản ứng của Media Sync Worker.
  action: tap_selector
  text: Theo dõi phản ứng của Media Sy
  delay: 1.0
expected:
- desc: Worker bắt exception kết nối bị đứt, kích hoạt cơ chế retry sau 2 giây trên
    interface mới.
  assert_text: Network / Upload
- desc: Tiếp tục upload ảnh thứ 2 (từ đầu hoặc resumable chunk) và hoàn tất các ảnh
    còn lại qua Wi-Fi.
  assert_text: Network / Upload
- desc: Không crash app và không đánh dấu file ảnh là lỗi vĩnh viễn.
  assert_text: Network / Upload
source_tickets: RN-5477 / Network-Handover
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Upload Stalling / Partial Upload
notes: Sử dụng thư viện upload có hỗ trợ background session và tự động phục hồi kết
  nối.
