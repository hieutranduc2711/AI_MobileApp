id: EDGE-GAP-020
title: 'App Auto-Update with Pending Outbox Preservation: Còn 10 items pending trong
  Outbox → App được auto-update lên version mới có migration DB → Mở app mớ'
sheet: 16_Production_Edge_Gaps
module: Database / Migration
action: App Auto-Update with Pending Outbox Preservation
priority: P0
flow_phase: Database Migration & Schema Upgrade
direction: CROSS-CUTTING
app_path: GD Mobile > DB Migration Runner
preconditions: App version v4.0 chứa 10 pending outbox records; cài đè bản update
  v4.1 (có thêm cột mới trong bảng jobs và bảng outbox_queue).
test_data: 10 pending mutations created on schema v4.0; APK/IPA upgrade to schema
  v4.1.
steps:
- desc: Tạo 10 items offline trên phiên bản app hiện tại.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Tắt app (giữ nguyên SQLite database trên thiết bị).
  action: tap_selector
  text: Tắt app (giữ nguyên SQLite dat
  delay: 1.0
- desc: 'Cài đè phiên bản app mới (simulate Google Play auto-update: `adb install
    -r new_version.apk`).'
  action: tap_selector
  text: Cài đè phiên bản app mới (simu
  delay: 1.0
- desc: Mở app phiên bản mới.
  action: tap_selector
  text: Mở app phiên bản mới.
  delay: 1.0
- desc: Kiểm tra log migration và đếm số lượng outbox records.
  action: tap_selector
  text: 'Kiểm tra log migration và đếm '
  delay: 1.0
expected:
- desc: SQLite migration script chạy thành công mà KHÔNG drop table hoặc recreat schema
    từ đầu.
  assert_text: Database / Migration
- desc: Cột mới được thêm bằng `ALTER TABLE ... ADD COLUMN` có default value an toàn.
  assert_text: Database / Migration
- desc: Đủ 10 pending outbox items được bảo toàn nguyên vẹn.
  assert_text: Database / Migration
- desc: Khi có mạng, 10 items được xả thành công lên server.
  assert_text: Database / Migration
source_tickets: RN-5477 / SQLite-Migration
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Catastrophic Upgrade Data Loss
notes: Tuyệt đối cấm dùng fallback destructive migration (`fallbackToDestructiveMigration`)
  trên production.
