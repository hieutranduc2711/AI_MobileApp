id: EDGE-GAP-040
title: 'Branch Switching Guard with Pending Mutations: Chuyển Chi nhánh (Branch Switch)
  khi đang có hàng đợi pending: App hiển thị dialog cảnh báo bắt buộc'
sheet: 16_Production_Edge_Gaps
module: Branch / Tenant
action: Branch Switching Guard with Pending Mutations
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Switch Branch Modal
preconditions: 'User thuộc nhiều Branch; đang có 4 items pending của Branch Miami
  (`gd-branch-id: br_01`).'
test_data: 'Current Branch: Miami (4 pending items); Target Branch: Orlando (`br_02`).'
steps:
- desc: Tạo 4 items offline thuộc Branch Miami.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Bấm vào menu chuyển chi nhánh sang Orlando.
  action: tap_selector
  text: 'Bấm vào menu chuyển chi nhánh '
  delay: 1.0
- desc: Kiểm tra thông báo cảnh báo hiển thị.
  action: tap_selector
  text: Kiểm tra thông báo cảnh báo hi
  delay: 1.0
expected:
- desc: 'App hiển thị Modal cảnh báo chặn: ''Bạn đang có 4 thay đổi chưa đồng bộ của
    chi nhánh Miami. Vui lòng kết nối mạng để đồng bộ hoàn tất trước khi chuyển chi
    nhánh, hoặc chọn Hủy bỏ''.'
  assert_text: Bạn đang có 4 thay đổi chưa đồng bộ của chi nhánh Miami. Vui lòng kết
    nối mạng để đồng bộ hoàn tất trước khi chuyển chi nhánh, hoặc chọn Hủy bỏ
- desc: Nút chuyển chi nhánh bị vô hiệu hóa (disabled) khi đang offline.
  assert_text: Branch / Tenant
- desc: Ngăn chặn tuyệt đối tình trạng gắn nhầm `gd-branch-id` của chi nhánh mới vào
    các mutation cũ chưa sync.
  assert_text: Branch / Tenant
source_tickets: RN-5477 / RN-5680 / Branch-Guard
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Cross-Branch Data Corruption
notes: Được ghi chú rõ ràng trong kiến trúc Header GD-Branch-ID của Epic RN-5477.
