id: EDGE-GAP-008
title: 'Batch High-Res Photos Compression Memory Safety: Chụp liên tiếp 20 ảnh hiện
  trường 48MP khi Offline → Tiến trình nén ảnh ngầm không gây Out-Of-Memory'
sheet: 16_Production_Edge_Gaps
module: Media / Photos
action: Batch High-Res Photos Compression Memory Safety
priority: P1
flow_phase: Storage & Low Disk Limit
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Photos > Camera
preconditions: Thiết bị camera 48MP; bộ nhớ RAM điện thoại trung bình (3GB - 4GB RAM);
  app đang Offline.
test_data: 20 high-resolution camera photos (~12MB mỗi file gốc RAW/JPEG).
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Attach a Photo trong Job Details
  action: tap_selector
  text: Attach a Photo
expected:
- desc: Mục đính kèm ảnh sẵn sàng để xếp hàng chờ sync
  assert_text: Attach a Photo
source_tickets: RN-5477 / RN-5680 / Media
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: OOM Crash / App Termination
notes: Liên quan trực tiếp đến subtask RN-5680 về tối ưu hóa cache ảnh và tránh base64
  string lớn.
