id: EDGE-GAP-011
title: 'Device Clock Rollback Resolution: Đồng hồ thiết bị bị lùi về quá khứ (-2 ngày
  hoặc reset 1970 do cạn pin) → Technician hoàn thành Job '
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Conflict
action: Device Clock Rollback Resolution
priority: P0
flow_phase: Clock Drift & Timestamp Tampering
direction: OFFLINE → ONLINE
app_path: GD Mobile > Job Execution
preconditions: Thiết bị bị lệch giờ hệ thống (set thủ công về 2 ngày trước hoặc pin
  CMOS lỗi về Epoch 1970); app đang Offline.
test_data: Device System Time = 2026-10-06T08:00:00Z; Actual Real Time = 2026-10-08T08:00:00Z;
  Job status update = 'Completed'.
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện chấm công Clock In trên giao diện
  action: tap_selector
  content_desc: Clock In
  text: Clock In
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Bản ghi chấm công có timestamp offline chuẩn xác
  assert_text: Clock Out
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Conflict-Resolution
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Silent Overwrite / Stale Data
notes: Không được phụ thuộc 100% vào `Date.now()` của client để quyết định tính thắng
  thua trong LWW.
