id: EDGE-GAP-028
title: 'Massive Text Boundary Performance: Ghi chú cực dài (10,000 ký tự văn bản)
  nhập khi Offline → Màn hình Job Detail render mượt mà khi Off'
sheet: 16_Production_Edge_Gaps
module: Job / Note
action: Massive Text Boundary Performance
priority: P2
flow_phase: Boundary & Unicode Serialization
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job Detail > Notes View
preconditions: Thiết bị offline.
test_data: 10,000 characters text string (~10KB text payload).
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Notes trong Job Details
  action: tap_selector
  text: Notes
expected:
- desc: Ghi chú được lưu vào bộ nhớ cục bộ của Job
  assert_text: Notes
- desc: Top Note hiển thị đầy đủ không bị mất
  assert_text: Top Note
source_tickets: RN-5477 / Performance
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: UI Lag / Freeze
notes: Kiểm tra giới hạn text input của React Native TextInput component.
