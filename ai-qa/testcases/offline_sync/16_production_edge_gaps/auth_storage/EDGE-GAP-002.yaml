id: EDGE-GAP-002
title: 'Force Logout Prevention & Data Preservation: Refresh Token hết hạn (401/Invalid
  Session) → Reconnect mạng → KHÔNG ĐƯỢC xóa SQLite Outbox, hiển th'
sheet: 16_Production_Edge_Gaps
module: Auth / Storage
action: Force Logout Prevention & Data Preservation
priority: P0
flow_phase: Auth Expiry & Session Lifecycle
direction: OFFLINE → ONLINE
app_path: GD Mobile > Auth Revalidation Modal
preconditions: User làm việc offline nhiều ngày, cả Access Token và Refresh Token
  đều đã bị thu hồi/hết hạn trên server; đang có 10 items pending trong SQLite outbox.
test_data: Revoked session / HTTP 401 Unauthorized trên mọi auth endpoints; 10 pending
  local mutations.
steps:
- desc: Có 10 mutations pending offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Bật mạng internet lại.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Sync Engine gửi request và nhận phản hồi 401/403 Session Expired từ backend.
  action: back
  delay: 1.0
- desc: Kiểm tra phản ứng của GD Mobile App.
  action: tap_selector
  text: Kiểm tra phản ứng của GD Mobil
  delay: 1.0
- desc: Kiểm tra trạng thái bảng outbox và dữ liệu local SQLite.
  action: tap_selector
  text: Kiểm tra trạng thái bảng outbo
  delay: 1.0
- desc: Thực hiện đăng nhập lại (Re-login) cùng tài khoản đó.
  action: tap_selector
  text: Force Logout Prevention & Data Preservation
  delay: 1.0
expected:
- desc: App TUYỆT ĐỐI KHÔNG tự động purge/xóa bảng SQLite local hoặc outbox.
  assert_text: Auth / Storage
- desc: 'App hiển thị màn hình khóa yêu cầu nhập mật khẩu xác thực lại (Session Expired
    Modal) với thông báo: ''Có 10 thay đổi chưa đồng bộ. Vui lòng đăng nhập lại để
    tiếp tục sync.'''
  assert_text: Có 10 thay đổi chưa đồng bộ. Vui lòng đăng nhập lại để tiếp tục sync.
- desc: Sau khi đăng nhập lại thành công, app tự động resume và đồng bộ toàn bộ 10
    items lên server mà không mất 1 byte dữ liệu.
  assert_text: Auth / Storage
source_tickets: RN-5477 / Arch-Security
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Catastrophic Data Loss
notes: 'Lỗi cực kỳ phổ biến: Auth interceptor bắt 401 rồi gọi clearAllStorage() làm
  xóa sạch SQLite outbox.'
