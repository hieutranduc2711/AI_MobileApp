id: EDGE-GAP-002
title: 'Force Logout Prevention & Data Preservation: Refresh Token hết hạn (401/Invalid
  Session) → Reconnect mạng → KHÔNG ĐƯỢC xóa SQLite Outbox, hiển th'
sheet: 16_Production_Edge_Gaps
module: Auth / Storage
action: Force Logout Prevention & Data Preservation
priority: P0
flow_phase: Auth Expiry & Session Lifecycle
direction: OFFLINE → ONLINE
app_path: GD Mobile > Auth Revalidation Modal
preconditions: User làm việc offline nhiều ngày, cả Access Token và Refresh Token
  đều đã bị thu hồi/hết hạn trên server; đang có 10 items pending trong SQLite outbox.
test_data: Revoked session / HTTP 401 Unauthorized trên mọi auth endpoints; 10 pending
  local mutations.
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Khóa màn hình thiết bị và mở khóa lại để kiểm tra bảo lưu phiên
  action: lock_screen
  value: '3.0'
- desc: Đưa ứng dụng về màn hình Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: Bấm nút Today để điều hướng về ngày làm việc hiện tại
  action: tap_selector
  content_desc: Today
  text: Today
- desc: Kiểm tra danh sách công việc và chỉ số tổng trên Lịch
  action: tap_selector
  text: Jobs
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Lịch làm việc hiển thị nguyên vẹn các công việc từ SQLite offline
  assert_text: Jobs
- desc: Nút điều hướng Today và ngày hiện tại hoạt động bình thường
  assert_text: Today
- desc: Tổng doanh thu và số lượng công việc được bảo toàn
  assert_text: Total
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Arch-Security
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Catastrophic Data Loss
notes: 'Lỗi cực kỳ phổ biến: Auth interceptor bắt 401 rồi gọi clearAllStorage() làm
  xóa sạch SQLite outbox.'
