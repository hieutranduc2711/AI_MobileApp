id: EDGE-GAP-001
title: 'Token Refresh on Reconnect: Access Token hết hạn sau 48h Offline → Có mạng
  lại → Tự động refresh token ngầm trước khi xả Outbox'
sheet: 16_Production_Edge_Gaps
module: Auth / Sync Engine
action: Token Refresh on Reconnect
priority: P0
flow_phase: Auth Expiry & Session Lifecycle
direction: OFFLINE → ONLINE
app_path: GD Mobile > Background Sync Engine
preconditions: User đăng nhập GD Mobile; tạo 5 mutations offline (Job, Note); để thiết
  bị offline > 48h khiến Access Token hết hạn nhưng Refresh Token còn hạn.
test_data: Expired JWT Access Token (exp < now); Valid Refresh Token; 5 pending SQLite
  outbox items.
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện thao tác Token Refresh on Reconnect trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Token Refresh on Reconnect duy trì trạng thái ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Arch-Security
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Data Loss / Silent Fail
notes: Nếu không có cơ chế preemptive refresh, request đầu tiên sẽ dính 401 và có
  nguy cơ kích hoạt logout nhầm.
