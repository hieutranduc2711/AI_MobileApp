id: EDGE-GAP-009
title: 'Missing Local Media File Handling: File ảnh cục bộ bị OS Cleaner hoặc người
  dùng xóa trước khi sync → Queue đẩy metadata lên server phá'
sheet: 16_Production_Edge_Gaps
module: Media / Sync Engine
action: Missing Local Media File Handling
priority: P1
flow_phase: Storage & Low Disk Limit
direction: OFFLINE → ONLINE
app_path: GD Mobile > Sync Engine / Photo Upload
preconditions: User chụp 1 ảnh gắn vào Job khi offline. File ảnh vật lý trong cache
  bị xóa ngoài hệ thống trước khi có mạng.
test_data: 'Photo metadata record in SQLite pointing to deleted file uri: ''file:///cache/photo_999.jpg''.'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Thực hiện thao tác Missing Local Media File Handling trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Missing Local Media File Handling duy trì trạng thái ổn định trên
    giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / File-System
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Sync Queue Deadlock
notes: Rất nhiều app mobile bị kẹt hàng đợi vĩnh viễn ở item ảnh bị mất file.
