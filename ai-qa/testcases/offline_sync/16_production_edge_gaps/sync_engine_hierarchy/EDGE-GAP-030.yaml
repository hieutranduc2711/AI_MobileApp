  action: set_network
  value: 'false'
  delay: 2.0
- desc: 'Offline: Tạo Job gắn vào `local:loc_01` (sinh `local:job_01`).'
  action: set_network
  value: 'false'
  delay: 2.0
- desc: 'Offline: Tạo Invoice gắn vào `local:job_01` (sinh `local:inv_01`).'
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Bật mạng Online để hệ thống bắt đầu đồng bộ.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Sync Engine xả tuần tự theo đúng thứ tự topology cha trước - con sau.
  assert_text: Sync Engine / Hierarchy
- desc: Server trả về UUID thật của Customer A (`cust_real_uuid`), mobile cập nhật
