  assert_text: Sync Engine / Hierarchy
- desc: Cả 4 thực thể được tạo thành công trên backend với quan hệ cha con hoàn hảo.
  assert_text: Sync Engine / Hierarchy
- desc: Dữ liệu local SQLite được cập nhật thay thế toàn bộ `local:*` thành UUID thật
    của server.
  assert_text: Sync Engine / Hierarchy
