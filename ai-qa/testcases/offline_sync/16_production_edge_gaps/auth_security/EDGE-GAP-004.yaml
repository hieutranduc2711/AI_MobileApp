id: EDGE-GAP-004
title: 'Password Changed by Admin While Offline: Admin đổi mật khẩu tài khoản trên
  Web khi Technician đang làm việc Offline → Bật mạng lại → Queue pa'
sheet: 16_Production_Edge_Gaps
module: Auth / Security
action: Password Changed by Admin While Offline
priority: P1
flow_phase: Auth Expiry & Session Lifecycle
direction: OFFLINE → ONLINE
app_path: GD Mobile > Sync Engine / Password Prompt
preconditions: Technician đi hiện trường tắt mạng, tạo 2 Jobs. Trên Web portal, Admin
  thực hiện reset/đổi mật khẩu của technician đó.
test_data: User account password changed from 'OldPass123' to 'NewPass456'; 2 pending
  jobs in mobile.
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Job trong Action Sheet
  action: tap_selector
  content_desc: New Job
  text: New Job
  value: 0.5,0.72
- desc: Chọn khách hàng trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  value: 0.5,0.28
- desc: Chọn địa điểm dịch vụ (Location)
  action: tap_selector
  resource_id: location-item
  index: 0
  value: 0.5,0.28
- desc: Chọn dịch vụ phụ trách
  action: tap_selector
  content_desc: '# Thinh Outbox 2'
  text: '# Thinh Outbox 2'
  value: 0.5,0.32
- desc: Bấm Save để lưu Job vào bộ nhớ offline
  action: tap_selector
  content_desc: Save
  text: Save
  value: 0.92,0.14
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Form New Job được lưu thành công, chuyển hướng vào màn hình Job Details
  assert_text: Job Details
- desc: 'Job được lưu an toàn trong SQLite/Realm offline với mã định danh tạm thời
    ###'
  assert_text: '###'
- desc: Trạng thái Job hiển thị sẵn sàng cho kỹ thuật viên thao tác offline
  assert_text: Unconfirmed
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Security
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Account Lockout / Dropped Queue
notes: Tránh loop 401 retry vô hạn làm kích hoạt brute-force rate limiter của backend.
