id: EDGE-GAP-025
title: 'Rapid Flapping Network Debounce Stabilization: Mạng bật tắt liên tục (Flapping:
  3s có mạng, 2s mất mạng x 10 lần) → Sync Engine duy trì Debounce 3-'
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Debounce
action: Rapid Flapping Network Debounce Stabilization
priority: P1
flow_phase: Network Interface Handover
direction: OFFLINE → ONLINE
app_path: GD Mobile > Network Change Listener
preconditions: Hàng đợi có 10 items. Mạng Wi-Fi bị bật tắt liên tục mỗi 3 giây.
test_data: Rapid toggle network state 10 times in 30 seconds.
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Mô phỏng mạng chập chờn / rớt gói liên tục (Network Flapping)
  action: weak_network
  value: '3'
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Job trong Action Sheet
  action: tap_selector
  content_desc: New Job
  text: New Job
  value: 0.5,0.72
- desc: Chọn khách hàng trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  value: 0.5,0.28
- desc: Chọn địa điểm dịch vụ (Location)
  action: tap_selector
  resource_id: location-item
  index: 0
  value: 0.5,0.28
- desc: Chọn dịch vụ phụ trách
  action: tap_selector
  content_desc: '# Thinh Outbox 2'
  text: '# Thinh Outbox 2'
  value: 0.5,0.32
- desc: Bấm Save để lưu Job vào bộ nhớ offline
  action: tap_selector
  content_desc: Save
  text: Save
  value: 0.92,0.14
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Form New Job được lưu thành công, chuyển hướng vào màn hình Job Details
  assert_text: Job Details
- desc: 'Job được lưu an toàn trong SQLite/Realm offline với mã định danh tạm thời
    ###'
  assert_text: '###'
- desc: Trạng thái Job hiển thị sẵn sàng cho kỹ thuật viên thao tác offline
  assert_text: Unconfirmed
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Flapping-Network
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Thread Race Condition / SQLite Lock
notes: Sử dụng single-flight pattern hoặc concurrency lock cho sync runner.
