id: EDGE-GAP-007
title: 'Low Disk Storage Exception Handling: Bộ nhớ máy dưới 50MB (Low Storage Alert)
  → Lưu Job mới kèm chữ ký khi Offline → SQLite bắt SQLITE_FU'
sheet: 16_Production_Edge_Gaps
module: Storage / SQLite
action: Low Disk Storage Exception Handling
priority: P0
flow_phase: Storage & Low Disk Limit
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job Form > Save
preconditions: Thiết bị Android/iOS bị đầy bộ nhớ (dung lượng trống < 50MB); app đang
  ở chế độ Offline.
test_data: Simulate storage full (e.g. qua dd dummy file hoặc emulator quota); New
  Job payload with signature base64.
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Thực hiện thao tác Low Disk Storage Exception Handling trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
expected:
- desc: Thao tác Low Disk Storage Exception Handling duy trì trạng thái ổn định trên
    giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
source_tickets: RN-5477 / OS-Constraints
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: App Crash / Data Loss
notes: Cần đảm bảo database SQLite không rơi vào trạng thái corrupt sau lỗi disk full.
