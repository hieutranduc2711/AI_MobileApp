id: EDGE-GAP-016
title: 'Immediate App Swipe-Kill After Save: User vuốt tắt app từ Recent Apps ngay
  sau khi bấm ''Save Job'' khi Offline → Mở lại app: Job vẫn nằm n'
sheet: 16_Production_Edge_Gaps
module: Storage / SQLite
action: Immediate App Swipe-Kill After Save
priority: P0
flow_phase: OS Process Kill & Crash Recovery
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job Creation > Save
preconditions: Thiết bị offline hoàn toàn.
test_data: Full Job payload (Title, Customer, Time, Line Items).
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Thực hiện thao tác Immediate App Swipe-Kill After Save trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
expected:
- desc: Thao tác Immediate App Swipe-Kill After Save duy trì trạng thái ổn định trên
    giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
source_tickets: RN-5477 / Persistence
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Data Loss on Exit
notes: Tránh các thao tác async flush dữ liệu bị trì hoãn sau khi đã đóng màn hình.
