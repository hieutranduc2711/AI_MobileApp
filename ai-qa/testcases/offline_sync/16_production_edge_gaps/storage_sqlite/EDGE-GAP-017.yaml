sheet: 16_Production_Edge_Gaps
module: Storage / SQLite
action: Battery Die / Sudden Power Cut Transaction Safety
priority: P1
flow_phase: OS Process Kill & Crash Recovery
direction: ONLINE → OFFLINE
app_path: GD Mobile > SQLite Engine
preconditions: Thiết bị pin yếu hoặc rút cáp nguồn emulator khi đang commit transaction
  lớn.
test_data: 'Multi-table transaction: Job + JobItems + Invoice + CustomerUpdate.'
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Thực hiện thao tác Battery Die / Sudden Power Cut Transaction Safety trên
    giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
expected:
- desc: Thao tác Battery Die / Sudden Power Cut Transaction Safety duy trì trạng thái
    ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
source_tickets: RN-5477 / Database-Engine
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Database Corruption
notes: Cấu hình SQLite WAL mode và PRAGMA synchronous = NORMAL/FULL.
