id: EDGE-GAP-017
title: 'Battery Die / Sudden Power Cut Transaction Safety: Thiết bị sập nguồn đột
  ngột (0% Pin) đúng thời điểm SQLite đang ghi Transaction → Mở lại máy: SQLite'
sheet: 16_Production_Edge_Gaps
module: Storage / SQLite
action: Battery Die / Sudden Power Cut Transaction Safety
priority: P1
flow_phase: OS Process Kill & Crash Recovery
direction: ONLINE → OFFLINE
app_path: GD Mobile > SQLite Engine
preconditions: Thiết bị pin yếu hoặc rút cáp nguồn emulator khi đang commit transaction
  lớn.
test_data: 'Multi-table transaction: Job + JobItems + Invoice + CustomerUpdate.'
steps:
- desc: Bắt đầu transaction ghi đồng thời 4 bảng khi offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Giả lập cắt nguồn đột ngột (Hard Power Off / Emulator kill -9).
  action: tap_selector
  text: Giả lập cắt nguồn đột ngột (Ha
  delay: 1.0
- desc: Bật lại thiết bị và mở GD Mobile.
  action: tap_selector
  text: Bật lại thiết bị và mở GD Mobi
  delay: 1.0
- desc: 'Thực thi kiểm tra tính toàn vẹn: `PRAGMA integrity_check`.'
  action: tap_selector
  text: Thực thi kiểm tra tính toàn vẹ
  delay: 1.0
expected:
- desc: SQLite WAL (Write-Ahead Logging) tự động phục hồi khi mở lại database.
  assert_text: Storage / SQLite
- desc: Integrity check trả về 'ok'.
  assert_text: ok
- desc: Trạng thái cơ sở dữ liệu nhất quán (hoặc đã commit trọn vẹn, hoặc rollback
    sạch sẽ về trạng thái trước đó, không có bản ghi nửa vời).
  assert_text: Storage / SQLite
- desc: App khởi động bình thường, không crash.
  assert_text: Storage / SQLite
source_tickets: RN-5477 / Database-Engine
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Database Corruption
notes: Cấu hình SQLite WAL mode và PRAGMA synchronous = NORMAL/FULL.
