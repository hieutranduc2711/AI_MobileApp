id: EDGE-GAP-013
title: 'Timezone Crossing During Offline State: Thiết bị đổi Timezone khi đang Offline
  (di chuyển qua ranh giới múi giờ EST → CST) → Lịch hẹn Job St'
sheet: 16_Production_Edge_Gaps
module: Calendar / Jobs
action: Timezone Crossing During Offline State
priority: P1
flow_phase: Clock Drift & Timestamp Tampering
direction: CROSS-CUTTING
app_path: GD Mobile > Calendar / Agenda
preconditions: Technician nhận lịch Job lúc 9:00 AM EST; offline và di chuyển qua
  khu vực CST (chậm hơn 1 tiếng); OS tự cập nhật timezone.
test_data: 'Original Job Start: 2026-10-08T09:00:00-04:00 (EST); New Device Timezone:
  America/Chicago (-05:00).'
steps:
- desc: Khởi tạo môi trường ứng dụng sẵn sàng
  action: set_network
  value: 'true'
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Job trong Action Sheet
  action: tap_selector
  content_desc: New Job
  text: New Job
  value: 0.5,0.72
- desc: Chọn khách hàng trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  value: 0.5,0.28
- desc: Chọn địa điểm dịch vụ (Location)
  action: tap_selector
  resource_id: location-item
  index: 0
  value: 0.5,0.28
- desc: Chọn dịch vụ phụ trách
  action: tap_selector
  content_desc: '# Thinh Outbox 2'
  text: '# Thinh Outbox 2'
  value: 0.5,0.32
- desc: Bấm Save để lưu Job vào bộ nhớ offline
  action: tap_selector
  content_desc: Save
  text: Save
  value: 0.92,0.14
expected:
- desc: Form New Job được lưu thành công, chuyển hướng vào màn hình Job Details
  assert_text: Job Details
- desc: 'Job được lưu an toàn trong SQLite/Realm offline với mã định danh tạm thời
    ###'
  assert_text: '###'
- desc: Trạng thái Job hiển thị sẵn sàng cho kỹ thuật viên thao tác offline
  assert_text: Unconfirmed
source_tickets: RN-5477 / Calendar
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Missed Appointment / Wrong Schedule
notes: Cần thống nhất lưu timestamp dạng ISO 8601 UTC kèm timezone offset gốc của
  Branch.
