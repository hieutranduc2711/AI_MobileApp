id: EDGE-GAP-021
title: 'Schema Evolution Non-Nullable Field Compatibility: Backend cập nhật schema
  thêm trường bắt buộc (required field) trong khi client offline lưu theo sche'
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Schema
action: Schema Evolution Non-Nullable Field Compatibility
priority: P1
flow_phase: Database Migration & Schema Upgrade
direction: OFFLINE → ONLINE
app_path: GD Mobile > API Interceptor
preconditions: 'Payload tạo Job được lưu offline trước thời điểm backend deploy thêm
  trường bắt buộc mới (ví dụ: `service_category_id`).'
test_data: Old Job mutation payload missing `service_category_id`.
steps:
- desc: Tạo Job offline trên app.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Backend triển khai cập nhật validation rule mới.
  action: back
  delay: 1.0
- desc: Bật mạng online để app đồng bộ payload cũ lên server.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Kiểm tra phản hồi từ backend và cách app xử lý nếu bị 422.
  action: back
  delay: 1.0
expected:
- desc: Backend có cơ chế backward-compatible default cho payload từ các version app
    cũ.
  assert_text: Sync Engine / Schema
- desc: 'Nếu backend reject 422: App không drop payload mà hiển thị cảnh báo yêu cầu
    người dùng mở Job bổ sung trường còn thiếu rồi ấn Sync lại.'
  assert_text: Sync Engine / Schema
source_tickets: RN-5477 / API-Contract
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Unrecoverable Sync Rejection
notes: Cần chiến lược versioning API và compatibility window tối thiểu 30 ngày.
