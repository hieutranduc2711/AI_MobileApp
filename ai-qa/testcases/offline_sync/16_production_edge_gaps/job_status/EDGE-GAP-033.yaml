id: EDGE-GAP-033
title: 'Rapid Status Coalescing (Squash Mutations): Sửa liên tiếp Job: Pending → In
  Progress → Completed trong 2 phút khi Offline → Outbox gộp thành 1 m'
sheet: 16_Production_Edge_Gaps
module: Job / Status
action: Rapid Status Coalescing (Squash Mutations)
priority: P1
flow_phase: Semantic Action Ordering
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job Execution
preconditions: Thiết bị offline.
test_data: 'Job #100: Status transitions: Pending -> In Progress -> Completed within
  120 seconds.'
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job đầu tiên từ màn hình Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Bấm chọn ô trạng thái Job Status
  action: tap_selector
  content_desc: Unconfirmed
  text: Unconfirmed
- desc: Chọn trạng thái 'Completed' trong danh sách
  action: tap_selector
  text: Completed
  content_desc: Completed
expected:
- desc: Trạng thái Job được cập nhật thành 'Completed' trong local cache
  assert_text: Completed
- desc: Màn hình Job Details duy trì trạng thái ổn định không lỗi
  assert_text: Job Details
source_tickets: RN-5477 / Coalesce-Mutations
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Out-of-order Status / Stale Override
notes: Tránh tình trạng race condition gửi request Completed trước rồi request In
  Progress đến sau ghi đè.
