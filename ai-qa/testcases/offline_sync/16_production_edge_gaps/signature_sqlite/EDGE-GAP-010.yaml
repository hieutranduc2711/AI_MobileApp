id: EDGE-GAP-010
title: 'Large Signature Vector/Base64 Boundary Storage: Khách hàng vẽ chữ ký phức
  tạp/dày đặc tạo vector/SVG lớn → Lưu vào SQLite không vượt giới hạn row si'
sheet: 16_Production_Edge_Gaps
module: Signature / SQLite
action: Large Signature Vector/Base64 Boundary Storage
priority: P2
flow_phase: Storage & Low Disk Limit
direction: ONLINE → OFFLINE
app_path: GD Mobile > Work Order > Signature Pad
preconditions: Thiết bị offline; mở modal lấy chữ ký khách hàng.
test_data: Complex customer signature drawing (high-density strokes > 500KB raw vector
  points).
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Signatures trong Job Details
  action: tap_selector
  text: Signatures
- desc: Thực hiện ký xác nhận (Tech Signature)
  action: macro
  value: take_signature
  args:
    target: tech
expected:
- desc: Chữ ký số được mã hóa và lưu vào hồ sơ Job offline
  assert_text: Signatures
- desc: Chữ ký duy trì nguyên vẹn sau khi mất mạng
  assert_text: Save
source_tickets: RN-5477 / RN-5605 / RN-5680
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: UI Freeze / Slow Query
notes: Tránh lưu trực tiếp data URI Base64 khổng lồ vào cột TEXT của SQLite.
