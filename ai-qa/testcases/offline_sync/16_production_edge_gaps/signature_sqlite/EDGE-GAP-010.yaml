id: EDGE-GAP-010
title: 'Large Signature Vector/Base64 Boundary Storage: Khách hàng vẽ chữ ký phức
  tạp/dày đặc tạo vector/SVG lớn → Lưu vào SQLite không vượt giới hạn row si'
sheet: 16_Production_Edge_Gaps
module: Signature / SQLite
action: Large Signature Vector/Base64 Boundary Storage
priority: P2
flow_phase: Storage & Low Disk Limit
direction: ONLINE → OFFLINE
app_path: GD Mobile > Work Order > Signature Pad
preconditions: Thiết bị offline; mở modal lấy chữ ký khách hàng.
test_data: Complex customer signature drawing (high-density strokes > 500KB raw vector
  points).
steps:
- desc: Mở modal ký tên.
  action: tap_selector
  text: Mở modal ký tên.
  delay: 1.0
- desc: Vẽ chữ ký cực kỳ dày đặc và phức tạp trong 30 giây.
  action: tap_selector
  text: Vẽ chữ ký cực kỳ dày đặc và ph
  delay: 1.0
- desc: Bấm Save Signature.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Kiểm tra thời gian ghi vào SQLite và thời gian load lại qua hook `useEntity`.
  action: tap_selector
  text: Kiểm tra thời gian ghi vào SQL
  delay: 1.0
expected:
- desc: File chữ ký được ghi ra disk dạng file PNG/SVG cục bộ và chỉ lưu path/URI
    vào SQLite (hoặc blob tối ưu).
  assert_text: Signature / SQLite
- desc: Quá trình lưu diễn ra < 300ms.
  assert_text: Signature / SQLite
- desc: Truy vấn `useEntity` của Job không bị giật lag khung hình khi render lại màn
    hình chi tiết.
  assert_text: Signature / SQLite
source_tickets: RN-5477 / RN-5605 / RN-5680
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: UI Freeze / Slow Query
notes: Tránh lưu trực tiếp data URI Base64 khổng lồ vào cột TEXT của SQLite.
