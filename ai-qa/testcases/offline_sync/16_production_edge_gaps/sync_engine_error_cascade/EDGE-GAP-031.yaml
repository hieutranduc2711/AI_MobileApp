id: EDGE-GAP-031
title: 'Parent Rejection Cascading Child Blocker: Nút cha bị Server Reject (Customer
  A bị 422 trùng Email) → Các nút con (L1, J1, I1) tự động chuyển '''
sheet: 16_Production_Edge_Gaps
module: Sync Engine / Error Cascade
action: Parent Rejection Cascading Child Blocker
priority: P0
flow_phase: Parent local:* Dependency
direction: OFFLINE → ONLINE
app_path: GD Mobile > Sync Manager / Alerts
preconditions: Thiết bị offline tạo Customer A (email đã tồn tại trên server) kèm
  Location, Job, Invoice phụ thuộc.
test_data: 'Duplicate email: ''existing@gorilladesk.com'' triggers server 422 Unprocessable
  Entity.'
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Khóa màn hình thiết bị và mở khóa lại để kiểm tra bảo lưu phiên
  action: lock_screen
  value: '3.0'
- desc: Thực hiện thao tác Parent Rejection Cascading Child Blocker trên giao diện
    GorillaDesk
  action: macro
  value: ensure_calendar_home
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Thao tác Parent Rejection Cascading Child Blocker duy trì trạng thái ổn định
    trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5477 / Cascade-Failure
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5477
risk: Orphaned Records / Server Crash
notes: Đảm bảo không xả các entity con khi entity cha bị reject.
