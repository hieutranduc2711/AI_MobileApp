id: SYNC-02112
title: 'Resize Job: Online → Offline Resize Job → restart → Online'
sheet: 03_Round_Trip
module: Calendar
action: Resize Job
priority: P1
flow_phase: RT-03 Round trip with app restart
direction: ROUND TRIP
app_path: GD Mobile > Calendar > Job
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Resize Job accessible.
test_data: Valid entity
steps:
- desc: Load entity Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Go Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Resize Job.
  action: tap_selector
  text: Resize Job
  delay: 1.0
- desc: Force close app khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Mở lại app Offline và verify local result.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Chờ sync completion.
  action: tap_selector
  text: Chờ sync completion.
  delay: 1.0
- desc: Verify server/local.
  action: tap_selector
  text: Verify server/local.
  delay: 1.0
expected:
- desc: Local mutation sống qua restart.
  assert_text: Calendar
- desc: Reconnect không tạo lại/nhân đôi mutation.
  assert_text: Calendar
- desc: Final authoritative state đúng.
  assert_text: Calendar
