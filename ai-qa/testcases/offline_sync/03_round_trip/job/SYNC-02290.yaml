id: SYNC-02290
title: 'Change Job status: Online bắt đầu → Offline hoàn tất Change Job status → Online
  sync'
sheet: 03_Round_Trip
module: Job
action: Change Job status
priority: P0
flow_phase: RT-01 Continue work through outage
direction: ROUND TRIP
app_path: GD Mobile > Job > Status
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Change Job status
  accessible.
test_data: Valid business data
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job đầu tiên từ màn hình Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Bấm chọn ô trạng thái Job Status
  action: tap_selector
  content_desc: Unconfirmed
  text: Unconfirmed
- desc: Chọn trạng thái 'Sent' trong danh sách
  action: tap_selector
  text: Sent
  content_desc: Sent
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Trạng thái Job được cập nhật thành 'Sent' trong local cache
  assert_text: Sent
- desc: Màn hình Job Details duy trì trạng thái ổn định không lỗi
  assert_text: Job Details
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
source_tickets: RN-5571, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5571

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Real field workflow
notes: ''
