id: SYNC-02420
title: 'Create Note: Create Note qua Online → Offline → Online → Offline → Online'
sheet: 03_Round_Trip
module: Note
action: Create Note
priority: P1
flow_phase: RT-02 Multiple transitions
direction: ROUND TRIP
app_path: GD Mobile > Job/Customer > Notes > Add
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Create Note accessible.
test_data: Valid entity
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Notes trong Job Details
  action: tap_selector
  text: Notes
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Ghi chú được lưu vào bộ nhớ cục bộ của Job
  assert_text: Notes
- desc: Top Note hiển thị đầy đủ không bị mất
  assert_text: Top Note
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
