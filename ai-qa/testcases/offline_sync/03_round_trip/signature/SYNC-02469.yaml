id: SYNC-02469
title: 'Capture Unit Signature: Online → Offline Capture Unit Signature → restart
  → Online'
sheet: 03_Round_Trip
module: Signature
action: Capture Unit Signature
priority: P1
flow_phase: RT-03 Round trip with app restart
direction: ROUND TRIP
app_path: GD Mobile > MDU > Unit > Signature
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Capture Unit
  Signature accessible.
test_data: Valid entity
steps:
- desc: Load entity Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Go Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Capture Unit Signature.
  action: tap_selector
  text: Capture Unit Signature
  delay: 1.0
- desc: Force close app khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Mở lại app Offline và verify local result.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Chờ sync completion.
  action: tap_selector
  text: Chờ sync completion.
  delay: 1.0
- desc: Verify server/local.
  action: tap_selector
  text: Verify server/local.
  delay: 1.0
expected:
- desc: Local mutation sống qua restart.
  assert_text: Signature
- desc: Reconnect không tạo lại/nhân đôi mutation.
  assert_text: Signature
- desc: Final authoritative state đúng.
  assert_text: Signature
