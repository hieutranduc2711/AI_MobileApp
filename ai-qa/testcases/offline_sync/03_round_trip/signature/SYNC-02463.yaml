priority: P1
flow_phase: RT-03 Round trip with app restart
direction: ROUND TRIP
app_path: GD Mobile > Invoice > Signature
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Capture Invoice
  Customer Signature accessible.
test_data: Valid entity
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Drawer Menu từ Calendar
  action: tap_selector
  content_desc: Open navigation drawer
  value: 0.06,0.07
- desc: Chọn mục Customers trong danh mục
  action: tap_selector
  text: Customers
- desc: Chọn khách hàng trong danh sách để xem chi tiết
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Danh sách khách hàng và lịch sử làm việc hiển thị từ SQLite local cache
  assert_text: Customer
- desc: Dữ liệu vị trí và liên hệ được nạp đầy đủ khi offline
  assert_text: All Locations
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
