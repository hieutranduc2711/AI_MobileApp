id: SYNC-02224
title: 'Edit existing Job Document: Online bắt đầu → Offline hoàn tất Edit existing
  Job Document → Online sync'
sheet: 03_Round_Trip
module: Document
action: Edit existing Job Document
priority: P0
flow_phase: RT-01 Continue work through outage
direction: ROUND TRIP
app_path: GD Mobile > Job > Documents > Edit
preconditions: Đúng account/branch; prerequisite data sync sẵn; flow Edit existing
  Job Document accessible.
test_data: Valid business data
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Attach a Photo trong Job Details
  action: tap_selector
  text: Attach a Photo
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Mục đính kèm ảnh sẵn sàng để xếp hàng chờ sync
  assert_text: Attach a Photo
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
