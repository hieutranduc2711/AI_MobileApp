id: SYNC-02241
title: 'Change Estimate tax: Online → Offline Change Estimate tax → restart → Online'
sheet: 03_Round_Trip
module: Estimate
action: Change Estimate tax
priority: P1
flow_phase: RT-03 Round trip with app restart
direction: ROUND TRIP
app_path: GD Mobile > Estimate > Tax
