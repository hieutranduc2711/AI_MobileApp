  value: 'false'
  delay: 2.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Chờ sync completion.
  action: tap_selector
  text: Chờ sync completion.
  delay: 1.0
- desc: Verify server/local.
  action: tap_selector
  text: Verify server/local.
  delay: 1.0
expected:
- desc: Local mutation sống qua restart.
  assert_text: Estimate
- desc: Reconnect không tạo lại/nhân đôi mutation.
  assert_text: Estimate
- desc: Final authoritative state đúng.
  assert_text: Estimate
