- desc: Bấm Save lưu thông tin khách hàng
  action: tap_selector
  content_desc: Save
expected:
- desc: Hồ sơ khách hàng được tạo thành công trong chế độ offline
  assert_text: Offline
- desc: Dữ liệu khách hàng được lưu trữ cục bộ không bị rollback
