  value: 0.91,0.94
- desc: Chọn New Customer trong Action Sheet
  action: tap_selector
  content_desc: New Customer
  text: New Customer
  value: 0.5,0.78
- desc: Nhập First Name khách hàng
  action: tap_selector
  text: First Name
- desc: Điền First Name
  action: type_text
