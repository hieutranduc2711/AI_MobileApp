- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Estimate trong Action Sheet
  action: tap_selector
  content_desc: New Estimate
  text: New Estimate
  value: 0.5,0.88
- desc: Chọn khách hàng lập báo giá
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn địa điểm dịch vụ
  action: tap_selector
  resource_id: location-item
  index: 0
- desc: Bấm Save để lưu Estimate offline
  action: tap_selector
  content_desc: Save
expected:
