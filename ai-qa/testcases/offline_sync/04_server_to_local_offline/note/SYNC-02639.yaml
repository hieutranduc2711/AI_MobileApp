id: SYNC-02639
title: 'READ: Notes/Top Notes/Comments: Notes/Top Notes/Comments: Local stale → API
  revalidate → go Offline'
sheet: 04_Server_to_Local_Offline
module: Note
action: 'READ: Notes/Top Notes/Comments'
priority: P1
flow_phase: S2L-05 API revalidation then offline
direction: SERVER → LOCAL → OFFLINE
app_path: GD Mobile > Job/Customer > Notes
preconditions: Mobile Online và authenticated; web/thiết bị thứ hai có quyền thay
  đổi cùng data.
test_data: Notes/Top Notes/Comments
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Notes trong Job Details
  action: tap_selector
  text: Notes
expected:
- desc: Ghi chú được lưu vào bộ nhớ cục bộ của Job
  assert_text: Notes
- desc: Top Note hiển thị đầy đủ không bị mất
  assert_text: Top Note
source_tickets: RN-5536, RN-5634
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5536

  https://gorilladesk1.atlassian.net/browse/RN-5634'
risk: Down-sync/cache correctness
notes: 'Đây là chiều ngược quan trọng: server/online state phải xuống local trước
  khi device mất mạng.'
