id: SYNC-02631
title: 'READ: Materials: Materials: Server update record → mobile nhận → go Offline'
sheet: 04_Server_to_Local_Offline
module: Material
action: 'READ: Materials'
priority: P0
flow_phase: S2L-03 Server update then offline
direction: SERVER → LOCAL → OFFLINE
app_path: GD Mobile > Job > Materials
preconditions: Mobile Online và authenticated; web/thiết bị thứ hai có quyền thay
  đổi cùng data.
test_data: Materials
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Materials trong Job Details
  action: tap_selector
  text: Materials
- desc: Thêm vật tư / hóa chất sử dụng trong công việc
  action: macro
  value: add_material
expected:
- desc: Vật tư được ghi nhận định mức và trừ kho cục bộ
  assert_text: Materials
source_tickets: RN-5545, RN-5634
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5545

  https://gorilladesk1.atlassian.net/browse/RN-5634'
risk: Down-sync/cache correctness
notes: 'Đây là chiều ngược quan trọng: server/online state phải xuống local trước
  khi device mất mạng.'
