- desc: A thực hiện value/action A.
  action: tap_selector
  text: Delete Unit Photo
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Delete Unit Photo
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Delete Unit Photo không làm app crash/mất dữ liệu.
