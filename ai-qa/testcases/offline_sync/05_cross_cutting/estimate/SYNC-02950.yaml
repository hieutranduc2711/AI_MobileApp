id: SYNC-02950
title: 'Change Estimate status: 2 devices conflict on Change Estimate status'
sheet: 05_Cross_Cutting
module: Estimate
action: Change Estimate status
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Estimate > Status
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Change Estimate
  status; prerequisite cho Estimate đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Change Estimate status
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Change Estimate status
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Change Estimate status không làm app crash/mất dữ liệu.
  assert_text: Estimate
- desc: Local/UI của Estimate phản ánh đúng business result.
  assert_text: Estimate
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Estimate
- desc: Không duplicate logical operation.
  assert_text: Estimate
- desc: No structural corruption/duplicate.
  assert_text: Estimate
- desc: Outcome reproducible.
  assert_text: Estimate
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Estimate
