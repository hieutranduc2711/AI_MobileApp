id: SYNC-02940
title: 'Create Estimate: Create Estimate rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Estimate
action: Create Estimate
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Job/Customer > Estimate > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Estimate;
  prerequisite cho Estimate đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Estimate.
  action: tap_selector
  text: Create Estimate
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Estimate không làm app crash/mất dữ liệu.
  assert_text: Estimate
- desc: Local/UI của Estimate phản ánh đúng business result.
  assert_text: Estimate
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Estimate
- desc: Không duplicate logical operation.
  assert_text: Estimate
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Estimate
- desc: Create/delete collapse/order an toàn.
  assert_text: Estimate
- desc: No pending forever.
  assert_text: Estimate
