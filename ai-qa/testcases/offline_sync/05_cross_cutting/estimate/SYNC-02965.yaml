id: SYNC-02965
title: 'Delete Estimate line item: 2 devices conflict on Delete Estimate line item'
sheet: 05_Cross_Cutting
module: Estimate
action: Delete Estimate line item
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Estimate > Line Items > Delete
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Delete Estimate
  line item; prerequisite cho Estimate Line Item đã sync khi cần. Có Device A/B cùng
  initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Delete Estimate line item
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Delete Estimate line item
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Delete Estimate line item không làm app crash/mất dữ liệu.
  assert_text: Estimate
