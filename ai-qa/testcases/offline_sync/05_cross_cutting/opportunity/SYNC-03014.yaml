id: SYNC-03014
title: 'Create Opportunity: Double-tap Save khi Create Opportunity'
sheet: 05_Cross_Cutting
module: Opportunity
action: Create Opportunity
priority: P0
flow_phase: Double Save
direction: CROSS-CUTTING
app_path: GD Mobile > Customer > Opportunities > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Opportunity;
  prerequisite cho Opportunity đã sync khi cần.
test_data: Valid create payload
steps:
- desc: Go offline hoặc throttle.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Điền form Create Opportunity.
  action: tap_selector
  text: Điền form Create Opportunity.
  delay: 1.0
- desc: Tap Save/Confirm 2 lần nhanh.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Inspect local list/outbox.
  action: tap_selector
  text: Inspect local list/outbox.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Count server records.
  action: tap_selector
  text: Count server records.
  delay: 1.0
expected:
- desc: Create Opportunity không làm app crash/mất dữ liệu.
  assert_text: Opportunity
- desc: Local/UI của Opportunity phản ánh đúng business result.
  assert_text: Opportunity
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Opportunity
- desc: Không duplicate logical operation.
  assert_text: Opportunity
- desc: Chỉ một logical record.
  assert_text: Opportunity
- desc: Không duplicate local/server.
  assert_text: Opportunity
