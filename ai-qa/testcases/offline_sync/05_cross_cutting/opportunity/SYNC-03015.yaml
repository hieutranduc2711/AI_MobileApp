id: SYNC-03015
title: 'Create Opportunity: Create Opportunity rồi edit trước sync'
sheet: 05_Cross_Cutting
module: Opportunity
action: Create Opportunity
priority: P0
flow_phase: Create→Edit Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Customer > Opportunities > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Opportunity;
  prerequisite cho Opportunity đã sync khi cần.
test_data: Create + edit values
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Opportunity.
  action: tap_selector
  text: Create Opportunity
  delay: 1.0
- desc: Open local record.
  action: tap_selector
  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
- desc: Create Opportunity không làm app crash/mất dữ liệu.
  assert_text: Opportunity
- desc: Local/UI của Opportunity phản ánh đúng business result.
  assert_text: Opportunity
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Opportunity
- desc: Không duplicate logical operation.
  assert_text: Opportunity
- desc: Create + edit không mất nhau.
  assert_text: Opportunity
- desc: Single server record với final intended value hoặc ordered effects.
  assert_text: Opportunity
- desc: Local ID mapping đúng.
  assert_text: Opportunity
