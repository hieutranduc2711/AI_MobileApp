id: SYNC-02881
title: 'Delete Job Document: 2 devices conflict on Delete Job Document'
sheet: 05_Cross_Cutting
module: Document
action: Delete Job Document
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
