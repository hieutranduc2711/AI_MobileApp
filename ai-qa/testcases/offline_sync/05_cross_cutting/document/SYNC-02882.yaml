id: SYNC-02882
title: 'Reset Document: Reset Document pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Document
action: Reset Document
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Document > Reset
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Reset Document;
  prerequisite cho Document đã sync khi cần.
test_data: Valid representative data
steps:
- desc: Switch Branch A.
  action: tap_selector
  text: Switch Branch A.
  delay: 1.0
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Reset Document.
  action: tap_selector
  text: Reset Document
  delay: 1.0
- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Reset Document không làm app crash/mất dữ liệu.
  assert_text: Document
- desc: Local/UI của Document phản ánh đúng business result.
  assert_text: Document
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Document
- desc: Không duplicate logical operation.
  assert_text: Document
- desc: A mutation không send với B context.
  assert_text: Document
- desc: B không thấy A optimistic data.
  assert_text: Document
- desc: Converge ở A only.
  assert_text: Document
