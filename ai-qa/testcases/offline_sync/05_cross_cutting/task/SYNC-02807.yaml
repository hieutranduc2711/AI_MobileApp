id: SYNC-02807
title: 'Create Task: Create Task rồi edit trước sync'
sheet: 05_Cross_Cutting
module: Task
action: Create Task
priority: P0
flow_phase: Create→Edit Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Tasks > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Task;
  prerequisite cho Task đã sync khi cần.
test_data: Create + edit values
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Task.
  action: tap_selector
  text: Create Task
  delay: 1.0
- desc: Open local record.
  action: tap_selector
  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
- desc: Create Task không làm app crash/mất dữ liệu.
  assert_text: Task
- desc: Local/UI của Task phản ánh đúng business result.
  assert_text: Task
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Task
- desc: Không duplicate logical operation.
  assert_text: Task
- desc: Create + edit không mất nhau.
  assert_text: Task
- desc: Single server record với final intended value hoặc ordered effects.
  assert_text: Task
- desc: Local ID mapping đúng.
  assert_text: Task
