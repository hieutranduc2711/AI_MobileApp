id: SYNC-02808
title: 'Create Task: Create Task rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Task
action: Create Task
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Tasks > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Task;
  prerequisite cho Task đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Task.
  action: tap_selector
  text: Create Task
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Task không làm app crash/mất dữ liệu.
  assert_text: Task
- desc: Local/UI của Task phản ánh đúng business result.
  assert_text: Task
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Task
- desc: Không duplicate logical operation.
  assert_text: Task
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Task
- desc: Create/delete collapse/order an toàn.
  assert_text: Task
- desc: No pending forever.
  assert_text: Task
