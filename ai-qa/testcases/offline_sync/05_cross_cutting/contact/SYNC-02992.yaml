id: SYNC-02992
title: 'Create Contact: Create Contact rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Contact
action: Create Contact
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Customer > Contacts > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Contact;
  prerequisite cho Contact đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Contact.
  action: tap_selector
  text: Create Contact
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Contact không làm app crash/mất dữ liệu.
  assert_text: Contact
- desc: Local/UI của Contact phản ánh đúng business result.
  assert_text: Contact
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Contact
- desc: Không duplicate logical operation.
  assert_text: Contact
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Contact
- desc: Create/delete collapse/order an toàn.
  assert_text: Contact
- desc: No pending forever.
  assert_text: Contact
