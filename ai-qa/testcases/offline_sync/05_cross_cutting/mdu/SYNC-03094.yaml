id: SYNC-03094
title: 'Create Building: Create Building rồi delete trước sync'
sheet: 05_Cross_Cutting
module: MDU
action: Create Building
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Location > MDU > Building > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Building;
  prerequisite cho Building đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Building.
  action: tap_selector
  text: Create Building
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Building không làm app crash/mất dữ liệu.
  assert_text: MDU
- desc: Local/UI của Building phản ánh đúng business result.
  assert_text: MDU
- desc: Không ghi/send mutation sai account/branch.
  assert_text: MDU
- desc: Không duplicate logical operation.
  assert_text: MDU
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: MDU
- desc: Create/delete collapse/order an toàn.
  assert_text: MDU
- desc: No pending forever.
  assert_text: MDU
