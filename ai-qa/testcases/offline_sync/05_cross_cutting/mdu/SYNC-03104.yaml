id: SYNC-03104
title: 'Create Unit: Double-tap Save khi Create Unit'
sheet: 05_Cross_Cutting
module: MDU
action: Create Unit
priority: P0
flow_phase: Double Save
direction: CROSS-CUTTING
app_path: GD Mobile > Location > MDU > Unit > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Unit;
  prerequisite cho Unit đã sync khi cần.
test_data: Valid create payload
steps:
- desc: Go offline hoặc throttle.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Điền form Create Unit.
  action: tap_selector
  text: Điền form Create Unit.
  delay: 1.0
- desc: Tap Save/Confirm 2 lần nhanh.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Inspect local list/outbox.
  action: tap_selector
  text: Inspect local list/outbox.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Count server records.
  action: tap_selector
  text: Count server records.
  delay: 1.0
expected:
- desc: Create Unit không làm app crash/mất dữ liệu.
  assert_text: MDU
- desc: Local/UI của Unit phản ánh đúng business result.
  assert_text: MDU
- desc: Không ghi/send mutation sai account/branch.
  assert_text: MDU
- desc: Không duplicate logical operation.
  assert_text: MDU
- desc: Chỉ một logical record.
  assert_text: MDU
- desc: Không duplicate local/server.
  assert_text: MDU
