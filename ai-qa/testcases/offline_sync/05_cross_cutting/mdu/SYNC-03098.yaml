id: SYNC-03098
title: 'Edit Building: 2 devices conflict on Edit Building'
sheet: 05_Cross_Cutting
module: MDU
action: Edit Building
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Location > MDU > Building > Edit
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Edit Building;
  prerequisite cho Building đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Edit Building
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Edit Building
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Edit Building không làm app crash/mất dữ liệu.
  assert_text: MDU
- desc: Local/UI của Building phản ánh đúng business result.
  assert_text: MDU
- desc: Không ghi/send mutation sai account/branch.
  assert_text: MDU
- desc: Không duplicate logical operation.
  assert_text: MDU
- desc: No structural corruption/duplicate.
  assert_text: MDU
- desc: Outcome reproducible.
  assert_text: MDU
- desc: Không tự giả định winner; capture actual policy.
  assert_text: MDU
