id: SYNC-03143
title: 'Edit Unit Comment: 2 devices conflict on Edit Unit Comment'
sheet: 05_Cross_Cutting
module: MDU
action: Edit Unit Comment
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > MDU > Unit > Comment > Edit
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Edit Unit Comment;
  prerequisite cho Unit Comment đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
