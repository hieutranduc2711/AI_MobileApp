id: SYNC-03093
title: 'Create Building: Create Building rồi edit trước sync'
sheet: 05_Cross_Cutting
module: MDU
action: Create Building
priority: P0
flow_phase: Create→Edit Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Location > MDU > Building > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Building;
  prerequisite cho Building đã sync khi cần.
test_data: Create + edit values
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Building.
  action: tap_selector
  text: Create Building
  delay: 1.0
- desc: Open local record.
  action: tap_selector
  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
- desc: Create Building không làm app crash/mất dữ liệu.
  assert_text: MDU
- desc: Local/UI của Building phản ánh đúng business result.
  assert_text: MDU
- desc: Không ghi/send mutation sai account/branch.
  assert_text: MDU
- desc: Không duplicate logical operation.
  assert_text: MDU
- desc: Create + edit không mất nhau.
  assert_text: MDU
- desc: Single server record với final intended value hoặc ordered effects.
  assert_text: MDU
- desc: Local ID mapping đúng.
  assert_text: MDU
