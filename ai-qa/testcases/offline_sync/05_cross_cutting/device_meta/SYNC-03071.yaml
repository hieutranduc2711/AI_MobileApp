id: SYNC-03071
title: 'Create Device Status: Create Device Status rồi edit trước sync'
sheet: 05_Cross_Cutting
module: Device Meta
action: Create Device Status
priority: P0
flow_phase: Create→Edit Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Device Settings > Device Status
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Device
  Status; prerequisite cho Device Status đã sync khi cần.
test_data: Create + edit values
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Device Status.
  action: tap_selector
  text: Create Device Status
  delay: 1.0
- desc: Open local record.
  action: tap_selector
  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
- desc: Create Device Status không làm app crash/mất dữ liệu.
  assert_text: Device Meta
- desc: Local/UI của Device Status phản ánh đúng business result.
  assert_text: Device Meta
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Device Meta
- desc: Không duplicate logical operation.
  assert_text: Device Meta
- desc: Create + edit không mất nhau.
  assert_text: Device Meta
- desc: Single server record với final intended value hoặc ordered effects.
  assert_text: Device Meta
- desc: Local ID mapping đúng.
  assert_text: Device Meta
