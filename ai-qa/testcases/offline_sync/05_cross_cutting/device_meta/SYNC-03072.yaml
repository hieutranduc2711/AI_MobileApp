id: SYNC-03072
title: 'Create Device Status: Create Device Status rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Device Meta
action: Create Device Status
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Device Settings > Device Status
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Device
  Status; prerequisite cho Device Status đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Device Status.
  action: tap_selector
  text: Create Device Status
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Device Status không làm app crash/mất dữ liệu.
  assert_text: Device Meta
- desc: Local/UI của Device Status phản ánh đúng business result.
  assert_text: Device Meta
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Device Meta
- desc: Không duplicate logical operation.
  assert_text: Device Meta
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Device Meta
- desc: Create/delete collapse/order an toàn.
  assert_text: Device Meta
- desc: No pending forever.
  assert_text: Device Meta
