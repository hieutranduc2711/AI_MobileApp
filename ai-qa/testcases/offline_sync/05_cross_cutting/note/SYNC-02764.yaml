id: SYNC-02764
title: 'Edit Top Note: 2 devices conflict on Edit Top Note'
sheet: 05_Cross_Cutting
module: Note
action: Edit Top Note
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Top Note > Edit
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Edit Top Note;
  prerequisite cho Top Note đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Edit Top Note
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Edit Top Note
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Edit Top Note không làm app crash/mất dữ liệu.
  assert_text: Note
- desc: Local/UI của Top Note phản ánh đúng business result.
  assert_text: Note
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Note
- desc: Không duplicate logical operation.
  assert_text: Note
- desc: No structural corruption/duplicate.
  assert_text: Note
- desc: Outcome reproducible.
  assert_text: Note
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Note
