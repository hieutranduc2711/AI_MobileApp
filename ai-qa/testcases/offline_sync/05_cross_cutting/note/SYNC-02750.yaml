id: SYNC-02750
title: 'Delete Note: Delete Note pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Note
action: Delete Note
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Notes > Delete
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Delete Note;
  prerequisite cho Note đã sync khi cần.
test_data: Valid representative data
steps:
- desc: Switch Branch A.
  action: tap_selector
  text: Switch Branch A.
  delay: 1.0
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Delete Note.
  action: tap_selector
  text: Delete Note
  delay: 1.0
- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Delete Note không làm app crash/mất dữ liệu.
  assert_text: Note
- desc: Local/UI của Note phản ánh đúng business result.
  assert_text: Note
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Note
- desc: Không duplicate logical operation.
  assert_text: Note
- desc: A mutation không send với B context.
  assert_text: Note
- desc: B không thấy A optimistic data.
  assert_text: Note
- desc: Converge ở A only.
  assert_text: Note
source_tickets: RN-5567, RN-5536
