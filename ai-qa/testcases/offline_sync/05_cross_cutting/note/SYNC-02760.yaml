id: SYNC-02760
title: 'Create Top Note: Create Top Note rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Note
action: Create Top Note
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Job/Customer > Top Note
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Top Note;
  prerequisite cho Top Note đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Top Note.
  action: tap_selector
  text: Create Top Note
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Top Note không làm app crash/mất dữ liệu.
  assert_text: Note
- desc: Local/UI của Top Note phản ánh đúng business result.
  assert_text: Note
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Note
- desc: Không duplicate logical operation.
  assert_text: Note
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Note
- desc: Create/delete collapse/order an toàn.
  assert_text: Note
- desc: No pending forever.
  assert_text: Note
