id: SYNC-02770
title: 'Create Comment: Double-tap Save khi Create Comment'
sheet: 05_Cross_Cutting
module: Note
action: Create Comment
priority: P0
flow_phase: Double Save
direction: CROSS-CUTTING
app_path: GD Mobile > Note > Comments > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Comment;
  prerequisite cho Comment đã sync khi cần.
test_data: Valid create payload
steps:
- desc: Go offline hoặc throttle.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Điền form Create Comment.
  action: tap_selector
  text: Điền form Create Comment.
  delay: 1.0
- desc: Tap Save/Confirm 2 lần nhanh.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Inspect local list/outbox.
  action: tap_selector
  text: Inspect local list/outbox.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Count server records.
  action: tap_selector
  text: Count server records.
  delay: 1.0
expected:
- desc: Create Comment không làm app crash/mất dữ liệu.
  assert_text: Note
- desc: Local/UI của Comment phản ánh đúng business result.
  assert_text: Note
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Note
- desc: Không duplicate logical operation.
  assert_text: Note
- desc: Chỉ một logical record.
  assert_text: Note
- desc: Không duplicate local/server.
  assert_text: Note
