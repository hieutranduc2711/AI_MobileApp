test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Todo.
  action: tap_selector
  text: Create Todo
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Todo không làm app crash/mất dữ liệu.
  assert_text: Todo
- desc: Local/UI của Todo phản ánh đúng business result.
  assert_text: Todo
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Todo
- desc: Không duplicate logical operation.
  assert_text: Todo
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Todo
- desc: Create/delete collapse/order an toàn.
  assert_text: Todo
- desc: No pending forever.
  assert_text: Todo
