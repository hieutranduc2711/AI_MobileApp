id: SYNC-02780
title: 'Create Todo: Create Todo pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Todo
action: Create Todo
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Todo > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Todo;
  prerequisite cho Todo đã sync khi cần.
test_data: Valid representative data
steps:
- desc: Switch Branch A.
  action: tap_selector
  text: Switch Branch A.
  delay: 1.0
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Todo.
  action: tap_selector
  text: Create Todo
  delay: 1.0
- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Create Todo không làm app crash/mất dữ liệu.
  assert_text: Todo
- desc: Local/UI của Todo phản ánh đúng business result.
  assert_text: Todo
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Todo
- desc: Không duplicate logical operation.
  assert_text: Todo
- desc: A mutation không send với B context.
  assert_text: Todo
- desc: B không thấy A optimistic data.
  assert_text: Todo
- desc: Converge ở A only.
  assert_text: Todo
