id: SYNC-02783
title: 'Create Todo: Create Todo rồi edit trước sync'
sheet: 05_Cross_Cutting
module: Todo
action: Create Todo
priority: P0
flow_phase: Create→Edit Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Todo > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Todo;
  prerequisite cho Todo đã sync khi cần.
test_data: Create + edit values
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Todo.
  action: tap_selector
  text: Create Todo
  delay: 1.0
- desc: Open local record.
  action: tap_selector
  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
- desc: Create Todo không làm app crash/mất dữ liệu.
  assert_text: Todo
- desc: Local/UI của Todo phản ánh đúng business result.
  assert_text: Todo
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Todo
- desc: Không duplicate logical operation.
  assert_text: Todo
- desc: Create + edit không mất nhau.
  assert_text: Todo
- desc: Single server record với final intended value hoặc ordered effects.
  assert_text: Todo
- desc: Local ID mapping đúng.
  assert_text: Todo
