id: SYNC-02800
title: 'Reorder Todo: 2 devices conflict on Reorder Todo'
sheet: 05_Cross_Cutting
module: Todo
action: Reorder Todo
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Todo > Reorder
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Reorder Todo;
