id: SYNC-02782
title: 'Create Todo: Double-tap Save khi Create Todo'
sheet: 05_Cross_Cutting
module: Todo
action: Create Todo
priority: P0
flow_phase: Double Save
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Todo > Add
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Todo;
  prerequisite cho Todo đã sync khi cần.
test_data: Valid create payload
steps:
- desc: Go offline hoặc throttle.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Điền form Create Todo.
  action: tap_selector
  text: Điền form Create Todo.
  delay: 1.0
- desc: Tap Save/Confirm 2 lần nhanh.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Inspect local list/outbox.
  action: tap_selector
  text: Inspect local list/outbox.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Count server records.
  action: tap_selector
  text: Count server records.
  delay: 1.0
expected:
- desc: Create Todo không làm app crash/mất dữ liệu.
  assert_text: Todo
- desc: Local/UI của Todo phản ánh đúng business result.
  assert_text: Todo
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Todo
- desc: Không duplicate logical operation.
  assert_text: Todo
- desc: Chỉ một logical record.
  assert_text: Todo
- desc: Không duplicate local/server.
  assert_text: Todo
