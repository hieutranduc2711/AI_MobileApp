- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
