- desc: Không ghi/send mutation sai account/branch.
  assert_text: Device
- desc: Không duplicate logical operation.
  assert_text: Device
- desc: A mutation không send với B context.
  assert_text: Device
- desc: B không thấy A optimistic data.
  assert_text: Device
- desc: Converge ở A only.
  assert_text: Device
