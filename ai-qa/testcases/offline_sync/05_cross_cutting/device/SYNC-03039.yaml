id: SYNC-03039
title: 'Scan Barcode: Scan Barcode pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Device
action: Scan Barcode
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
