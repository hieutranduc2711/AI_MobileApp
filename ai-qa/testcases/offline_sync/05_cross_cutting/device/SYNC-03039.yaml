- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Scan Barcode không làm app crash/mất dữ liệu.
  assert_text: Device
- desc: Local/UI của Device phản ánh đúng business result.
