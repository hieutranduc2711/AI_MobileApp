id: SYNC-03053
title: 'Delete/Reassign Device Area: 2 devices conflict on Delete/Reassign Device
  Area'
sheet: 05_Cross_Cutting
module: Device
action: Delete/Reassign Device Area
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Devices > Areas > Delete/Reassign
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Delete/Reassign
  Device Area; prerequisite cho Device Area đã sync khi cần. Có Device A/B cùng initial
  record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Delete/Reassign Device Area
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Delete/Reassign Device Area
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Delete/Reassign Device Area không làm app crash/mất dữ liệu.
  assert_text: Device
- desc: Local/UI của Device Area phản ánh đúng business result.
  assert_text: Device
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Device
- desc: Không duplicate logical operation.
  assert_text: Device
- desc: No structural corruption/duplicate.
  assert_text: Device
- desc: Outcome reproducible.
  assert_text: Device
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Device
