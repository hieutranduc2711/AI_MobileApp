id: SYNC-02917
title: 'Update Invoice note: 2 devices conflict on Update Invoice note'
sheet: 05_Cross_Cutting
module: Invoice
action: Update Invoice note
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Invoice > Note
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Update Invoice
  note; prerequisite cho Invoice đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
