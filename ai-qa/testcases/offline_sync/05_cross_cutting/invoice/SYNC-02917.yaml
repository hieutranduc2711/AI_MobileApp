  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Update Invoice note
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Update Invoice note
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Update Invoice note không làm app crash/mất dữ liệu.
  assert_text: Invoice
- desc: Local/UI của Invoice phản ánh đúng business result.
  assert_text: Invoice
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Invoice
- desc: Không duplicate logical operation.
  assert_text: Invoice
- desc: No structural corruption/duplicate.
  assert_text: Invoice
- desc: Outcome reproducible.
  assert_text: Invoice
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Invoice
