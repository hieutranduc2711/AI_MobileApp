- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Invoice không làm app crash/mất dữ liệu.
  assert_text: Invoice
- desc: Local/UI của Invoice phản ánh đúng business result.
  assert_text: Invoice
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Invoice
- desc: Không duplicate logical operation.
  assert_text: Invoice
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Invoice
- desc: Create/delete collapse/order an toàn.
  assert_text: Invoice
- desc: No pending forever.
  assert_text: Invoice
