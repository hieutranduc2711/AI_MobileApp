id: SYNC-02904
title: 'Create Invoice: Create Invoice rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Invoice
action: Create Invoice
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
