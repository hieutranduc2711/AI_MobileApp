  text: Open local record.
  delay: 1.0
- desc: Edit field trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check final local.
  action: tap_selector
  text: Check final local.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Verify server.
  action: tap_selector
  text: Verify server.
  delay: 1.0
expected:
