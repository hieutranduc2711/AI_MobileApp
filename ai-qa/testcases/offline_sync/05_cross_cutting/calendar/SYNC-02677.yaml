id: SYNC-02677
title: 'Move Job: Move Job pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Calendar
action: Move Job
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Calendar > Job
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Move Job; prerequisite
  cho Job calendar item đã sync khi cần.
test_data: Valid representative data
steps:
- desc: Switch Branch A.
  action: tap_selector
  text: Switch Branch A.
  delay: 1.0
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Move Job.
  action: tap_selector
  text: Move Job
  delay: 1.0
- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Move Job không làm app crash/mất dữ liệu.
  assert_text: Calendar
- desc: Local/UI của Job calendar item phản ánh đúng business result.
  assert_text: Calendar
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Calendar
- desc: Không duplicate logical operation.
  assert_text: Calendar
- desc: A mutation không send với B context.
  assert_text: Calendar
- desc: B không thấy A optimistic data.
  assert_text: Calendar
- desc: Converge ở A only.
  assert_text: Calendar
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
