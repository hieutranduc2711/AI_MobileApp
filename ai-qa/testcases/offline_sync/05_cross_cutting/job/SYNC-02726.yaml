id: SYNC-02726
title: 'Check in Job: Check in Job pending ở Branch A rồi switch B'
sheet: 05_Cross_Cutting
module: Job
action: Check in Job
priority: P0
flow_phase: Pending Branch Switch
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Check In
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Check in Job;
  prerequisite cho Job đã sync khi cần.
test_data: Valid representative data
steps:
- desc: Switch Branch A.
  action: tap_selector
  text: Switch Branch A.
  delay: 1.0
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Check in Job.
  action: tap_selector
  text: Check in Job
  delay: 1.0
- desc: Switch Branch B trước sync nếu UI cho phép.
  action: tap_selector
  text: Switch Branch B trước sync nếu
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect B.
  action: tap_selector
  text: Inspect B.
  delay: 1.0
- desc: Switch A.
  action: tap_selector
  text: Switch A.
  delay: 1.0
- desc: Verify.
  action: tap_selector
  text: Verify.
  delay: 1.0
expected:
- desc: Check in Job không làm app crash/mất dữ liệu.
  assert_text: Job
- desc: Local/UI của Job phản ánh đúng business result.
  assert_text: Job
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Job
- desc: Không duplicate logical operation.
  assert_text: Job
- desc: A mutation không send với B context.
  assert_text: Job
- desc: B không thấy A optimistic data.
  assert_text: Job
- desc: Converge ở A only.
  assert_text: Job
