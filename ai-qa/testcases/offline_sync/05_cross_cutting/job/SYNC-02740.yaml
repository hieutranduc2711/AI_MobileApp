id: SYNC-02740
title: 'Stop Time Tracking: 2 devices conflict on Stop Time Tracking'
sheet: 05_Cross_Cutting
module: Job
action: Stop Time Tracking
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Time Tracking > Stop
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Stop Time Tracking;
  prerequisite cho Worklog đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Stop Time Tracking
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Stop Time Tracking
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Stop Time Tracking không làm app crash/mất dữ liệu.
  assert_text: Job
- desc: Local/UI của Worklog phản ánh đúng business result.
  assert_text: Job
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Job
- desc: Không duplicate logical operation.
  assert_text: Job
- desc: No structural corruption/duplicate.
  assert_text: Job
- desc: Outcome reproducible.
  assert_text: Job
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Job
