id: SYNC-02715
title: 'Create Job: Create Job rồi delete trước sync'
sheet: 05_Cross_Cutting
module: Job
action: Create Job
priority: P0
flow_phase: Create→Delete Before Sync
direction: CROSS-CUTTING
app_path: GD Mobile > Add Job
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Create Job;
  prerequisite cho Job đã sync khi cần.
test_data: Create then delete
steps:
- desc: Go offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Thực hiện Create Job.
  action: tap_selector
  text: Create Job
  delay: 1.0
- desc: Delete local record trước reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Check local list.
  action: tap_selector
  text: Check local list.
  delay: 1.0
- desc: Reconnect.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/outbox.
  action: tap_selector
  text: Inspect server/outbox.
  delay: 1.0
expected:
- desc: Create Job không làm app crash/mất dữ liệu.
  assert_text: Job
- desc: Local/UI của Job phản ánh đúng business result.
  assert_text: Job
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Job
- desc: Không duplicate logical operation.
  assert_text: Job
- desc: Không orphan/ghost record ngoài ý muốn.
  assert_text: Job
- desc: Create/delete collapse/order an toàn.
  assert_text: Job
- desc: No pending forever.
  assert_text: Job
