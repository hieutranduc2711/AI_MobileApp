id: SYNC-02842
title: 'Edit Job Material: 2 devices conflict on Edit Job Material'
sheet: 05_Cross_Cutting
module: Material
action: Edit Job Material
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Job > Materials > Edit
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Edit Job Material;
  prerequisite cho Material đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Edit Job Material
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Edit Job Material
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Edit Job Material không làm app crash/mất dữ liệu.
  assert_text: Material
- desc: Local/UI của Material phản ánh đúng business result.
  assert_text: Material
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Material
- desc: Không duplicate logical operation.
  assert_text: Material
- desc: No structural corruption/duplicate.
  assert_text: Material
- desc: Outcome reproducible.
  assert_text: Material
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Material
