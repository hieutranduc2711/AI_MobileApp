id: SYNC-02987
title: 'Delete Customer: 2 devices conflict on Delete Customer'
sheet: 05_Cross_Cutting
module: Customer
action: Delete Customer
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Customer > Delete
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Delete Customer;
