id: SYNC-03008
title: 'Edit Location: 2 devices conflict on Edit Location'
sheet: 05_Cross_Cutting
module: Location
action: Edit Location
priority: P0
flow_phase: Multi-device Conflict
direction: CROSS-CUTTING
app_path: GD Mobile > Customer > Locations > Edit
preconditions: Đăng nhập GD Mobile đúng account/branch; user có quyền Edit Location;
  prerequisite cho Customer Location đã sync khi cần. Có Device A/B cùng initial record.
test_data: Two devices
steps:
- desc: Sync same entity lên A/B.
  action: tap_selector
  text: Sync same entity lên A/B.
  delay: 1.0
- desc: Cả hai offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: A thực hiện value/action A.
  action: tap_selector
  text: Edit Location
  delay: 1.0
- desc: B thực hiện conflicting value/action B.
  action: tap_selector
  text: Edit Location
  delay: 1.0
- desc: Reconnect B rồi A.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Inspect server/A/B.
  action: tap_selector
  text: Inspect server/A/B.
  delay: 1.0
- desc: Lặp reconnect order ngược.
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Edit Location không làm app crash/mất dữ liệu.
  assert_text: Location
- desc: Local/UI của Customer Location phản ánh đúng business result.
  assert_text: Location
- desc: Không ghi/send mutation sai account/branch.
  assert_text: Location
- desc: Không duplicate logical operation.
  assert_text: Location
- desc: No structural corruption/duplicate.
  assert_text: Location
- desc: Outcome reproducible.
  assert_text: Location
- desc: Không tự giả định winner; capture actual policy.
  assert_text: Location
