id: SYNC-03318
title: 'Connectivity mode: Online state → no internet'
sheet: 01_Online_to_Offline
module: Core
action: Connectivity mode
priority: P0
flow_phase: CORE-O2F
direction: ONLINE → OFFLINE
app_path: GD Mobile > Any supported module
preconditions: Authenticated; representative cached data.
test_data: Core transition
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Thực hiện thao tác Connectivity mode trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
expected:
- desc: Thao tác Connectivity mode duy trì trạng thái ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
