id: SYNC-00213
title: 'Edit Device Type: Hoàn tất Edit Device Type online → authoritative state về
  local → chuyển Offline'
sheet: 01_Online_to_Offline
module: Device Meta
action: Edit Device Type
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Device Settings > Device Type
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Device Type; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Device Settings > Device Type.
test_data: Valid action
steps:
- desc: Thực hiện action hoàn toàn khi Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Chờ backend xử lý xong và authoritative state sync về local.
  action: back
  delay: 1.0
- desc: Refresh/reopen để xác nhận giá trị mới.
  action: tap_selector
  text: Refresh/reopen để xác nhận giá
  delay: 1.0
- desc: Tắt toàn bộ network.
  action: tap_selector
  text: Tắt toàn bộ network.
  delay: 1.0
- desc: Force close/reopen app khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Mở lại entity/list.
  action: tap_selector
  text: Mở lại entity/list.
  delay: 1.0
expected:
- desc: Latest authoritative state đã được persist local trước khi mất mạng.
  assert_text: Device Meta
- desc: Sau restart Offline vẫn thấy đúng state mới.
  assert_text: Device Meta
- desc: Không quay lại stale value cũ.
  assert_text: Device Meta
- desc: Không cần remote API để đọc state đã cache.
  assert_text: Device Meta
source_tickets: RN-5606, RN-5607
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5606

  https://gorilladesk1.atlassian.net/browse/RN-5607'
risk: Online→local cache durability
notes: ''
