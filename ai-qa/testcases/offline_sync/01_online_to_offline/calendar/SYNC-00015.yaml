id: SYNC-00015
title: 'Edit Custom Event: Hoàn tất Edit Custom Event online → authoritative state về local → chuyển Offline'
sheet: 01_Online_to_Offline
module: Calendar
action: Edit Custom Event
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Event Detail
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Giữ mạng online để tạo fixture riêng cho testcase
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Đưa app về Calendar Home và xác nhận màn hình lịch
  action: macro
  value: ensure_calendar_home
- desc: Tạo fixture bằng menu xuất hiện sau khi chọn một time range trên calendar
  action: macro
  value: calendar_create_item
  args:
    kind: custom_event
    marker: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE
    start_time: 1PM
    day_offset: 1
    duration_minutes: 30
    verify_live_refresh: false
- desc: Reload chỉ để nạp fixture trước thao tác đang test; không reload sau mutation
  action: macro
  value: restart_app_and_wait
  args:
    marker: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE
- desc: Edit khi online; Save và assert live Calendar refresh trước khi offline
  action: macro
  value: calendar_prepare_edit
  args:
    marker: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE
    kind: custom_event
    suffix: _EDITED
- desc: Commit edit online và chờ updated marker hiển thị ngay
  action: macro
  value: calendar_commit_edit
  args:
    marker: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE
    suffix: _EDITED
    verify_live_refresh: true
- desc: Chuyển offline sau online update
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Background/foreground để đọc lại cache mà không force-stop
  action: background_app
  value: '2'
  delay: 0.5
- desc: Xác nhận updated marker còn sau khi offline
  action: macro
  value: assert_visible
  args:
    text: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE_EDITED
    timeout: 8
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Sau Save marker được đổi đúng thành giá trị đã edit.
  action: assert_text
  value: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE_EDITED
- desc: Calendar hiển thị updated item ngay khi app còn foreground.
  action: assert_text
  value: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE_EDITED
- desc: Updated item còn sau background/foreground khi offline.
  action: assert_text
  value: AIQA_SYNC-00015_{{DYNAMIC_NONCE}}_CE_EDITED
source_tickets: RN-5573
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5573
risk: Offline edit durability / real-time refresh
notes: 'Fixture được tạo online bằng flow đã quan sát, rồi app chỉ reload trước thao tác edit để nạp fixture; không reload
  sau mutation đang test. Edit Custom Event/Time Off đã xác nhận bằng detail → pencil/Edit → form → Save; marker được append
  để không phụ thuộc thay thế text cũ. Pixel 5 từng không render mutation ngay sau Save; expected live refresh cố ý để bắt
  lỗi, không dùng restart để tạo false pass.'
