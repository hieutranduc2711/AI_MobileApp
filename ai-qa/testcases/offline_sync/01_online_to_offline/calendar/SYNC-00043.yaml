id: SYNC-00043
title: 'Resize Job: Thực hiện Resize Job online → mất mạng khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Calendar
action: Resize Job
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Job
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm 
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00043_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Giữ mạng online; không bắt đầu mutation khi Job resize path chưa được xác minh
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Đưa app về Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: 'Fail closed: không đoán edit entry/edge handle của Job'
  action: macro
  value: require_verified_job_resize_path
- desc: Phase network fault cũng cần injector đồng bộ request lifecycle
  action: macro
  value: require_transport_fault_injection
  args:
    barrier: in_flight
expected:
- desc: Không được PASS; giữ BLOCKED cho tới khi có đường resize Job đã được quan sát và xác nhận duration thay đổi.
  action: assert_text
  value: Job resize path verified
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: BLOCKED — Job detail edit route and successful lower-edge resize have not been verified
notes: 'Pixel 5: Job Details không expose pencil/Edit trong menu đã quan sát; thử kéo mép card trước đó không chứng minh duration
  đổi. Cần xác nhận đúng UI path trước khi biến thành step executable.'
