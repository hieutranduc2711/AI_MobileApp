id: SYNC-00027
title: 'Move Job (recurring): Offline trước khi confirm → Move this job only'
sheet: 01_Online_to_Offline
module: Calendar
action: Move Job
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Job
preconditions: 'Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm Update/banner.
  Cần fixture Job recurring xuất hiện Today, duy nhất theo customer #### test Customer; weekly và không có occurrence trước
  còn incomplete.'
test_data: 'Recurring Job fixture for Today: customer #### test Customer, service #001 test template, Weekly, 3 occurrences;
  selected occurrence at 12:30 PM; test scope Move only; chỉ một card khớp.'
steps:
- desc: Đảm bảo mạng online trước khi tìm Job fixture
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Về Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: Xác nhận fixture Job duy nhất có mặt; không tạo thêm Job ngẫu nhiên
  action: macro
  value: assert_visible
  args:
    text: '#### test Customer'
    timeout: 8
- desc: Xác nhận và cache hai occurrence tuần kế tiếp trước khi chuyển offline
  action: macro
  value: calendar_cache_recurring_occurrences
  args:
    marker: '#### test Customer'
    expected_time: '12:30'
    future_occurrences: 2
- desc: Long-press/drag recurring Job; dừng ở popup trước khi chọn scope
  action: macro
  value: calendar_begin_move
  args:
    marker: '#### test Customer'
    delta_minutes: 15
    recurrence_scope: only
- desc: Ngắt mạng khi popup xác nhận recurring đang mở, trước khi chọn Move only
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận popup Move only vẫn đang mở trước khi chọn scope
  action: assert_text
  value: Move this job only
- desc: Chọn Move this job only; các occurrence phía sau phải giữ lịch cũ
  action: macro
  value: calendar_confirm_move
  args:
    recurrence_scope: only
    expected_time: '12:45'
    marker: '#### test Customer'
    future_expected_time: '12:30'
    future_occurrences: 2
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Occurrence phía sau giữ đúng giờ cũ sau khi chọn Move only.
  action: assert_text
  value: '12:30'
- desc: Fixture recurring vẫn hiển thị ở occurrence tương lai.
  action: assert_text
  value: '#### test Customer'
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Recurring scope confirmation / offline commit
notes: 'Pixel 5 gặp popup “There is an incomplete job in the past: Saturday Jul 25th, 2026”; phải resolve/cancel occurrence
  cũ trước khi chạy fixture recurring.'
