id: SYNC-00029
title: 'Move Job (recurring): Cut sau ACK trước downlink khi Move all (fault hook required)'
sheet: 01_Online_to_Offline
module: Calendar
action: Move Job
priority: P0
flow_phase: O2F-04 Drop after ACK before downlink
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Job
preconditions: 'Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm Update/banner.
  Cần fixture Job riêng, duy nhất theo customer #### test Customer; recurring fixture phải weekly và không có occurrence trước
  còn incomplete.'
test_data: 'Recurring Job fixture: customer #### test Customer, service #001 test template, Weekly, 3 occurrences; test scope
  Move all; chỉ một card khớp.'
steps:
- desc: Đảm bảo mạng online trước khi tìm Job fixture
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Về Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: Xác nhận fixture Job duy nhất có mặt; không tạo thêm Job ngẫu nhiên
  action: macro
  value: assert_visible
  args:
    text: '#### test Customer'
    timeout: 8
- desc: Bảo đảm mạng online trước khi kiểm tra điều kiện hạ tầng
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Xác nhận Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: 'Fail closed: yêu cầu bộ cắt mạng có barrier đồng bộ đúng phase'
  action: macro
  value: require_transport_fault_injection
  args:
    barrier: move_server_ack_before_downlink
- desc: Khôi phục mạng nếu testcase bị dừng ở phase bị block
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Kết quả phải BLOCKED cho tới khi cắt mạng đồng bộ đúng request/ACK; không suy diễn từ weak_network.
  action: assert_text
  value: network fault injector
source_tickets: RN-5572, RN-5587, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: BLOCKED — deterministic network fault injector chưa có
notes: 'Recurring move có popup đã quan sát: “Move this job only” và “Move this job and all recurring”. Pixel 5 gặp popup
  “There is an incomplete job in the past: Saturday Jul 25th, 2026”; phải resolve/cancel occurrence cũ trước khi chạy fixture
  recurring.'
