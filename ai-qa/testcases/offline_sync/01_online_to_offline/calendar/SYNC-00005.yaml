id: SYNC-00005
title: 'Add Custom Event: Hoàn tất Add Custom Event online → authoritative state về local → chuyển Offline'
sheet: 01_Online_to_Offline
module: Calendar
action: Add Custom Event
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Add Event
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Bật Wi-Fi và mobile data để nạp Calendar trước khi đổi trạng thái mạng
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Mở Calendar Home và xác nhận Today/Jobs/Total
  action: macro
  value: ensure_calendar_home
- desc: Chọn time range trên lưới Calendar, chọn đúng loại form và nhập trường bắt buộc
  action: macro
  value: calendar_prepare_create_item
  args:
    kind: custom_event
    marker: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
    start_time: 1PM
    day_offset: 1
    duration_minutes: 30
- desc: Kiểm tra form giữ đúng start time của time range đã chọn (Pixel 5 từng hiện default 12:30 PM thay vì 1:00 PM)
  action: assert_text
  value: 1:00 PM
- desc: Save một lần và đợi item xuất hiện trên Calendar ngay, không restart app
  action: macro
  value: calendar_commit_create_item
  args:
    marker: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
    verify_live_refresh: true
    expected_start_time: "1:00 PM"
- desc: Sau khi item đã render khi online, chuyển offline để kiểm tra cache local
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Đưa app xuống nền rồi mở lại foreground để kiểm tra cache, không force-stop
  action: background_app
  value: '2'
  delay: 0.5
- desc: Xác nhận item vẫn hiển thị sau background/foreground offline
  action: macro
  value: assert_visible
  args:
    text: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
    timeout: 8
- desc: Khôi phục kết nối mạng sau khi đã chụp/assert trạng thái offline
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: 'Form lưu hợp lệ: Custom Event dùng Event Name; Time Off dùng Reason For Time Off.'
  action: assert_text
  value: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
- desc: Calendar render item với marker ngay sau Save mà không restart app.
  action: assert_text
  value: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
- desc: Start time khớp time range đã chọn (expected 1:00 PM).
  action: assert_text
  value: 1:00 PM
- desc: Item vẫn có trong Calendar sau khi chuyển offline và background/foreground.
  action: assert_text
  value: AIQA_SYNC-00005_{{DYNAMIC_NONCE}}_CE
source_tickets: RN-5573
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5573
risk: Calendar range prefill / local persistence / real-time refresh
notes: 'Bằng chứng Pixel 5: contextual menu có New Job, Add Time Off, Add Custom Event; Time Off cần Reason For Time Off;
  Custom Event cần Event Name. Pixel 5 từng không render item mới ngay sau Save cho tới khi force-stop/relaunch. Test cố ý
  assert live refresh trước mọi restart để không che bug. O2F-05 không có tín hiệu ACK server riêng trong runner; bằng chứng
  là item render khi online rồi còn sau background/foreground offline.'
