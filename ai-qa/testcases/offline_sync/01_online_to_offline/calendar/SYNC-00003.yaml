id: SYNC-00003
title: 'Add Custom Event: Thực hiện Add Custom Event online → mất mạng khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Calendar
action: Add Custom Event
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Add Event
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00003_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Bật Wi-Fi và mobile data để nạp Calendar trước khi đổi trạng thái mạng
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Mở Calendar Home và xác nhận Today/Jobs/Total
  action: macro
  value: ensure_calendar_home
- desc: Bảo đảm mạng online trước khi kiểm tra điều kiện hạ tầng
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Xác nhận Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: 'Fail closed: yêu cầu bộ cắt mạng có barrier đồng bộ đúng phase'
  action: macro
  value: require_transport_fault_injection
  args:
    barrier: request_in_flight_after_save
- desc: Khôi phục mạng nếu testcase bị dừng ở phase bị block
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Không được báo PASS; phải BLOCKED cho tới khi fault injector có barrier xác nhận đúng request lifecycle.
  action: assert_text
  value: network fault injector
source_tickets: RN-5573
source_urls: https://gorilladesk1.atlassian.net/browse/RN-5573
risk: BLOCKED — runner chưa có network fault injector đồng bộ request/ACK
notes: 'Không thay bằng weak_network: flapping không chứng minh cắt đúng khi request đang in-flight hoặc sau ACK trước downlink.'
