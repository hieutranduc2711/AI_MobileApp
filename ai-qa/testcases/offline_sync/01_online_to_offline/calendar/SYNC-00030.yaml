id: SYNC-00030
title: 'Move Job (recurring): Move this job and all recurring → offline cache'
sheet: 01_Online_to_Offline
module: Calendar
action: Move Job
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Job
preconditions: 'Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm Update/banner.
  Cần fixture Job recurring xuất hiện Today, duy nhất theo customer #### test Customer; weekly và không có occurrence trước
  còn incomplete.'
test_data: 'Recurring Job fixture: customer #### test Customer, service #001 test template, Weekly, 3 occurrences, selected
  occurrence at 12:30 PM; test scope Move all; chỉ một card khớp.'
steps:
- desc: Đảm bảo mạng online trước khi tìm Job fixture
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Về Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: Xác nhận fixture Job duy nhất có mặt; không tạo thêm Job ngẫu nhiên
  action: macro
  value: assert_visible
  args:
    text: '#### test Customer'
    timeout: 8
- desc: Xác nhận occurrence được chọn đang ở 12:30 PM trước khi move
  action: assert_text
  value: '12:30'
- desc: Move recurring Job online; xác nhận popup trước khi chọn Move all
  action: macro
  value: calendar_begin_move
  args:
    marker: '#### test Customer'
    delta_minutes: 15
    recurrence_scope: all
- desc: Xác nhận popup Move all đang mở trước khi chọn scope
  action: assert_text
  value: Move this job and all recurring
- desc: Chọn Move this job and all recurring
  action: macro
  value: calendar_confirm_move
  args:
    recurrence_scope: all
    expected_time: '12:45'
    marker: '#### test Customer'
    future_expected_time: '12:45'
    future_occurrences: 2
- desc: Sau khi online move đã render, chuyển offline
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Background/foreground và kiểm tra fixture vẫn còn khi offline
  action: background_app
  value: '2'
  delay: 0.5
- desc: Xác nhận recurring Job vẫn hiện offline
  action: macro
  value: assert_visible
  args:
    text: '#### test Customer'
    timeout: 8
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Occurrence đã chọn và toàn bộ occurrence sau đó đổi theo; không được chỉ move một occurrence.
  action: assert_text
  value: '12:45'
- desc: Job vẫn hiển thị sau khi chuyển offline.
  action: assert_text
  value: '#### test Customer'
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Move all recurrence propagation / offline cache
notes: 'Pixel 5 gặp popup “There is an incomplete job in the past: Saturday Jul 25th, 2026”; phải resolve/cancel occurrence
  cũ trước khi chạy fixture recurring.'
