id: SYNC-00026
title: 'Move Job (one-time): Load cache online → offline → move đúng occurrence'
sheet: 01_Online_to_Offline
module: Calendar
action: Move Job
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Job
preconditions: 'Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm Update/banner.
  Cần fixture Job one-time của Today, duy nhất theo customer #### test Customer; không phải recurring và không có card trùng.'
test_data: 'One-time Job fixture for Today: customer #### test Customer, service #001 test template, start 12:30 PM; chỉ một card khớp.'
steps:
- desc: Đảm bảo mạng online trước khi tìm Job fixture
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Về Calendar Home
  action: macro
  value: ensure_calendar_home
- desc: Xác nhận fixture Job duy nhất có mặt; không tạo thêm Job ngẫu nhiên
  action: macro
  value: assert_visible
  args:
    text: '#### test Customer'
    timeout: 8
- desc: Xác nhận Job one-time đang ở 12:30 PM trước khi move
  action: assert_text
  value: '12:30 PM'
- desc: Ngắt mạng sau Calendar/Job đã load, trước gesture move
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Long-press/drag Job one-time của Today; app phải mở popup scope đã được quan sát
  action: macro
  value: calendar_begin_move
  args:
    marker: '#### test Customer'
    delta_minutes: 15
    recurrence_scope: only
- desc: Chọn Move this job only; không có occurrence tương lai nào được move
  action: assert_text
  value: Move this job only
- desc: Xác nhận Move only đã đổi đúng giờ của Job hôm nay
  action: macro
  value: calendar_confirm_move
  args:
    recurrence_scope: only
    expected_time: '12:45'
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: One-time Job của Today đổi đúng từ 12:30 PM sang 12:45 PM sau khi chọn Move only.
  action: assert_text
  value: 12:45 PM
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Move scope correctness / local cache
notes: 'Anh Hiếu xác nhận popup scope xuất hiện khi move recurring Job hoặc Job của Today. Case này kiểm tra Job one-time
  của Today và chọn Move only. Pixel 5 cũng từng báo incomplete Job ở Saturday Jul 25th, 2026; cần resolve/cancel occurrence
  cũ trước khi chạy fixture.'
