id: SYNC-00022
title: 'Move Custom Event: mở item online → mất mạng ngay trước direct calendar drag (không có Save/Confirm)'
sheet: 01_Online_to_Offline
module: Calendar
action: Move Custom Event
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Custom Event
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Giữ mạng online để tạo fixture riêng cho testcase
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Đưa app về Calendar Home và xác nhận màn hình lịch
  action: macro
  value: ensure_calendar_home
- desc: Tạo fixture bằng menu xuất hiện sau khi chọn một time range trên calendar
  action: macro
  value: calendar_create_item
  args:
    kind: custom_event
    marker: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
    start_time: 1PM
    day_offset: 1
    duration_minutes: 30
    verify_live_refresh: false
- desc: Reload chỉ để nạp fixture trước thao tác đang test; không reload sau mutation
  action: macro
  value: restart_app_and_wait
  args:
    marker: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
- desc: Mở item detail khi online để xác nhận đúng fixture trước khi chuyển offline
  action: tap_selector
  text: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
- desc: Xác nhận đang ở detail của Custom Event trước khi quay lại Calendar
  action: assert_text
  value: Custom Event
- desc: Ngắt mạng trước gesture trực tiếp trên Calendar; Custom Event/Time Off không có popup Save/Confirm khi drag
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Quay lại Calendar, không Save detail
  action: back
- desc: Drag item xuống đúng một nấc 15 phút; xác nhận position đổi ngay
  action: macro
  value: calendar_begin_move
  args:
    marker: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
    delta_minutes: 15
    recurrence_scope: none
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Calendar card đổi vị trí đúng một nấc 15 phút và giữ nguyên marker.
  action: assert_text
  value: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
- desc: Thay đổi được render trên Calendar ngay, không cần reload app.
  action: assert_text
  value: AIQA_SYNC-00022_{{DYNAMIC_NONCE}}_CE
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Calendar drag commit / offline persistence / real-time render
notes: 'Move Custom Event/Time Off được thao tác bằng long-press/drag trực tiếp trên card; Time Off drag đã được xác nhận
  đổi 15 phút trên Pixel 5. Với Custom Event/Time Off không xuất hiện popup Save/Confirm sau drag; O2F-02 được đổi title để
  mô tả mất mạng ngay trước gesture, không giả vờ có bước xác nhận. Fixture setup được reload trước mutation; tuyệt đối không
  reload sau move để không che lỗi live refresh.'
