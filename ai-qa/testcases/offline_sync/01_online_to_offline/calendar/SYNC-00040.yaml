id: SYNC-00040
title: 'Resize Custom Event: Hoàn tất Resize Custom Event online → authoritative state về local → chuyển Offline'
sheet: 01_Online_to_Offline
module: Calendar
action: Resize Custom Event
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Calendar > Custom Event
preconditions: Đăng nhập test account có quyền Calendar và đúng branch; mạng hoạt động trước khi bắt đầu. Không bấm 
  Update/banner.
test_data: 'Unique per-run marker: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE; dùng ngày mai theo ngày của thiết bị; dữ liệu test
  không dùng banner.'
steps:
- desc: Giữ mạng online để tạo fixture riêng cho testcase
  action: set_network
  value: 'true'
  delay: 1.5
- desc: Đưa app về Calendar Home và xác nhận màn hình lịch
  action: macro
  value: ensure_calendar_home
- desc: Tạo fixture bằng menu xuất hiện sau khi chọn một time range trên calendar
  action: macro
  value: calendar_create_item
  args:
    kind: custom_event
    marker: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
    start_time: 1PM
    day_offset: 1
    duration_minutes: 30
    verify_live_refresh: false
- desc: Reload chỉ để nạp fixture trước thao tác đang test; không reload sau mutation
  action: macro
  value: restart_app_and_wait
  args:
    marker: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
- desc: Đổi Time Length online và Save; đợi UI cập nhật trước khi offline
  action: macro
  value: calendar_prepare_resize
  args:
    marker: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
    kind: custom_event
    current_minutes: 45
    duration_minutes: 50
- desc: Commit resize online
  action: macro
  value: calendar_commit_resize
  args:
    marker: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
    duration_minutes: 50
    verify_live_refresh: true
- desc: Sau khi online resize đã render, chuyển offline
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Background/foreground để kiểm tra duration còn trong local cache, không force-stop
  action: background_app
  value: '2'
  delay: 0.5
- desc: Xác nhận marker vẫn còn sau khi offline
  action: macro
  value: assert_visible
  args:
    text: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
    timeout: 8
- desc: Khôi phục mạng sau assertion
  action: set_network
  value: 'true'
  delay: 1.5
expected:
- desc: Duration đổi từ 45 lên 50 phút, thời điểm bắt đầu không đổi.
  action: assert_text
  value: 50 minutes
- desc: Calendar render duration mới ngay sau Save, không restart app.
  action: assert_text
  value: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
- desc: Item đã resize còn hiển thị sau khi offline/background/foreground.
  action: assert_text
  value: AIQA_SYNC-00040_{{DYNAMIC_NONCE}}_CE
source_tickets: RN-5572, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5572

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Time Length edit / local cache / real-time render
notes: 'Pixel 5 xác nhận edit detail có field duration mở sheet “Time Length”; wheel chọn được trực tiếp giá trị phút tăng
  5 (45 → 50 cho Custom Event, 30 → 35 cho Time Off). Đây là route resize được xác minh và dùng cho testcase; không dùng tọa
  độ mép card chưa đủ ổn định. Fixture app reload chỉ xảy ra trước mutation. Không reload sau Save vì Pixel 5 từng không refresh
  card real-time.'
