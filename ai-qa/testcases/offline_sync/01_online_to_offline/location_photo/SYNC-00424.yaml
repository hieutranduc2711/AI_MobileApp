id: SYNC-00424
title: 'Edit Location Photo: Thực hiện Edit Location Photo online → mất mạng khi request
  đang in-flight'
sheet: 01_Online_to_Offline
module: Location Photo
action: Edit Location Photo
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Customer > Location > Photos > Edit
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Location Photo; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Customer > Location > Photos > Edit.
test_data: Valid action; proxy/network can cut immediately
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Drawer Menu từ Calendar
  action: tap_selector
  content_desc: Open navigation drawer
  value: 0.06,0.07
- desc: Chọn mục Customers trong danh mục
  action: tap_selector
  text: Customers
- desc: Chọn khách hàng trong danh sách để xem chi tiết
  action: tap_selector
  resource_id: customer-avatar
  index: 0
expected:
- desc: Danh sách khách hàng và lịch sử làm việc hiển thị từ SQLite local cache
  assert_text: Customer
- desc: Dữ liệu vị trí và liên hệ được nạp đầy đủ khi offline
  assert_text: All Locations
source_tickets: RN-5585, RN-5525
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5585

  https://gorilladesk1.atlassian.net/browse/RN-5525'
risk: Unknown request outcome/idempotency
notes: ''
