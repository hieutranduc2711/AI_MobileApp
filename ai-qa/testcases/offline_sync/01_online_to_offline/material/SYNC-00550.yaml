id: SYNC-00550
title: 'Edit Job Material: Load dữ liệu online → mất mạng → vẫn thực hiện Edit Job
  Material'
sheet: 01_Online_to_Offline
module: Material
action: Edit Job Material
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Materials > Edit
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Job Material; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Materials > Edit.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Edit Job Material.
  action: tap_selector
  text: Edit Job Material
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Dữ liệu đã có khi online vẫn tồn tại sau khi mất mạng.
  assert_text: Material
- desc: Edit Job Material vẫn thực hiện được theo offline scope.
  assert_text: Material
- desc: Không cần manual Offline toggle.
  assert_text: Material
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Material
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Material
