id: SYNC-00548
title: 'Edit Device Material: Edit Device Material: server/queue ACK → mất mạng trước
  authoritative downlink'
sheet: 01_Online_to_Offline
module: Material
action: Edit Device Material
priority: P0
flow_phase: O2F-04 Drop after ACK before downlink
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Device > Materials > Edit
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Device Material;
  prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Job > Device > Materials
  > Edit.
test_data: Valid mutation
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Materials trong Job Details
  action: tap_selector
  text: Materials
- desc: Thêm vật tư / hóa chất sử dụng trong công việc
  action: macro
  value: add_material
expected:
- desc: Vật tư được ghi nhận định mức và trừ kho cục bộ
  assert_text: Materials
source_tickets: RN-5591, RN-5545, RN-5587
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5591

  https://gorilladesk1.atlassian.net/browse/RN-5545

  https://gorilladesk1.atlassian.net/browse/RN-5587'
risk: Early patch removal/snap-back
notes: ''
