id: SYNC-00551
title: 'Edit Job Material: Bắt đầu Edit Job Material online → mất mạng ngay trước
  Save/Confirm'
sheet: 01_Online_to_Offline
module: Material
action: Edit Job Material
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Materials > Edit
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Job Material; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Materials > Edit.
test_data: Valid edited values
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Materials trong Job Details
  action: tap_selector
  text: Materials
- desc: Thêm vật tư / hóa chất sử dụng trong công việc
  action: macro
  value: add_material
expected:
- desc: Vật tư được ghi nhận định mức và trừ kho cục bộ
  assert_text: Materials
source_tickets: RN-5568, RN-5545
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5568

  https://gorilladesk1.atlassian.net/browse/RN-5545'
risk: Data loss at transition
notes: ''
