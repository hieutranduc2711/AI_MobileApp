  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Invoice trong Job Details
  action: tap_selector
  text: Invoice
expected:
- desc: Hóa đơn được lưu cục bộ và hiển thị thông tin thanh toán
  assert_text: Invoice
- desc: Số tiền hóa đơn được bảo lưu chính xác
  assert_text: Total
