id: SYNC-00751
title: 'Delete Invoice Visible Image: Load dữ liệu online → mất mạng → vẫn thực hiện
  Delete Invoice Visible Image'
sheet: 01_Online_to_Offline
module: Visible Image
action: Delete Invoice Visible Image
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Invoice > Visible Images > Delete
preconditions: Đăng nhập đúng account/branch; user có quyền Delete Invoice Visible
  Image; prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Invoice >
  Visible Images > Delete.
test_data: Valid representative entity
steps:
