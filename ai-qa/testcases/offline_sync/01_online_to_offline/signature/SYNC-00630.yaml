id: SYNC-00630
title: 'Capture Estimate Customer Signature: Load dữ liệu online → mất mạng → vẫn
  thực hiện Capture Estimate Customer Signature'
sheet: 01_Online_to_Offline
module: Signature
action: Capture Estimate Customer Signature
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Estimate > Signature
preconditions: Đăng nhập đúng account/branch; user có quyền Capture Estimate Customer
  Signature; prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Estimate
  > Signature.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Capture Estimate Customer Signature.
  action: tap_selector
  text: Capture Estimate Customer Signature
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Dữ liệu đã có khi online vẫn tồn tại sau khi mất mạng.
  assert_text: Signature
- desc: Capture Estimate Customer Signature vẫn thực hiện được theo offline scope.
  assert_text: Signature
- desc: Không cần manual Offline toggle.
  assert_text: Signature
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Signature
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Signature
source_tickets: RN-5605, RN-5525
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5605

