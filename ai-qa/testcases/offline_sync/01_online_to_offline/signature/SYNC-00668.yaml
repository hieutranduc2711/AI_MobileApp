id: SYNC-00668
title: 'Capture WO Tech Signature: Thực hiện Capture WO Tech Signature online → mất
  mạng khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Signature
action: Capture WO Tech Signature
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Work Order > Signature
preconditions: Đăng nhập đúng account/branch; user có quyền Capture WO Tech Signature;
  prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Work Order > Signature.
test_data: Valid action; proxy/network can cut immediately
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Signatures trong Job Details
  action: tap_selector
  text: Signatures
- desc: Thực hiện ký xác nhận (Tech Signature)
  action: macro
  value: take_signature
  args:
    target: tech
expected:
- desc: Chữ ký số được mã hóa và lưu vào hồ sơ Job offline
  assert_text: Signatures
- desc: Chữ ký duy trì nguyên vẹn sau khi mất mạng
  assert_text: Save
source_tickets: RN-5605, RN-5525
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5605

  https://gorilladesk1.atlassian.net/browse/RN-5525'
risk: Unknown request outcome/idempotency
notes: ''
