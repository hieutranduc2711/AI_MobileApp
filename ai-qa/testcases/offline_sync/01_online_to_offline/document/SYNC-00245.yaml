id: SYNC-00245
title: 'Reset Document: Bắt đầu Reset Document online → mất mạng ngay trước Save/Confirm'
sheet: 01_Online_to_Offline
module: Document
action: Reset Document
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Document > Reset
preconditions: Đăng nhập đúng account/branch; user có quyền Reset Document; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Document > Reset.
test_data: Valid edited values
steps:
- desc: Bật network ổn định và mở flow.
  action: tap_selector
  text: Bật network ổn định và mở flow
  delay: 1.0
- desc: Bắt đầu Reset Document khi đang Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Điền/chọn dữ liệu cần thiết nhưng chưa Save/Confirm.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Ngay trước Save/Confirm, tắt toàn bộ network.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Chờ indicator chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Tiếp tục thao tác nếu còn field chưa hoàn thành.
  action: tap_selector
  text: Tiếp tục thao tác nếu còn fiel
  delay: 1.0
- desc: Nhấn Save/Confirm.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Navigate ra/vào lại entity trong khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Draft/input không bị reset chỉ vì network đổi Online → Offline.
  assert_text: Document
- desc: Save chuyển sang offline-safe flow/outbox nếu action được offline support.
  assert_text: Document
- desc: Local UI phản ánh đúng result.
  assert_text: Document
- desc: Không network error làm mất dữ liệu người dùng vừa nhập.
  assert_text: Document
source_tickets: RN-5577
