id: SYNC-00231
title: 'Create Job Document: Create Job Document: mất mạng giữa upload'
sheet: 01_Online_to_Offline
module: Document
action: Create Job Document
priority: P0
flow_phase: O2F-06 Upload interrupted
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Documents > Add
preconditions: Đăng nhập đúng account/branch; user có quyền Create Job Document; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Documents > Add.
test_data: Valid photo/file/signature/document
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Đưa ứng dụng xuống Background 3s rồi khôi phục foreground
  action: background_app
  value: '3.0'
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Attach a Photo trong Job Details
  action: tap_selector
  text: Attach a Photo
expected:
- desc: Mục đính kèm ảnh sẵn sàng để xếp hàng chờ sync
  assert_text: Attach a Photo
