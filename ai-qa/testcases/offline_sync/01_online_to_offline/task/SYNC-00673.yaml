id: SYNC-00673
title: 'Change Task status: Bắt đầu Change Task status online → mất mạng ngay trước
  Save/Confirm'
sheet: 01_Online_to_Offline
module: Task
action: Change Task status
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Tasks > Status
preconditions: Đăng nhập đúng account/branch; user có quyền Change Task status; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Tasks > Status.
test_data: Valid edited values
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Thực hiện thao tác Change Task status trên giao diện GorillaDesk
  action: macro
  value: ensure_calendar_home
expected:
- desc: Thao tác Change Task status duy trì trạng thái ổn định trên giao diện
  assert_text: Today
- desc: Ứng dụng GorillaDesk không bị crash khi xử lý offline
  assert_text: Jobs
