id: SYNC-00161
title: 'Scan Barcode: Thực hiện Scan Barcode online → mất mạng khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Device
action: Scan Barcode
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Devices > Scan
preconditions: Đăng nhập đúng account/branch; user có quyền Scan Barcode; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Devices > Scan.
test_data: Valid action; proxy/network can cut immediately
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Cuộn đến mục quản lý Device / Area
  action: tap_selector
  text: Device
expected:
- desc: Dữ liệu thiết bị / khu vực được ghi nhận vào cơ sở dữ liệu
  assert_text: Device
source_tickets: RN-5591, RN-5614
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5591

  https://gorilladesk1.atlassian.net/browse/RN-5614'
risk: Unknown request outcome/idempotency
notes: ''
