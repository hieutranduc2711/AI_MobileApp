id: SYNC-00144
title: 'Delete/Reassign Device Area: Load dữ liệu online → mất mạng → vẫn thực hiện
  Delete/Reassign Device Area'
sheet: 01_Online_to_Offline
module: Device
action: Delete/Reassign Device Area
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Devices > Areas > Delete/Reassign
preconditions: Đăng nhập đúng account/branch; user có quyền Delete/Reassign Device
  Area; prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Job > Devices
  > Areas > Delete/Reassign.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Delete/Reassign Device Area.
  action: tap_selector
  text: Delete/Reassign Device Area
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Dữ liệu đã có khi online vẫn tồn tại sau khi mất mạng.
  assert_text: Device
- desc: Delete/Reassign Device Area vẫn thực hiện được theo offline scope.
  assert_text: Device
- desc: Không cần manual Offline toggle.
  assert_text: Device
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Device
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Device
