id: SYNC-00138
title: 'Create Device Area: Hoàn tất Create Device Area online → authoritative state
  về local → chuyển Offline'
sheet: 01_Online_to_Offline
module: Device
action: Create Device Area
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Devices > Areas > Add
preconditions: Đăng nhập đúng account/branch; user có quyền Create Device Area; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Devices > Areas > Add.
test_data: Valid action
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Cuộn đến mục quản lý Device / Area
  action: tap_selector
  text: Device
expected:
- desc: Dữ liệu thiết bị / khu vực được ghi nhận vào cơ sở dữ liệu
  assert_text: Device
