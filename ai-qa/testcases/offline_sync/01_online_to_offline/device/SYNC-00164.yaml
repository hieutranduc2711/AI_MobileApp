id: SYNC-00164
title: 'Update Sentricon: Load dữ liệu online → mất mạng → vẫn thực hiện Update Sentricon'
sheet: 01_Online_to_Offline
module: Device
action: Update Sentricon
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Device > Sentricon
preconditions: Đăng nhập đúng account/branch; user có quyền Update Sentricon; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Device > Sentricon.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Update Sentricon.
  action: tap_selector
  text: Update Sentricon
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
