  assert_text: Device
- desc: Update Sentricon vẫn thực hiện được theo offline scope.
  assert_text: Device
- desc: Không cần manual Offline toggle.
  assert_text: Device
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Device
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Device
