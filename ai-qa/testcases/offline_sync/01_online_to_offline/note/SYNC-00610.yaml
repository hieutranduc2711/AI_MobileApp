id: SYNC-00610
title: 'Mark Note recurring: Load dữ liệu online → mất mạng → vẫn thực hiện Mark Note
  recurring'
sheet: 01_Online_to_Offline
module: Note
action: Mark Note recurring
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Notes > Recurring
preconditions: Đăng nhập đúng account/branch; user có quyền Mark Note recurring; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Notes > Recurring.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Mark Note recurring.
  action: tap_selector
  text: Mark Note recurring
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Dữ liệu đã có khi online vẫn tồn tại sau khi mất mạng.
  assert_text: Note
- desc: Mark Note recurring vẫn thực hiện được theo offline scope.
  assert_text: Note
- desc: Không cần manual Offline toggle.
  assert_text: Note
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Note
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Note
