id: SYNC-00586
title: 'Delete Note: Bắt đầu Delete Note online → mất mạng ngay trước Save/Confirm'
sheet: 01_Online_to_Offline
module: Note
action: Delete Note
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Notes > Delete
preconditions: Đăng nhập đúng account/branch; user có quyền Delete Note; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Notes > Delete.
test_data: Valid edited values
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Notes trong Job Details
  action: tap_selector
  text: Notes
expected:
- desc: Ghi chú được lưu vào bộ nhớ cục bộ của Job
  assert_text: Notes
- desc: Top Note hiển thị đầy đủ không bị mất
  assert_text: Top Note
