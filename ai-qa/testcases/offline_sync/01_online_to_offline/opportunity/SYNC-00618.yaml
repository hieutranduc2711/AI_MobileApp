id: SYNC-00618
title: 'Create Opportunity: Create Opportunity: server/queue ACK → mất mạng trước
  authoritative downlink'
sheet: 01_Online_to_Offline
module: Opportunity
action: Create Opportunity
priority: P0
flow_phase: O2F-04 Drop after ACK before downlink
direction: ONLINE → OFFLINE
app_path: GD Mobile > Customer > Opportunities > Add
preconditions: Đăng nhập đúng account/branch; user có quyền Create Opportunity; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Customer > Opportunities > Add.
test_data: Valid mutation
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Customer trong Action Sheet
  action: tap_selector
  content_desc: New Customer
  text: New Customer
  value: 0.5,0.78
- desc: Nhập First Name khách hàng
  action: tap_selector
  text: First Name
- desc: Điền First Name
  action: type_text
  value: Offline
- desc: Nhập Last Name khách hàng
  action: tap_selector
  text: Last Name
- desc: Điền Last Name
  action: type_text
  value: SyncTest
- desc: Nhập Phone khách hàng
  action: tap_selector
  text: Phone
- desc: Điền Phone
  action: type_text
  value: '1234567890'
- desc: Bấm Save lưu thông tin khách hàng
  action: tap_selector
  content_desc: Save
expected:
- desc: Hồ sơ khách hàng được tạo thành công trong chế độ offline
  assert_text: Offline
- desc: Dữ liệu khách hàng được lưu trữ cục bộ không bị rollback
  assert_text: Customer
