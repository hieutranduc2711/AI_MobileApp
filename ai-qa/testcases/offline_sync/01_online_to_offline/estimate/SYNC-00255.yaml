id: SYNC-00255
title: 'Change Estimate package type: Load dữ liệu online → mất mạng → vẫn thực hiện
  Change Estimate package type'
sheet: 01_Online_to_Offline
module: Estimate
action: Change Estimate package type
priority: P1
flow_phase: O2F-01 Ready local cache
direction: ONLINE → OFFLINE
app_path: GD Mobile > Estimate > Package
preconditions: Đăng nhập đúng account/branch; user có quyền Change Estimate package
  type; prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Estimate >
  Package.
test_data: Valid representative entity
steps:
- desc: Bật network ổn định.
  action: tap_selector
  text: Bật network ổn định.
  delay: 1.0
- desc: Mở entity/list cần test và chờ dữ liệu online/local sync hoàn tất.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Ghi nhận giá trị hiện tại của entity.
  action: tap_selector
  text: 'Ghi nhận giá trị hiện tại của '
  delay: 1.0
- desc: Tắt Wi‑Fi + mobile data; chờ app chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Không reload app.
  action: tap_selector
  text: Không reload app.
  delay: 1.0
- desc: Thực hiện Change Estimate package type.
  action: tap_selector
  text: Change Estimate package type
  delay: 1.0
- desc: Navigate ra màn hình khác rồi quay lại.
  action: back
  delay: 1.0
- desc: Giữ device Offline và kiểm tra kết quả.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Dữ liệu đã có khi online vẫn tồn tại sau khi mất mạng.
  assert_text: Estimate
- desc: Change Estimate package type vẫn thực hiện được theo offline scope.
  assert_text: Estimate
- desc: Không cần manual Offline toggle.
  assert_text: Estimate
- desc: Kết quả được giữ local/pending, không rollback vì mất network.
  assert_text: Estimate
- desc: Không đọc nhầm data account/branch khác.
  assert_text: Estimate
