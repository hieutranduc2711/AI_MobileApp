id: SYNC-00261
title: 'Change Estimate status: Bắt đầu Change Estimate status online → mất mạng ngay
  trước Save/Confirm'
sheet: 01_Online_to_Offline
module: Estimate
action: Change Estimate status
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Estimate > Status
preconditions: Đăng nhập đúng account/branch; user có quyền Change Estimate status;
  prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Estimate > Status.
test_data: Valid edited values
steps:
- desc: Bật network ổn định và mở flow.
  action: tap_selector
  text: Bật network ổn định và mở flow
  delay: 1.0
- desc: Bắt đầu Change Estimate status khi đang Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Điền/chọn dữ liệu cần thiết nhưng chưa Save/Confirm.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Ngay trước Save/Confirm, tắt toàn bộ network.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Chờ indicator chuyển Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Tiếp tục thao tác nếu còn field chưa hoàn thành.
  action: tap_selector
  text: Tiếp tục thao tác nếu còn fiel
  delay: 1.0
- desc: Nhấn Save/Confirm.
  action: tap_selector
  content_desc: Save
  delay: 2.0
- desc: Navigate ra/vào lại entity trong khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
- desc: Draft/input không bị reset chỉ vì network đổi Online → Offline.
  assert_text: Estimate
- desc: Save chuyển sang offline-safe flow/outbox nếu action được offline support.
  assert_text: Estimate
- desc: Local UI phản ánh đúng result.
  assert_text: Estimate
- desc: Không network error làm mất dữ liệu người dùng vừa nhập.
  assert_text: Estimate
source_tickets: RN-5576, RN-5542
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5576

  https://gorilladesk1.atlassian.net/browse/RN-5542'
risk: Data loss at transition
notes: ''
