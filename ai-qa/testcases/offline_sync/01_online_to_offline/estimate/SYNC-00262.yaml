id: SYNC-00262
title: 'Change Estimate status: Thực hiện Change Estimate status online → mất mạng
  khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Estimate
action: Change Estimate status
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Estimate > Status
preconditions: Đăng nhập đúng account/branch; user có quyền Change Estimate status;
  prerequisite/local data cần thiết đã sync; mở đúng GD Mobile > Estimate > Status.
test_data: Valid action; proxy/network can cut immediately
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Bấm nút (+) Floating Action Button trên Calendar
  action: tap_selector
  resource_id: OutlinePlus
  value: 0.91,0.94
- desc: Chọn New Estimate trong Action Sheet
  action: tap_selector
  content_desc: New Estimate
  text: New Estimate
  value: 0.5,0.88
- desc: Chọn khách hàng lập báo giá
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn địa điểm dịch vụ
  action: tap_selector
  resource_id: location-item
  index: 0
- desc: Bấm Save để lưu Estimate offline
  action: tap_selector
  content_desc: Save
expected:
- desc: Báo giá được tính toán và lưu offline an toàn
  assert_text: Estimate
- desc: Tổng tiền hiển thị chính xác
  assert_text: Subtotal
source_tickets: RN-5576, RN-5542
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5576

  https://gorilladesk1.atlassian.net/browse/RN-5542'
risk: Unknown request outcome/idempotency
notes: ''
