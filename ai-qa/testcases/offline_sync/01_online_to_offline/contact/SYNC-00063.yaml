  content_desc: Save
  delay: 2.0
- desc: Ngay sau khi request bắt đầu, cắt network trước khi client nhận kết quả.
  action: tap_selector
  text: 'Ngay sau khi request bắt đầu, '
  delay: 1.0
- desc: Giữ app foreground.
  action: tap_selector
  text: Giữ app foreground.
  delay: 1.0
- desc: Quan sát UI/local state/pending state.
  action: tap_selector
  text: Quan sát UI/local state/pendin
  delay: 1.0
- desc: Navigate ra/vào lại entity khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
expected:
