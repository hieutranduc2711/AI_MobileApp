id: SYNC-00063
title: 'Edit Contact: Thực hiện Edit Contact online → mất mạng khi request đang in-flight'
sheet: 01_Online_to_Offline
module: Contact
action: Edit Contact
priority: P0
flow_phase: O2F-03 Drop in-flight
direction: ONLINE → OFFLINE
app_path: GD Mobile > Customer > Contacts > Edit
preconditions: Đăng nhập đúng account/branch; user có quyền Edit Contact; prerequisite/local
