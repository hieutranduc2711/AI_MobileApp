  assert_text: Contact
- desc: Không tạo duplicate local record/effect.
  assert_text: Contact
- desc: State phải ở local optimistic/pending hoặc trạng thái an toàn tương đương.
  assert_text: Contact
- desc: Không hiện fully synced khi chưa có xác nhận authoritative.
  assert_text: Contact
