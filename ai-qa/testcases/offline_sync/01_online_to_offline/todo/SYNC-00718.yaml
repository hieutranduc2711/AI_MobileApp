id: SYNC-00718
title: 'Reorder Todo: Bắt đầu Reorder Todo online → mất mạng ngay trước Save/Confirm'
sheet: 01_Online_to_Offline
module: Todo
action: Reorder Todo
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Todo > Reorder
preconditions: Đăng nhập đúng account/branch; user có quyền Reorder Todo; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > Job > Todo > Reorder.
test_data: Valid edited values
steps:
- desc: Đảm bảo kết nối mạng Online ban đầu để nạp dữ liệu cơ sở
  action: set_network
  value: 'true'
- desc: Đưa ứng dụng về màn hình Calendar Home an toàn
  action: macro
  value: ensure_calendar_home
- desc: Ngắt toàn bộ kết nối mạng (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Todo List trong Job Details
  action: tap_selector
  text: Todo List
expected:
- desc: Mục việc cần làm hiển thị trong danh sách chờ offline
  assert_text: Todo List
