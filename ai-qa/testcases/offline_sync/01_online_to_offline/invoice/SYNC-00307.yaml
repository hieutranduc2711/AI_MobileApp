- desc: Xác nhận banner / icon Offline xuất hiện trên màn hình
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Invoice trong Job Details
  action: tap_selector
  text: Invoice
expected:
- desc: Hóa đơn được lưu cục bộ và hiển thị thông tin thanh toán
  assert_text: Invoice
- desc: Số tiền hóa đơn được bảo lưu chính xác
