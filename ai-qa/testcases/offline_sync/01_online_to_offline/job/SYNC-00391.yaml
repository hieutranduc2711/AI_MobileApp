  Save/Confirm'
sheet: 01_Online_to_Offline
module: Job
action: Stop Time Tracking
priority: P0
flow_phase: O2F-02 Drop before Save
direction: ONLINE → OFFLINE
app_path: GD Mobile > Job > Time Tracking > Stop
