id: SYNC-00517
title: 'Add Unit Photo: Hoàn tất Add Unit Photo online → authoritative state về local
  → chuyển Offline'
sheet: 01_Online_to_Offline
module: MDU Photo
action: Add Unit Photo
priority: P1
flow_phase: O2F-05 Authoritative cached
direction: ONLINE → OFFLINE
app_path: GD Mobile > MDU > Unit > Photos > Add
preconditions: Đăng nhập đúng account/branch; user có quyền Add Unit Photo; prerequisite/local
  data cần thiết đã sync; mở đúng GD Mobile > MDU > Unit > Photos > Add.
test_data: Valid action
steps:
- desc: Thực hiện action hoàn toàn khi Online.
  action: set_network
  value: 'true'
  delay: 2.0
- desc: Chờ backend xử lý xong và authoritative state sync về local.
  action: back
  delay: 1.0
- desc: Refresh/reopen để xác nhận giá trị mới.
  action: tap_selector
  text: Refresh/reopen để xác nhận giá
  delay: 1.0
- desc: Tắt toàn bộ network.
  action: tap_selector
  text: Tắt toàn bộ network.
  delay: 1.0
- desc: Force close/reopen app khi vẫn Offline.
  action: set_network
  value: 'false'
  delay: 2.0
- desc: Mở lại entity/list.
  action: tap_selector
  text: Mở lại entity/list.
  delay: 1.0
expected:
- desc: Latest authoritative state đã được persist local trước khi mất mạng.
  assert_text: MDU Photo
- desc: Sau restart Offline vẫn thấy đúng state mới.
  assert_text: MDU Photo
- desc: Không quay lại stale value cũ.
  assert_text: MDU Photo
- desc: Không cần remote API để đọc state đã cache.
  assert_text: MDU Photo
source_tickets: RN-5590, RN-5592, RN-5525
source_urls: 'https://gorilladesk1.atlassian.net/browse/RN-5590

