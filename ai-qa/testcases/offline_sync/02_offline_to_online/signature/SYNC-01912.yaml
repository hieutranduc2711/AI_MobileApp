id: SYNC-01912
title: 'Capture Unit Signature: Capture Unit Signature: Offline queue → server đã
  process nhưng response mất'
sheet: 02_Offline_to_Online
module: Signature
action: Capture Unit Signature
priority: P0
flow_phase: F2O-07 Server processed / response lost
direction: OFFLINE → ONLINE
app_path: GD Mobile > MDU > Unit > Signature
preconditions: Đúng account/branch; prerequisite đã cache; device đang Offline; user
  có quyền Capture Unit Signature.
test_data: Valid representative entity/action
steps:
- desc: Chuyển thiết bị sang chế độ Offline (Tắt Wi-Fi & Mobile Data)
  action: set_network
  value: 'false'
  delay: 1.5
- desc: Xác nhận ứng dụng đang trong trạng thái Offline
  action: assert_offline
- desc: Mở Job chi tiết từ Calendar
  action: tap_selector
  resource_id: customer-avatar
  index: 0
- desc: Chọn mục Signatures trong Job Details
  action: tap_selector
  text: Signatures
- desc: Thực hiện ký xác nhận (Tech Signature)
  action: macro
  value: take_signature
  args:
    target: tech
- desc: Khôi phục kết nối mạng (Bật Wi-Fi & Mobile Data)
  action: set_network
  value: 'true'
  delay: 2.0
expected:
- desc: Chữ ký số được mã hóa và lưu vào hồ sơ Job offline
  assert_text: Signatures
- desc: Chữ ký duy trì nguyên vẹn sau khi mất mạng
  assert_text: Save
- desc: Hàng đợi Pending Outbox đẩy toàn bộ mutation lên server mà không xung đột
  assert_text: Today
