- desc: Nhập Last Name khách hàng
  action: tap_selector
  text: Last Name
- desc: Điền Last Name
  action: type_text
  value: SyncTest
- desc: Nhập Phone khách hàng
  action: tap_selector
  text: Phone
- desc: Điền Phone
  action: type_text
