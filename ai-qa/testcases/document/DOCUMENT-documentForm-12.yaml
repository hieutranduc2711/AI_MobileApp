id: DOCUMENT-documentForm-12
title: Image field controls
feature: document
priority: High
description: An image field shows its attach/upload control and opens the attachment
  sheet.
preconditions: Logged in with the DEFAULT E2E account (document addon on, document-card
  permission, e.g. Admin), app on the Home screen (online). The first customer in
  “Customers” shows the “Documents” section with at least one document; “Edit Document”
  is offered for the first document (not e-signed) and its template contains the field
  types used below (section, text, text area, radio, checkbox, list box, signature,
  image). No case saves the document.
detox_reference: User sees image field controls
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Chạm vào mục [Edit Document]
  action: tap_selector
  text: Edit Document
  delay: 1.0
- desc: Scroll to the first image field.
  action: tap_selector
  text: Scroll to the first image fiel
  delay: 0.8
- desc: 'If it is an attach or upload control, tap it and, if an attachment sheet
    opens, '
  action: tap_selector
  text: If it is an attach or upload c
  delay: 0.8
expected:
- assert_text: its attach, upload, remove or retry cont
  desc: its attach, upload, remove or retry control
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to the "Documents" section.
  (3) Tap the first document in the section, then tap "Edit Document" in the menu.
  (4) Scroll to the first image field. After step 4, its attach, upload, remove or
  retry control should be displayed. (5) If it is an attach or upload control, tap
  it and, if an attachment sheet opens, swipe it down. If the form has no image field,
  stop and report the test as skipped: no image field in this template.'
