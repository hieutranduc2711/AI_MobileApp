id: DOCUMENT-documentEntry-04
title: Document row opens menu
feature: document
priority: High
description: Tapping the first document on the card opens its action menu.
preconditions: Logged in with the DEFAULT E2E account (document addon on, document-card
  permission, e.g. Admin), app on the Home screen (online). The first customer in
  “Customers” shows the “Documents” section with at least one document (5 or more
  for the “Show All” paths) and at least one service location; at least one Doc template
  exists. No case saves data.
detox_reference: User opens a document row menu from the embedded list
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Tap the first document in the section.
  action: tap_selector
  text: 'Tap the first document in the '
  delay: 0.8
- desc: 'Close the menu by tapping the handle at its top (id: indicator).'
  action: tap_selector
  text: 'Close the menu by tapping the '
  delay: 0.8
expected:
- assert_text: the document menu
  desc: the document menu
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to the "Documents" section.
  (3) Tap the first document in the section. After step 3, the document menu should
  be displayed. (4) Close the menu by tapping the handle at its top (id: indicator).'
