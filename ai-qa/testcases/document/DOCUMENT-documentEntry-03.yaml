id: DOCUMENT-documentEntry-03
title: Back from template select
feature: document
priority: High
description: Select Document opens from the card and back returns to customer detail.
preconditions: Logged in with the DEFAULT E2E account (document addon on, document-card
  permission, e.g. Admin), app on the Home screen (online). The first customer in
  “Customers” shows the “Documents” section with at least one document (5 or more
  for the “Show All” paths) and at least one service location; at least one Doc template
  exists. No case saves data.
detox_reference: User taps back from template select and returns to embedded card
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Select Document
  desc: Hiển thị 'Select Document' trên màn hình
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to the "Documents" section.
  (3) Tap the plus icon on the "Documents" section header; if a location list opens,
  tap the first location. After step 3, the "Select Document" screen should be displayed.
  (4) Tap the back arrow at the top-left.
