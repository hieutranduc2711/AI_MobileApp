id: DOCUMENT-documentSelect-05
title: Select first Doc template
feature: document
priority: High
description: Selecting the first Doc template creates a document; the user leaves
  the form.
preconditions: Logged in with the DEFAULT E2E account (document addon on, document-card
  permission, e.g. Admin), app on the Home screen (online). The first customer in
  “Customers” shows the “Documents” section with at least one document and at least
  one service location. Templates exist on both the Docs and PDFs tabs (enough Doc
  templates to scroll). DOCUMENT-documentSelect-05 creates a document from the first
  Doc template.
detox_reference: User selects first doc template and navigates back to embedded card
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Chạm vào mục [Docs]
  action: tap_selector
  text: Docs
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Select Document
  desc: Hiển thị 'Select Document' trên màn hình
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to the "Documents" section.
  (3) Tap the plus icon on the "Documents" section header; if a location list opens,
  tap the first location. After step 3, the "Select Document" screen should be displayed.
  (4) Tap the first template on the "Docs" tab. (5) If the document form opens, tap
  the back arrow and then "Leave". (6) If "Select Document" is still shown, tap the
  back arrow.
