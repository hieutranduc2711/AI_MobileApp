id: DOCUMENT-documentEntry-06
title: All Documents plus opens template select
feature: document
priority: High
description: The plus on All Documents leads to Select Document.
preconditions: Logged in with the DEFAULT E2E account (document addon on, document-card
  permission, e.g. Admin), app on the Home screen (online). The first customer in
  “Customers” shows the “Documents” section with at least one document (5 or more
  for the “Show All” paths) and at least one service location; at least one Doc template
  exists. No case saves data.
detox_reference: User taps add on AllDocuments and reaches template select
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Documents]
  action: tap_selector
  text: Documents
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Scroll to the "Documents" section.
  (3) If "Show All" is shown under the section: tap it, tap the plus icon at the top-right
  of "All Documents", and if a location list opens tap the first location; after that
  the "Select Document" screen should be displayed. If there is no "Show All", the
  plus icon on the "Documents" section header should be displayed instead.'
