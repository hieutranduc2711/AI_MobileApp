id: DASHBOARD-dashboard.fullflow-05
title: Jobs board schedule button
feature: dashboard
priority: High
description: The Jobs board shows its schedule button.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online). Year cases change
  the board's selected year for the session.
detox_reference: GIVEN dashboard WHEN Jobs board visible THEN schedule CTA exists
  (modal not required)
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Chạm vào mục [Jobs]
  action: tap_selector
  text: Jobs
  delay: 1.0
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: All Schedules
  desc: Hiển thị 'All Schedules' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Scroll to the "Jobs" board. After step 2,
  the "Jobs" board with its schedule button (for example "All Schedules") should be
  displayed. If "Dashboard" is not in the menu, stop and report the test as skipped:
  dashboard not available for this account.'
