id: DASHBOARD-dashboard.fullflow-11
title: Sales Forecast year selection
feature: dashboard
priority: High
description: Selecting a year on Sales Forecast does not trap the user.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online). Year cases change
  the board's selected year for the session.
detox_reference: GIVEN dashboard WHEN open Sales Forecast year selector THEN selecting
  year does not trap user
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Chạm vào mục [Sales Forecast]
  action: tap_selector
  text: Sales Forecast
  delay: 1.0
- desc: Bấm nút Save để lưu dữ liệu
  action: tap_selector
  content_desc: Save
  delay: 2.5
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: the Dashboard
  desc: the Dashboard
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Scroll to the "Sales Forecast" board and tap
  its year button. (3) In the year sheet tap last year''s row; if the sheet stays
  open, tap "Save" (id: saveButton). After step 3, the Dashboard should still be displayed.
  If the board or its year button is missing, stop and report the test as skipped:
  board not available for this role.'
