id: DASHBOARD-dashboard.fullflow-02
title: Back from Dashboard to Home
feature: dashboard
priority: High
description: The Dashboard back arrow returns to Home.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online). Year cases change
  the board's selected year for the session.
detox_reference: GIVEN dashboard WHEN use header back THEN returns to home
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: the Home screen with the top-left menu i
  desc: the Home screen with the top-left menu icon
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Tap the back arrow at the top-left. After
  step 2, the Home screen with the top-left menu icon should be displayed. If "Dashboard"
  is not in the menu, stop and report the test as skipped: dashboard not available
  for this account.'
