id: UX-03
title: Dashboard scrolls and stays
feature: dashboard
priority: High
description: Scrolling the Dashboard keeps the Dashboard screen.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online).
detox_reference: 'UX-03: dashboard scroll gesture runs without losing root screen'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Scroll down about one screen.
  action: tap_selector
  text: Scroll down about one screen.
  delay: 0.8
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Scroll down about one screen. After step 2,
  the Dashboard should still be displayed. If "Dashboard" is not in the menu, stop
  and report the test as skipped: dashboard not available for this account.'
