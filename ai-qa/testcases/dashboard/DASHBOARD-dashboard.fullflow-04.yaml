id: DASHBOARD-dashboard.fullflow-04
title: Tags tabs switch
feature: dashboard
priority: High
description: The Tags board Customer and Location tabs switch and the board remains.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online). Year cases change
  the board's selected year for the session.
detox_reference: GIVEN dashboard Tags board WHEN switch tag tabs THEN board remains
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Chạm vào mục [Tags]
  action: tap_selector
  text: Tags
  delay: 1.0
- desc: Chạm vào mục [Location]
  action: tap_selector
  text: Location
  delay: 1.0
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: Tags
  desc: Hiển thị 'Tags' trên màn hình
- assert_text: Tags
  desc: Hiển thị 'Tags' trên màn hình
- assert_text: Tags
  desc: Hiển thị 'Tags' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Scroll to the "Tags" board and tap its "Customer"
  tab. After step 2, the "Tags" board should still be displayed. (3) Tap its "Location"
  tab. After step 3, the "Tags" board should still be displayed. If the "Tags" board
  or its tabs are missing, stop and report the test as skipped: tags board not available.'
