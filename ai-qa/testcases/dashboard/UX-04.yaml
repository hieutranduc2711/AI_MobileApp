id: UX-04
title: Dashboard header title shown
feature: dashboard
priority: High
description: The Dashboard header title is present.
preconditions: Logged in with the DEFAULT E2E account (non-technician role with dashboard
  access, so all boards show), app on the Home screen (online).
detox_reference: 'UX-04: header title is visible on dashboard'
steps:
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Dashboard] trong Drawer Menu
  action: tap_selector
  content_desc: Dashboard
  delay: 1.2
- desc: Scroll slightly up.
  action: tap_selector
  text: Scroll slightly up.
  delay: 0.8
expected:
- assert_text: Dashboard
  desc: Hiển thị 'Dashboard' trên màn hình
- assert_text: Stats
  desc: Hiển thị 'Stats' trên màn hình
- assert_text: Jobs
  desc: Hiển thị 'Jobs' trên màn hình
- assert_text: 'the header title (id: header-title)'
  desc: 'the header title (id: header-title)'
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the top-left menu
  icon, then "Dashboard". After step 1, the "Dashboard" screen with the "Stats" or
  "Jobs" board should be displayed. (2) Scroll slightly up. After step 2, the header
  title (id: header-title) should be displayed. If "Dashboard" is not in the menu,
  stop and report the test as skipped: dashboard not available for this account.'
