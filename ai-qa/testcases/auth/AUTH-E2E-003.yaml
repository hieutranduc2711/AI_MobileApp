id: AUTH-E2E-003
title: Keyboard does not hide Login button
feature: auth
priority: High
description: After typing credentials and pressing return, the Login button is still
  visible.
preconditions: 'Logged out, app on the Welcome screen (Android, online). AUTH-E2E-010
  and AUTH-E2E-012 log in with the DEFAULT E2E account: replace <TEST_EMAIL>/<TEST_PASSWORD>
  at run time (Detox E2E_TEST_EMAIL/E2E_TEST_PASSWORD). AUTH-E2E-011 needs no biometric
  credentials stored in the app. AUTH-E2E-014 needs the network disabled and no offline
  data (otherwise it reports skipped). AUTH-E2E-016…019 only where real sign-up attempts
  are allowed (Detox guard E2E_ALLOW_SIGNUP=true).'
detox_reference: 'login: keyboard should not block Login CTA (hittable)'
steps:
- desc: Chạm vào ô nhập [input]
  action: tap_selector
  text: input
  delay: 0.5
- desc: Nhập dữ liệu 'valid.user@example.com' vào ô [input]
  action: type_text
  value: valid.user@example.com
  delay: 0.8
- desc: Chạm vào mục [Password]
  action: tap_selector
  text: Password
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Login screen (from Welcome, tap "I
  already have an account") and clear both fields. (1) Type "valid.user@example.com"
  in "Email or Username" (id: username-input) and "ValidPass123" in "Password". (2)
  Press the keyboard return key in "Password". At the end, the "Login" button should
  be visible and not covered by the keyboard.'
