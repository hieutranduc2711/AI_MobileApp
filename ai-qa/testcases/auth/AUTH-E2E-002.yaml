id: AUTH-E2E-002
title: Sign up, logout, login again
feature: auth
priority: High
description: A new account completes the 3-step sign-up, reaches Home, logs out, logs
  back in and logs out again.
preconditions: 'Logged out, app on the Welcome screen (Android, online). AUTH-E2E-001
  logs in with the DEFAULT E2E account: replace <TEST_EMAIL>/<TEST_PASSWORD> at run
  time (Detox E2E_TEST_EMAIL/E2E_TEST_PASSWORD). AUTH-E2E-002 only where creating
  real accounts is allowed (Detox guard E2E_ALLOW_SIGNUP=true); it creates a new GorillaDesk
  account on every run.'
detox_reference: should sign up new account, handle popup + Getting Started redirect,
  then logout/login again
steps:
- desc: Chạm vào mục [Get started]
  action: tap_selector
  text: Get started
  delay: 1.0
- desc: Chạm vào mục [e2e.signup.<current time as digits>@example.com]
  action: tap_selector
  text: e2e.signup.<current time as digits>@example.com
  delay: 1.0
- desc: Chạm vào mục [E2E Company]
  action: tap_selector
  text: E2E Company
  delay: 1.0
- desc: Chạm vào mục [E2E]
  action: tap_selector
  text: E2E
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
- desc: Chọn mục [Log Out] trong Drawer Menu
  action: tap_selector
  content_desc: Log Out
  delay: 1.2
- desc: Chạm vào mục [Verification required]
  action: tap_selector
  text: Verification required
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Welcome screen. (1) Tap "Get started".
  (2) Enter "e2e.signup.<current time as digits>@example.com" as "Email" and "ValidPass123"
  in both password fields; tap "Next". (3) Enter company name "E2E Company", industry
  "Pest Control", team size "Just me"; tap "Next". (4) Enter first name "E2E", last
  name "User", phone "5551234567", country "United States"; tap "Finish". (5) Close
  popups without updating; press back if "Getting Started" opens. (6) Log out (top-left
  menu icon, then "Log Out"). (7) Log in with the step 2 credentials, then repeat
  steps 5–6. After step 5 and its repeat, the Home screen (id: home-bar) should be
  displayed; after each logout, the Login screen should be displayed. If "Verification
  required" appears, stop and report the test as skipped: 2FA required.'
