id: AUTH-E2E-018
title: Sign-up Country list select and close
feature: auth
priority: High
description: On sign-up step 3 the country list opens, a top country can be picked
  and the list closes.
preconditions: 'Logged out, app on the Welcome screen (Android, online). AUTH-E2E-010
  and AUTH-E2E-012 log in with the DEFAULT E2E account: replace <TEST_EMAIL>/<TEST_PASSWORD>
  at run time (Detox E2E_TEST_EMAIL/E2E_TEST_PASSWORD). AUTH-E2E-011 needs no biometric
  credentials stored in the app. AUTH-E2E-014 needs the network disabled and no offline
  data (otherwise it reports skipped). AUTH-E2E-016…019 only where real sign-up attempts
  are allowed (Detox guard E2E_ALLOW_SIGNUP=true).'
detox_reference: 'signup: Country modal can open, select a top country, and close'
steps:
- desc: Chạm vào mục [Get started]
  action: tap_selector
  text: Get started
  delay: 1.0
- desc: Chạm vào ô nhập [input]
  action: tap_selector
  text: input
  delay: 0.5
- desc: Nhập dữ liệu 'e2e.signup.<current time as digits>@example.com' vào ô [input]
  action: type_text
  value: e2e.signup.<current time as digits>@example.com
  delay: 0.8
- desc: Chạm vào ô nhập [input]
  action: tap_selector
  text: input
  delay: 0.5
- desc: Nhập dữ liệu 'E2E Company' vào ô [input]
  action: type_text
  value: E2E Company
  delay: 0.8
- desc: Chạm vào mục [Country]
  action: tap_selector
  text: Country
  delay: 1.0
- desc: Chạm vào mục [United States]
  action: tap_selector
  text: United States
  delay: 1.0
expected:
- assert_text: Country
  desc: Hiển thị 'Country' trên màn hình
- assert_text: Country
  desc: Hiển thị 'Country' trên màn hình
- assert_text: Country
  desc: Hiển thị 'Country' trên màn hình
goal_summary: Open the GorillaDesk app on the Welcome screen. (1) Tap "Get started".
  (2) Type "e2e.signup.<current time as digits>@example.com" in "Email" and "ValidPass123"
  in "Password" and "Confirm Password", then tap "Next". (3) Type "E2E Company" in
  "Company Name", pick "Pest Control" in "Choose your industry" and "Just me" in "What's
  your team size", then tap "Next". After step 3, "Country" should be displayed. (4)
  Tap "Country". After step 4, the "Country" list should be displayed. (5) Tap "United
  States". After step 5, the "Country" list should be closed.
