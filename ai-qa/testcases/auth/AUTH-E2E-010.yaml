id: AUTH-E2E-010
title: Offline login option after online session
feature: auth
priority: High
description: After an online login and logout, Login offers the offline-mode login
  when offline data exists.
preconditions: 'Logged out, app on the Welcome screen (Android, online). AUTH-E2E-010
  and AUTH-E2E-012 log in with the DEFAULT E2E account: replace <TEST_EMAIL>/<TEST_PASSWORD>
  at run time (Detox E2E_TEST_EMAIL/E2E_TEST_PASSWORD). AUTH-E2E-011 needs no biometric
  credentials stored in the app. AUTH-E2E-014 needs the network disabled and no offline
  data (otherwise it reports skipped). AUTH-E2E-016…019 only where real sign-up attempts
  are allowed (Detox guard E2E_ALLOW_SIGNUP=true).'
detox_reference: 'login: offline mode CTA should appear after a successful online
  login (retrieve exists)'
steps:
- desc: Chạm vào mục [Email or Username]
  action: tap_selector
  text: Email or Username
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
- desc: Mở Drawer Navigation Menu
  action: tap_selector
  resource_id: highlight-button
  index: 0
  delay: 0.8
expected:
- assert_text: 'the Home screen (id: home-bar)'
  desc: 'the Home screen (id: home-bar)'
goal_summary: 'Open the GorillaDesk app on the Login screen (from Welcome, tap "I
  already have an account") and clear both fields. (1) Type <TEST_EMAIL> in "Email
  or Username" and <TEST_PASSWORD> in "Password", then tap "Login". (2) Close any
  popup without updating; press back if "Getting Started" opens. After step 2, the
  Home screen (id: home-bar) should be displayed. (3) Log out via the top-left menu
  icon and "Log Out". At the end, the Login screen should show "Login with Offline
  Mode" (id: offline-login-button); if it does not, stop and report the test as skipped:
  no offline data on device. If "Verification required" appears, stop and report the
  test as skipped: 2FA required.'
