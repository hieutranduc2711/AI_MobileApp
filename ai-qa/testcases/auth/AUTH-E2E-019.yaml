id: AUTH-E2E-019
title: Sign-up Country code list select
feature: auth
priority: High
description: On sign-up step 3 the phone country-code list opens, a code can be picked
  and the list closes.
preconditions: 'Logged out, app on the Welcome screen (Android, online). AUTH-E2E-010
  and AUTH-E2E-012 log in with the DEFAULT E2E account: replace <TEST_EMAIL>/<TEST_PASSWORD>
  at run time (Detox E2E_TEST_EMAIL/E2E_TEST_PASSWORD). AUTH-E2E-011 needs no biometric
  credentials stored in the app. AUTH-E2E-014 needs the network disabled and no offline
  data (otherwise it reports skipped). AUTH-E2E-016…019 only where real sign-up attempts
  are allowed (Detox guard E2E_ALLOW_SIGNUP=true).'
detox_reference: 'signup: Country code modal can open and select a country code'
steps:
- desc: Chạm vào mục [Get started]
  action: tap_selector
  text: Get started
  delay: 1.0
- desc: Chạm vào ô nhập [input]
  action: tap_selector
  text: input
  delay: 0.5
- desc: Nhập dữ liệu 'e2e.signup.<current time as digits>@example.com' vào ô [input]
  action: type_text
  value: e2e.signup.<current time as digits>@example.com
  delay: 0.8
- desc: Chạm vào ô nhập [input]
  action: tap_selector
  text: input
  delay: 0.5
- desc: Nhập dữ liệu 'E2E Company' vào ô [input]
  action: type_text
  value: E2E Company
  delay: 0.8
- desc: Chạm vào mục [+1 (US)]
  action: tap_selector
  text: +1 (US)
  delay: 1.0
- desc: Chạm vào mục [+61 (AU) Australia]
  action: tap_selector
  text: +61 (AU) Australia
  delay: 1.0
expected:
- assert_text: +1 (US)
  desc: Hiển thị '+1 (US)' trên màn hình
- assert_text: Phone
  desc: Hiển thị 'Phone' trên màn hình
- assert_text: Country Codes
  desc: Hiển thị 'Country Codes' trên màn hình
- assert_text: the list
  desc: the list
goal_summary: 'Open the GorillaDesk app on the Welcome screen. (1) Tap "Get started".
  (2) Type "e2e.signup.<current time as digits>@example.com" in "Email" and "ValidPass123"
  in "Password" and "Confirm Password", then tap "Next". (3) Type "E2E Company" in
  "Company Name", pick "Pest Control" in "Choose your industry" and "Just me" in "What''s
  your team size", then tap "Next". After step 3, the "+1 (US)" code left of "Phone"
  should be displayed. (4) Tap "+1 (US)". After step 4, the "Country Codes" list (id:
  country-codes-list) should be displayed. (5) Tap "+61 (AU) Australia", or "+1 (US)
  United States" if it is not listed. After step 5, the list should be closed.'
