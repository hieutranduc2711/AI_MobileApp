id: TC_SMS_CORE_06
title: Select all and mark
feature: sms
priority: High
description: Select-all then the mark button marks conversations in batch.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_06][DOC+][ListMark] User toggles select-all and marks
  batch conversations'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tick the select-all checkbox.
  action: tap_selector
  text: Tick the select-all checkbox.
  delay: 0.8
- desc: Tap it.
  action: tap_selector
  text: Tap it.
  delay: 0.8
expected:
- assert_text: Mark as Read
  desc: Hiển thị 'Mark as Read' trên màn hình
- assert_text: the SMS list
  desc: the SMS list
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tick the select-all checkbox. After step
  2, the mark button ("Mark as Read") should be displayed. (3) Tap it. After step
  3, the SMS list should be displayed. If there is no SMS button or no select-all
  checkbox, stop and report the test as skipped: select-all not shown.'
