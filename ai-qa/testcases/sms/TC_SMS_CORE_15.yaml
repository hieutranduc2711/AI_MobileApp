- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Chạm vào mục [Send]
  action: tap_selector
  text: Send
  delay: 1.0
- desc: Tap its button to close it. If there is no SMS button or no conversation,
    stop a
  action: tap_selector
  text: Tap its button to close it. If
  delay: 0.8
expected:
- assert_text: Typing Message
  desc: Hiển thị 'Typing Message' trên màn hình
- assert_text: Send
  desc: Hiển thị 'Send' trên màn hình
- assert_text: an error dialog
  desc: an error dialog
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. After step
  2, the conversation with the "Typing Message" box and "Send" should be displayed.
  (3) Tap "Send" with an empty message. After step 3, an error dialog should be displayed.
  (4) Tap its button to close it. If there is no SMS button or no conversation, stop
  and report the test as skipped: no SMS conversation.'
