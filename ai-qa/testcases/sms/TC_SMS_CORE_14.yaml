expected:
- assert_text: Typing Message
  desc: Hiển thị 'Typing Message' trên màn hình
- assert_text: Send
  desc: Hiển thị 'Send' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. After step
  2, the conversation with the "Typing Message" box and "Send" should be displayed.
  (3) Tap the template button, type "a" in "Search Template" and pull the list down.
  (4) Tap the second template if there is one. If the template sheet does not open,
  stop and report the test as skipped: templates unavailable.'
