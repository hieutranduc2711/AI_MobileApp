id: TC_SMS_CORE_27
title: Save As Template option
feature: sms
priority: High
description: Save As Template in the template sheet can be tapped.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_27][DOC+][Template] User taps save-as-template option
  from template modal'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Tap the template button.
  action: tap_selector
  text: Tap the template button.
  delay: 0.8
- desc: Tap it. If the template sheet does not open, stop and report the test as skipped
  action: tap_selector
  text: 'Tap it. If the template sheet '
  delay: 0.8
expected:
- assert_text: Typing Message
  desc: Hiển thị 'Typing Message' trên màn hình
- assert_text: Send
  desc: Hiển thị 'Send' trên màn hình
- assert_text: Save As Template
  desc: Hiển thị 'Save As Template' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. After step
  2, the conversation with the "Typing Message" box and "Send" should be displayed.
  (3) Tap the template button. After step 3, "Save As Template" should be displayed.
  (4) Tap it. If the template sheet does not open, stop and report the test as skipped:
  templates unavailable.'
