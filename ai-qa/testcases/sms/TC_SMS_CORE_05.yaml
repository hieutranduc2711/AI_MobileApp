id: TC_SMS_CORE_05
title: Mark one conversation as read
feature: sms
priority: High
description: One unread conversation can be marked as read.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_05][DOC+][ListMark] User marks one unread conversation
  as read'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tick the checkbox of the first Unread conversation.
  action: tap_selector
  text: Tick the checkbox of the first
  delay: 0.8
- desc: Tap it.
  action: tap_selector
  text: Tap it.
  delay: 0.8
expected:
- assert_text: Mark as Read
  desc: Hiển thị 'Mark as Read' trên màn hình
- assert_text: the SMS list
  desc: the SMS list
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tick the checkbox of the first Unread conversation.
  After step 2, "Mark as Read" should be displayed. (3) Tap it. After step 3, the
  SMS list should be displayed. If there is no SMS button or no checkbox, stop and
  report the test as skipped: no unread conversation.'
