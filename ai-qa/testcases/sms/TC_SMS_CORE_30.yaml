id: TC_SMS_CORE_30
title: Draft restored after reopening
feature: sms
priority: High
description: A typed draft is restored when the conversation is reopened.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_30][DOC+][Draft] User types draft, goes back, reopens
  conversation and sees draft preview restored'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Chạm vào mục [e2e draft <current time>]
  action: tap_selector
  text: e2e draft <current time>
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: e2e draft
  desc: Hiển thị 'e2e draft' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. (3) Type "e2e
  draft <current time>" in the message box. (4) Tap the back arrow, then open the
  first conversation again and tap the message box. After step 4, the message box
  should contain "e2e draft". If there is no SMS button or no conversation, stop and
  report the test as skipped: no SMS conversation.'
