id: TC_SMS_CORE_19
title: Customer chat has no On The Way
feature: sms
priority: High
description: A conversation opened from customer detail has no On The Way button.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_19][DOC+][CustomerEntry] User opens SMS from CustomerDetail
  and does not see On The Way CTA'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Tap the floating chat button at the bottom-right.
  action: tap_selector
  text: Tap the floating chat button a
  delay: 0.8
expected:
- assert_text: the conversation screen
  desc: the conversation screen
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Tap the floating chat button at the
  bottom-right. After step 2, the conversation screen should be displayed and "On
  The Way" should not be displayed. If there is no chat button, stop and report the
  test as skipped: SMS unavailable for this customer.'
