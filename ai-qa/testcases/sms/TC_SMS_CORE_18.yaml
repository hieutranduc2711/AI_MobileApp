id: TC_SMS_CORE_18
title: Pull to refresh conversation
feature: sms
priority: High
description: Pull-to-refresh in a conversation keeps the conversation.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_18][DOC+][Conversation] User pull-to-refreshes message
  list and keeps screen stable'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Pull the message list down to refresh.
  action: tap_selector
  text: 'Pull the message list down to '
  delay: 0.8
expected:
- assert_text: the conversation screen
  desc: the conversation screen
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. (3) Pull the
  message list down to refresh. After step 3, the conversation screen should be displayed.
  If there is no SMS button or no conversation, stop and report the test as skipped:
  no SMS conversation.'
