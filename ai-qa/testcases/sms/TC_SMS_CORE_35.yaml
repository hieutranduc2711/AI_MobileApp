id: TC_SMS_CORE_35
title: Open phone filter
feature: sms
priority: High
description: The conversation header phone filter can be opened.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_35][DOC+][PhoneFilter] User opens phone filter modal
  from conversation header'
