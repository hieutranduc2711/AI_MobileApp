id: TC_SMS_CORE_22
title: Job chat shows On The Way
feature: sms
priority: High
description: A conversation opened from a job shows the On The Way button.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_22][DOC+][JobEntry] User opens job-context conversation
  and sees job-only On The Way CTA'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
expected:
- assert_text: On The Way
  desc: Hiển thị 'On The Way' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, then the first customer. (2) Tap the first job in its "Jobs" section,
  then the floating chat button. After step 2, the "On The Way" button should be displayed.
  If there is no job or chat button, stop and report the test as skipped: job SMS
  unavailable.'
