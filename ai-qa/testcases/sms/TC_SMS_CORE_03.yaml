id: TC_SMS_CORE_03
title: Pull to refresh SMS list
feature: sms
priority: High
description: Pull-to-refresh keeps the SMS list with its tabs.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_03][DOC+][List] User pull-to-refreshes SMS list and
  keeps list available'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Pull the list down to refresh.
  action: tap_selector
  text: Pull the list down to refresh.
  delay: 0.8
expected:
- assert_text: Unread
  desc: Hiển thị 'Unread' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Pull the list down to refresh. After step
  2, the "Unread" tab should be displayed. If there is no SMS button, stop and report
  the test as skipped: SMS addon off.'
