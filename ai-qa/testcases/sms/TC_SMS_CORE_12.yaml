id: TC_SMS_CORE_12
title: Insert a variable
feature: sms
priority: High
description: Choosing a variable inserts content into the message.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_12][DOC+][Composer] User selects a variable and sees
  message input has content'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Tap the variable button.
  action: tap_selector
  text: Tap the variable button.
  delay: 0.8
- desc: Tap the company name variable.
  action: tap_selector
  text: Tap the company name variable.
  delay: 0.8
expected:
- assert_text: Typing Message
  desc: Hiển thị 'Typing Message' trên màn hình
- assert_text: Send
  desc: Hiển thị 'Send' trên màn hình
- assert_text: the variables sheet
  desc: the variables sheet
- assert_text: the message input
  desc: the message input
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. After step
  2, the conversation with the "Typing Message" box and "Send" should be displayed.
  (3) Tap the variable button. After step 3, the variables sheet should be displayed.
  (4) Tap the company name variable. After step 4, the message input should contain
  text. If there is no company name variable, stop and report the test as skipped:
  variable not offered.'
