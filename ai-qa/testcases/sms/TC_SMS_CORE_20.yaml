id: TC_SMS_CORE_20
title: Unknown thread lead actions
feature: sms
priority: High
description: An unknown-number conversation offers Create Lead or Assign Lead.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_20][DOC+][UnknownConversation] User sees create lead
  and assign lead actions when unknown thread exists'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Chạm vào mục [Create Lead]
  action: tap_selector
  text: Create Lead
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. (3) Report
  whether "Create Lead" or "Assign Lead" is shown in the conversation header; their
  absence is not a failure. If there is no SMS button or no conversation, stop and
  report the test as skipped: no SMS conversation.'
