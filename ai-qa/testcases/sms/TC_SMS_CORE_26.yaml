id: TC_SMS_CORE_26
title: Emoji closes when attachments open
feature: sms
priority: High
description: Opening the attachment menu after the emoji board closes the emoji board.
preconditions: Logged in with the DEFAULT E2E account (SMS addon on) on the Home screen
  (online). SMS has unread and read conversations (enough for “Show More”), the first
  conversation has sent, received and failed messages, an unknown-number thread exists,
  SMS templates exist; the first customer in “Customers” has a phone number and a
  job. TC_SMS_CORE_05/06/34 change read state.
detox_reference: '[TC_SMS_CORE_26][DOC+][Attachment] User opens attachment menu after
  emoji and emoji panel should close'
steps:
- desc: Tap the SMS button at the top-right (next to the bell).
  action: tap_selector
  text: Tap the SMS button at the top-
  delay: 0.8
- desc: Tap the first conversation.
  action: tap_selector
  text: Tap the first conversation.
  delay: 0.8
- desc: Tap the emoji button.
  action: tap_selector
  text: Tap the emoji button.
  delay: 0.8
- desc: Tap the attachment (paperclip) button.
  action: tap_selector
  text: Tap the attachment (paperclip)
  delay: 0.8
expected:
- assert_text: Typing Message
  desc: Hiển thị 'Typing Message' trên màn hình
- assert_text: Send
  desc: Hiển thị 'Send' trên màn hình
- assert_text: the emoji board
  desc: the emoji board
- assert_text: the attachment menu
  desc: the attachment menu
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the SMS button
  at the top-right (next to the bell). (2) Tap the first conversation. After step
  2, the conversation with the "Typing Message" box and "Send" should be displayed.
  (3) Tap the emoji button. After step 3, the emoji board should be displayed. (4)
  Tap the attachment (paperclip) button. After step 4, the attachment menu should
  be displayed and the emoji board closed. If there is no SMS button or no conversation,
  stop and report the test as skipped: no SMS conversation.'
