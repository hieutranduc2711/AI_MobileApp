id: M_M_07
title: Edit Material from row menu
feature: material
priority: High
description: Edit Material from the first material row opens the material form.
preconditions: Logged in with the DEFAULT E2E account (material addon on, Admin-like
  role), app on the Home screen (online). The first customer in “Customers” has an
  active job first in its “Jobs” section whose “Materials” section has at least 5
  materials (so “Show All” appears); the company material list has at least one material.
detox_reference: '[M_M_07][Material][MaterialMenu] Navigates to MaterialForm after
  tapping edit button in menu'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Materials]
  action: tap_selector
  text: Materials
  delay: 1.0
- desc: Chạm vào mục [Edit Material]
  action: tap_selector
  text: Edit Material
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Edit Material
  desc: Hiển thị 'Edit Material' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, then its first job under "Jobs". (2) Scroll
  to the "Materials" section. (3) Tap the first material row and choose "Edit Material".
  After step 3, the "Edit Material" form should be displayed. (4) Tap the back arrow
  at the top-left. If the section has no material row, stop and report the test as
  skipped: no materials on the job.'
