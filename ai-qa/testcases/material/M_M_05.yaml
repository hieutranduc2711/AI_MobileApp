id: M_M_05
title: Material row opens menu
feature: material
priority: High
description: Tapping the first material opens its menu.
preconditions: Logged in with the DEFAULT E2E account (material addon on, Admin-like
  role), app on the Home screen (online). The first customer in “Customers” has an
  active job first in its “Jobs” section whose “Materials” section has at least 5
  materials (so “Show All” appears); the company material list has at least one material.
detox_reference: '[M_M_05][Material][MaterialList] Menu appears when tapping on material
  item'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Materials]
  action: tap_selector
  text: Materials
  delay: 1.0
- desc: Tap the first material row in the section.
  action: tap_selector
  text: 'Tap the first material row in '
  delay: 0.8
- desc: 'Close the sheet by tapping the handle at its top (id: indicator). If the
    section'
  action: tap_selector
  text: Close the sheet by tapping the
  delay: 0.8
expected:
- assert_text: the material menu sheet
  desc: the material menu sheet
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, then its first job under "Jobs". (2) Scroll
  to the "Materials" section. (3) Tap the first material row in the section. After
  step 3, the material menu sheet should be displayed. (4) Close the sheet by tapping
  the handle at its top (id: indicator). If the section has no material row, stop
  and report the test as skipped: no materials on the job.'
