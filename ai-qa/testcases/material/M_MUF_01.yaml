id: M_MUF_01
title: Usage form opens from catalog
feature: material
priority: High
description: The catalog plus opens the Add Material usage form with Name, Note and
  Save.
preconditions: Logged in with the DEFAULT E2E account (material addon on, Admin-like
  role), app on the Home screen (online). The first customer in “Customers” has an
  active job first in its “Jobs” section whose “Materials” section has at least 5
  materials (so “Show All” appears); the company material list has at least one material.
  M_MUF_04 adds “E2E Material” to the company material list.
detox_reference: '[M_MUF_01][Material][MaterialUsageForm] Form appears when tapping
  add button from catalog'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Materials]
  action: tap_selector
  text: Materials
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Add Material
  desc: Hiển thị 'Add Material' trên màn hình
goal_summary: Open the GorillaDesk app on the Home screen. (1) Tap the search icon
  at the top-right, the first customer, then its first job under "Jobs". (2) Scroll
  to the "Materials" section. (3) If "Show All" is under the section, tap it, tap
  the plus icon at the top-right and choose "Manage Material List"; otherwise tap
  the section's plus icon and choose "Manage Material List". (4) Tap the plus icon
  at the top-right. After step 4, the "Add Material" form should show "Name", "Note"
  and "Save". (5) Tap the back arrow at the top-left.
