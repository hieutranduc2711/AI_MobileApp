id: TC_EA
title: Edit first card from full list
feature: opportunity
priority: High
description: Editing the first card from All Opportunities opens the edit form with
  Remove Opportunity.
preconditions: Logged in with the DEFAULT E2E account on a Growth plan with the Opportunity
  addon and customer-opportunity access plus add/edit opportunity permission, app
  on the Home screen (online). The first customer in “Customers” has at least 6 opportunities
  (so “Show All” appears) and at least one contact. No case saves data.
detox_reference: '[DOC+][TC_EA][AllOpportunities] User taps edit on the first card
  from the full All Opportunities list and sees the edit form'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Opportunity]
  action: tap_selector
  text: Opportunity
  delay: 1.0
- desc: Chạm vào mục [Show All]
  action: tap_selector
  text: Show All
  delay: 1.0
- desc: Tap the pencil icon on the first opportunity card.
  action: tap_selector
  text: Tap the pencil icon on the fir
  delay: 0.8
expected:
- assert_text: All Opportunities
  desc: Hiển thị 'All Opportunities' trên màn hình
- assert_text: Edit Opportunities
  desc: Hiển thị 'Edit Opportunities' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Opportunity"
  section. (3) Tap "Show All" under the section. After step 3, the "All Opportunities"
  list should be displayed. (4) Tap the pencil icon on the first opportunity card.
  After step 4, the "Edit Opportunities" form should be displayed with "Remove Opportunity"
  at the bottom. If there is no "Opportunity" section or "Show All", stop and report
  the test as skipped: no full opportunity list.'
