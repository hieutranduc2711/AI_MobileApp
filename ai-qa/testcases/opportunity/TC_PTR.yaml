id: TC_PTR
title: Pull to refresh All Opportunities
feature: opportunity
priority: High
description: Pull-to-refresh keeps the All Opportunities list displayed.
preconditions: Logged in with the DEFAULT E2E account on a Growth plan with the Opportunity
  addon and customer-opportunity access plus add/edit opportunity permission, app
  on the Home screen (online). The first customer in “Customers” has at least 6 opportunities
  (so “Show All” appears) and at least one contact. No case saves data.
detox_reference: '[DOC+][TC_PTR][AllOpportunities] User pulls to refresh the full
  opportunities list and the list screen stays visible'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Opportunity]
  action: tap_selector
  text: Opportunity
  delay: 1.0
- desc: Chạm vào mục [Show All]
  action: tap_selector
  text: Show All
  delay: 1.0
- desc: Pull the list down from the top to refresh, twice.
  action: tap_selector
  text: Pull the list down from the to
  delay: 0.8
expected:
- assert_text: All Opportunities
  desc: Hiển thị 'All Opportunities' trên màn hình
- assert_text: All Opportunities
  desc: Hiển thị 'All Opportunities' trên màn hình
- assert_text: Opportunity
  desc: Hiển thị 'Opportunity' trên màn hình
- assert_text: Show All
  desc: Hiển thị 'Show All' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Opportunity"
  section. (3) Tap "Show All" under the section. After step 3, the "All Opportunities"
  list should be displayed. (4) Pull the list down from the top to refresh, twice.
  After step 4, the "All Opportunities" list should still be displayed. If there is
  no "Opportunity" section or "Show All", stop and report the test as skipped: no
  full opportunity list.'
