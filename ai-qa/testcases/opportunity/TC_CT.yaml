id: TC_CT
title: Contact field opens contacts sheet
feature: opportunity
priority: High
description: The contact field on the add form opens the contact picker.
preconditions: Logged in with the DEFAULT E2E account on a Growth plan with the Opportunity
  addon and customer-opportunity access plus add/edit opportunity permission, app
  on the Home screen (online). The first customer in “Customers” has at least 6 opportunities
  (so “Show All” appears) and at least one contact. No case saves data.
detox_reference: '[DOC+][TC_CT][Form] User taps contact field on add form and sees
  the contact picker modal'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Opportunity]
  action: tap_selector
  text: Opportunity
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Chạm vào mục [Contact]
  action: tap_selector
  text: Contact
  delay: 1.0
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
expected:
- assert_text: Add Opportunities
  desc: Hiển thị 'Add Opportunities' trên màn hình
- assert_text: Contacts
  desc: Hiển thị 'Contacts' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Opportunity"
  section. (3) Tap the plus icon on the "Opportunity" section header. After step 3,
  the "Add Opportunities" form should be displayed. (4) Tap the contact field (shows
  "Contact", "None" or a contact name). After step 4, the "Contacts" sheet should
  be displayed. (5) Close the sheet by tapping the handle at its top (id: indicator).
  If there is no "Opportunity" section or plus icon, stop and report the test as skipped:
  opportunity add not available.'
