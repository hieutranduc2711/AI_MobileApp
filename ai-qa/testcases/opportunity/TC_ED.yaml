id: TC_ED
title: Edit first opportunity shows remove
feature: opportunity
priority: High
description: The first card's edit icon opens the edit form with Remove Opportunity.
preconditions: Logged in with the DEFAULT E2E account on a Growth plan with the Opportunity
  addon and customer-opportunity access plus add/edit opportunity permission, app
  on the Home screen (online). The first customer in “Customers” has at least 6 opportunities
  (so “Show All” appears) and at least one contact. No case saves data.
detox_reference: '[DOC+][TC_ED][Card] User taps edit on the first opportunity card
  on customer detail and sees the edit form with delete available'
steps:
- desc: Chọn khách hàng đầu tiên trong danh sách
  action: tap_selector
  resource_id: customer-avatar
  index: 0
  delay: 1.5
- desc: Chạm vào mục [Opportunity]
  action: tap_selector
  text: Opportunity
  delay: 1.0
- desc: Tap the pencil icon on the first opportunity card.
  action: tap_selector
  text: Tap the pencil icon on the fir
  delay: 0.8
expected:
- assert_text: Edit Opportunities
  desc: Hiển thị 'Edit Opportunities' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Tap the search (magnifier)
  icon at the top-right and tap the first customer. (2) Scroll to the "Opportunity"
  section. (3) Tap the pencil icon on the first opportunity card. After step 3, the
  "Edit Opportunities" form should be displayed with "Remove Opportunity" at the bottom.
  If there is no "Opportunity" section or no opportunity card, stop and report the
  test as skipped: no opportunity to edit.'
