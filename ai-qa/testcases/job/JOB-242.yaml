id: JOB-242
title: Devices section menu
feature: job
priority: High
description: The Devices section is shown and its menu can be opened.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-242] User views and interacts with Devices section (add/manage
  tracking devices)'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Devices]
  action: tap_selector
  text: Devices
  delay: 1.0
- desc: Chạm vào mục [Devices]
  action: tap_selector
  text: Devices
  delay: 1.0
expected:
- assert_text: it
  desc: it
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Scroll down
  to the "Devices" section (id: devices-container). After step 2, it should be displayed.
  (3) Tap its menu button, then close the sheet by tapping the handle at its top (id:
  indicator). If there is no "Devices" section, stop and report the test as skipped:
  device addon off.'
