id: JOB-003
title: Financial sections after scrolling
feature: job
priority: High
description: After scrolling, the Invoice or Estimate section is shown when rendered.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-003] After scrolling, financial sections stay in tree when
  rendered'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Scroll the job detail to the bottom.
  action: tap_selector
  text: Scroll the job detail to the b
  delay: 0.8
- desc: Chạm vào mục [Invoice]
  action: tap_selector
  text: Invoice
  delay: 1.0
expected:
- assert_text: Job Details
  desc: Hiển thị 'Job Details' trên màn hình
goal_summary: Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today's calendar (if "Open Incomplete Job" is offered, tap it). (2) Scroll the
  job detail to the bottom. After step 2, "Job Details" should be displayed. (3) Report
  whether the "Invoice" or "Estimate" section is shown; neither is not a failure.
