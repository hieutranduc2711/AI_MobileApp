id: JOB-209
title: Send by Postal Mail
feature: job
priority: High
description: Send by Postal Mail from the job menu opens its screen or dialog.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-209] User tap "Send by postal mail" opens mailing options'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Job Details]
  action: tap_selector
  text: Job Details
  delay: 1.0
- desc: Chạm vào mục [Cancel]
  action: tap_selector
  text: Cancel
  delay: 1.0
expected:
- assert_text: GorillaDesk
  desc: Giao diện GorillaDesk hiển thị đúng
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Tap the
  three-dots icon at the top-right of "Job Details" and choose "Send by Postal Mail".
  (3) Tap "Cancel" in the confirmation. If "Send by Postal Mail" is not in the menu,
  stop and report the test as skipped: option hidden by permission or addon.'
