id: JOB-010
title: Change logs open and return
feature: job
priority: High
description: Show Change Logs opens Change Logs and back returns.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-010] User opens Change logs screen and returns to job detail'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Show Change Logs]
  action: tap_selector
  text: Show Change Logs
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Change Logs
  desc: Hiển thị 'Change Logs' trên màn hình
- assert_text: Job Details
  desc: Hiển thị 'Job Details' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Scroll to
  "Show Change Logs" and tap it. After step 2, the "Change Logs" screen should be
  displayed. (3) Tap the back arrow at the top-left. After step 3, "Job Details" should
  be displayed. If there is no "Show Change Logs", stop and report the test as skipped:
  offline or crew.'
