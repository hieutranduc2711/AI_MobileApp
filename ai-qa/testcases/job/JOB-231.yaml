id: JOB-231
title: Change job status
feature: job
priority: High
description: A job status can be picked from the Job Status sheet.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-231] User opens status modal and actually changes job status'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Tap the job status button in the job header.
  action: tap_selector
  text: Tap the job status button in t
  delay: 0.8
- desc: Chạm vào mục [Job Details]
  action: tap_selector
  text: Job Details
  delay: 1.0
expected:
- assert_text: Job Status
  desc: Hiển thị 'Job Status' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Tap the
  job status button in the job header. After step 2, the "Job Status" sheet should
  be displayed. (3) Tap the first status option (confirm if asked). At the end, "Job
  Details" should be displayed. If there is no status button, stop and report the
  test as skipped: crew role.'
