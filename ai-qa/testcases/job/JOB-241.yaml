id: JOB-241
title: Building section on MDU job
feature: job
priority: High
description: An MDU job shows the Building section; its info can be opened.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-241] User views and interacts with Building section (if MDU
  job)'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Building]
  action: tap_selector
  text: Building
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Building
  desc: Hiển thị 'Building' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Scroll down
  to the "Building" section. After step 2, the "Building" section should be displayed.
  (3) If a building info button is shown, tap it and go back. At the end, "Job Details"
  should be displayed. If there is no "Building" section, stop and report the test
  as skipped: not an MDU job.'
