id: JOB-007
title: Add menu opens
feature: job
priority: High
description: The job plus button opens the add menu.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-007] User opens Add menu and sees job-add-menu-modal'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: 'Close the sheet by tapping the handle at its top (id: indicator).'
  action: tap_selector
  text: Close the sheet by tapping the
  delay: 0.8
expected:
- assert_text: New Invoice
  desc: Hiển thị 'New Invoice' trên màn hình
- assert_text: New Estimate
  desc: Hiển thị 'New Estimate' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Tap the
  plus button at the bottom-right of the job. After step 2, the add menu with "New
  Invoice" or "New Estimate" should be displayed. (3) Close the sheet by tapping the
  handle at its top (id: indicator).'
