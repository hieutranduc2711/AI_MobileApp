id: JOB-215
title: New Material opens material form
feature: job
priority: High
description: New Material from the add menu opens the material form.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-215] User tap "Add material" navigates to material add form'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Bấm nút Thêm mới (+)
  action: tap_selector
  resource_id: highlight-button
  index: -1
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: Add Material
  desc: Hiển thị 'Add Material' trên màn hình
- assert_text: Job Details
  desc: Hiển thị 'Job Details' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Tap the
  plus button at the bottom-right of the job and choose "New Material". After step
  2, the "Add Material" form should be displayed. (3) Tap the back arrow at the top-left.
  After step 3, "Job Details" should be displayed. If there is no plus button or "New
  Material", stop and report the test as skipped: material not available.'
