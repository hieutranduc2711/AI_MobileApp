id: JOB-205
title: Open Customer Account
feature: job
priority: High
description: Open Customer Account from the job menu opens its screen or dialog.
preconditions: Logged in with the DEFAULT E2E account (Admin-like role with job edit/delete,
  invoice/estimate, work-order options), app on the Home screen (online, location
  permission granted) with at least one job on today's calendar. JOB-231 changes the
  job status and JOB-233/234 check in/out on the first job — use a disposable job.
  Customer of that job has a phone number and a service plan.
detox_reference: '[JOB-205] User tap "Open customer account" navigates to customer
  detail'
steps:
- desc: Chọn công việc (Job) đầu tiên trên lịch
  action: tap_selector
  resource_id: highlight-button
  index: 1
  delay: 1.5
- desc: Chạm vào mục [Job Details]
  action: tap_selector
  text: Job Details
  delay: 1.0
- desc: Bấm nút Back quay về màn hình trước
  action: back
  delay: 0.8
expected:
- assert_text: the customer detail screen
  desc: the customer detail screen
- assert_text: Job Details
  desc: Hiển thị 'Job Details' trên màn hình
goal_summary: 'Open the GorillaDesk app on the Home screen. (1) Open the first job
  on today''s calendar (if "Open Incomplete Job" is offered, tap it). (2) Tap the
  three-dots icon at the top-right of "Job Details" and choose "Open Customer Account".
  After step 2, the customer detail screen should be displayed. (3) Tap the back arrow
  at the top-left. After step 3, "Job Details" should be displayed. If "Open Customer
  Account" is not in the menu, stop and report the test as skipped: option hidden.'
